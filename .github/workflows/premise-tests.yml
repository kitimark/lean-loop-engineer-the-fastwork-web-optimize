name: premise-tests

# The empirical premises of the Lean theorems (registry: lean/Fw/Ops/Premise.lean; tests: packages/premise-tests), one tiny
# static page and one Playwright test per premise, on both engines of the gate (Chrome Headless Shell 156.0.8078.4 and
# Playwright WebKit on Linux). The engine jobs always upload their JSON; the `verdict` job runs `pnpm fw premises` on both
# files: it is red when a premise does not hold on an engine (a finding, the theorems that assume it are listed in its
# log) or when the registry and the tests disagree (lint).
on:
  push:
    branches: ['ci/**', main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Same pinned browser as breakpoint-gate and packages/measure-chromium/Dockerfile.
  HS_VERSION: 156.0.8078.4
  HS_SHA256: 81ab9d4d3c301dc5fdfb6c541b9e6632b16fc819a6a854460f40a76fe2b2c476

jobs:
  # Guard (Lean Fw.Ci.Intent + Fw.Ci.Trigger, scripts/ci-paths.mjs). On a ci/* push it, and so every job, is skipped unless
  # the head commit asks for this lane (`[ci:<lane>]`; the default lane lean always); then it runs the workflow only if
  # the commit is the branch tip, is not on main yet, and (lean: always) some file that differs from main on the whole
  # branch is an input. A main push runs when its own diff passes the coarse paths; dispatches, schedules always run.
  # Fails open.
  # Every other job re-checks the tip first (`stale:` fails it) and has its own group, never cancelled on ci/*.
  guard:
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/ci/') || contains(github.event.head_commit.message, '[ci:premise-tests]') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: g
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          GUARD_TOKEN: ${{ github.token }}
        run: node .github/scripts/changed-inputs.mjs --workflow .github/workflows/premise-tests.yml
      - name: 'decision: run'
        if: steps.g.outputs.run == 'true'
        run: 'true'
      - name: 'decision: skip: ${{ steps.g.outputs.reason }}'
        if: steps.g.outputs.run != 'true'
        run: 'true'

  engine:
    needs: [guard]
    if: ${{ needs.guard.outputs.run == 'true' }}
    concurrency:
      group: ci-lane:premise-tests:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:engine:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, playwright-webkit]
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # gate-breakpoints is installed too: the gate-engine action runs `pnpm exec playwright-core install` from its directory
      # (same playwright-core 1.64.1 as packages/premise-tests).
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@fw/gate-breakpoints @fw/premise-tests'
      - uses: ./.github/actions/gate-engine
        with:
          engine: ${{ matrix.engine }}
      - name: Run the premise tests (exit 0 even when a premise fails; the verdict job judges)
        env:
          ENGINE: ${{ matrix.engine }}
        run: node src/run.mjs --engine "$ENGINE" --out out
        working-directory: packages/premise-tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: premises-${{ matrix.engine }}
          path: packages/premise-tests/out/*.json
          if-no-files-found: error
          retention-days: 14

  verdict:
    needs: [engine]
    concurrency:
      group: ci-lane:premise-tests:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:verdict:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@fw/runner...'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: premises-*
          path: premise-results
      - name: Premises against the Lean registry golden (red = a finding or a lint error)
        run: |
          set -o pipefail
          pnpm fw premises --results premise-results | tee premises-verdict.txt
      - name: Step summary
        if: ${{ (always()) && steps.stale.outcome == 'skipped' }}
        run: |
          { echo '### premises'; echo '```'; cat premises-verdict.txt 2>/dev/null || echo 'no verdict'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
