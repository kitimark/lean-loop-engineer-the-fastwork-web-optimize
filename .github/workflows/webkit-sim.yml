name: webkit-sim

# The title of a dispatched run echoes its nonce (`webkit-sim dispatch nonce=<n>`), so `fw run` and `fw ci wait --nonce` find the run
# they dispatched by identity (Lean Fw.Ci.Dispatch.wanted), never as "the newest run". A push keeps its default title.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('webkit-sim dispatch nonce={0}', inputs.nonce || 'none') || '' }}

# WebKit lane (PLAN 4.1-4.2) on the GitHub-hosted xcode-27 macOS image: Mobile Safari in the iOS Simulator over the raw
# Web Inspector protocol, the same code as the local run. Counts only: nothing measured here is phone time.
# The runtime build is checked FIRST; a different iOS runtime build is a different WebKit, so the job stops instead of
# producing counts under the old platform key. The Simulator is booted once and stays booted for the whole job.
on:
  push:
    branches: ['ci/**']
  workflow_dispatch:
    inputs:
      vms:
        description: Independent macOS VMs (1 to 3); each runs the determinism experiment. A push runs 1 (the account has 5 macOS slots shared by all workflows)
        type: string
        default: '1'
      sessions:
        description: Sessions per VM (each session = 2 fresh-load passes, as locally). A push runs 1 until 2 sessions pass on CI; ask for 2 here
        type: string
        default: '1'
      fresh_boot:
        description: Shut the Simulator down and boot it again between sessions (matches the local "independent boots")
        type: boolean
        default: false
      experiment:
        description: determinism (the class table; default) or quiet (webkit-quiet, dose-response of per-step jitter against added host load, one Simulator session per VM)
        type: choice
        options: [determinism, quiet]
        default: determinism
      arms:
        description: quiet only. Busy-loop processes per arm, comma list (0 = the plain pass)
        type: string
        default: '0,1,3'
      reps:
        description: quiet only. Rounds; each round runs every arm once in a rotated order
        type: string
        default: '3'
      lag:
        description: Run the webkit-lag-probe (packages/measure-webkit/src/lag) instead of the determinism sessions; each VM records one session of it, and the lag-report job ranks the regions. Use with target both and vms 3
        type: boolean
        default: false
      cost:
        description: lag only. The WebKit cost-counter passes (Fw.Measure.WkCost) next to the lag passes. off = lag passes only, on = both, only = cost passes only. Passed as --cost to lag/cli.mjs run; the dispatch input is the only selector
        type: choice
        options: ['off', 'on', only]
        default: 'off'
      target:
        description: Which page to measure. original = the read-only snapshot; rewrite = the default prerendered build of apps/site (own VM jobs r1..); both = the two arms, then the step-aligned comparison (align job)
        type: choice
        options: [original, rewrite, both]
        default: original
      preset:
        description: Site preset of the rewrite arm (original = the default config). Needs target rewrite or both; the plan job (Lean, Fw.Measure.SimPlan) refuses it for target original
        type: string
        default: original
      fw:
        description: Flags of the rewrite arm as part:variant,part:variant (parts increasing, each once; the store request field fw). Served as ?fw=...; the original arm never gets them. Needs target rewrite or both
        type: string
        default: ''
      fault:
        description: Fault injection for the fail-fast proof, off by default. kill-safari or kill-proxy starts killing Safari or the inspector proxy 120 s into the session and keeps killing; the run must end with exit 4 within the Lean bound (Fw.Measure.SimBound). A ci/* push sets it with a commit token (fault:kill-safari or fault:kill-proxy in square brackets)
        type: choice
        options: ['', kill-safari, kill-proxy]
        default: ''
      nonce:
        description: >-
          Identity of this dispatch, echoed in the run title (8 to 32 characters of a-z0-9; `fw run` sets it). Empty = a manual dispatch.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  # Guard (Lean Fw.Ci.Intent + Fw.Ci.Trigger, scripts/ci-paths.mjs). On a ci/* push it, and so every job, is skipped unless
  # the head commit asks for this lane (`[ci:<lane>]`; the default lane lean always); then it runs the workflow only if
  # the commit is the branch tip, is not on main yet, and (lean: always) some file that differs from main on the whole
  # branch is an input. A main push starts no run; dispatches always run. Fails open.
  # Every other job re-checks the tip first (`stale:` fails it) and has its own group, never cancelled on ci/*.
  guard:
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/ci/') || contains(github.event.head_commit.message, '[ci:webkit-sim]') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - id: g
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          GUARD_TOKEN: ${{ github.token }}
        run: node .github/scripts/changed-inputs.mjs --workflow .github/workflows/webkit-sim.yml
      - name: 'decision: run'
        if: steps.g.outputs.run == 'true'
        run: 'true'
      - name: 'decision: skip: ${{ steps.g.outputs.reason }}'
        if: steps.g.outputs.run != 'true'
        run: 'true'
  # fwcore (Lean) decides the plan below (Fw.Measure.SimPlan), pairs the steps of the two arms and sums the zones (align job) and
  # pairs the rows of the class tables of the VMs (merge job); built first because the plan job needs it.
  fwcore:
    needs: [guard]
    if: ${{ needs.guard.outputs.run == 'true' }}
    concurrency:
      group: ci-lane:webkit-sim:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:fwcore:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lean
      - name: lake build fwcore
        working-directory: lean
        run: lake build fwcore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fwcore
          path: lean/.lake/build/bin/fwcore
          if-no-files-found: error
          retention-days: 3

  # The plan is Lean's (op measure.simPlan): the refusals, which arms run, the query the rewrite arm is served with, the job
  # matrix. packages/measure-webkit/src/simplan.mjs only passes the inputs in and the reply out.
  plan:
    needs: [guard, fwcore]
    if: ${{ needs.guard.outputs.run == 'true' }}
    concurrency:
      group: ci-lane:webkit-sim:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:plan:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      search: ${{ steps.m.outputs.search }}
      rewrite: ${{ steps.m.outputs.rewrite }}
      both: ${{ steps.m.outputs.both }}
      original: ${{ steps.m.outputs.original }}
      step_min: ${{ steps.m.outputs.step_min }}
      job_min: ${{ steps.m.outputs.job_min }}
      stall_ms: ${{ steps.m.outputs.stall_ms }}
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: packages/measure-webkit/src
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fwcore
          path: ${{ runner.temp }}/bin
      - id: m
        env:
          FWCORE: ${{ runner.temp }}/bin/fwcore
          VMS: ${{ inputs.vms || (contains(github.event.head_commit.message, '[swap-lane]') && '3') || (contains(github.event.head_commit.message, '[end-floor-vms:3]') && '3') || '1' }}
          SESSIONS: ${{ inputs.sessions || '1' }}
          TARGET: ${{ inputs.target || (contains(github.event.head_commit.message, '[swap-lane]') && 'rewrite') || (contains(github.event.head_commit.message, '[end-floor]') && 'rewrite') || 'original' }}
          PRESET: ${{ inputs.preset || 'original' }}
          FW: ${{ inputs.fw || (contains(github.event.head_commit.message, '[swap-lane]') && (contains(github.event.head_commit.message, '[swap-accent]') && 'hero.accent:draw-nolayout' || contains(github.event.head_commit.message, '[swap-fw:accent-nolayout-full]') && 'hero.accent:draw-nolayout-full' || contains(github.event.head_commit.message, '[swap-fw:accent-nolayout]') && 'hero.accent:draw-nolayout' || 'people.carousel:crop')) || (contains(github.event.head_commit.message, '[end-floor]') && 'engine.scroll:unthrottle,hero.exit:threaded,platform:faded-pause') || '' }}
          EXPERIMENT: ${{ inputs.experiment || 'determinism' }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          chmod +x "$FWCORE"
          node packages/measure-webkit/src/simplan.mjs

  # The rewrite arm: the prerendered build of apps/site at this commit (what chromium-counts builds), served by the lane like the
  # snapshot. The default configuration is always prerendered; a query (?preset=, ?fw=) is added as one more page.
  site:
    needs: [plan]
    if: ${{ needs.plan.outputs.rewrite == 'true' }}
    concurrency:
      group: ci-lane:webkit-sim:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:site:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@fw/site...'
      - uses: ./.github/actions/telemetry
        with:
          mode: start
          label: site
      - uses: ./.github/actions/setup-lean
      - uses: ./.github/actions/telemetry
        with:
          mode: cache
          cache-dirs: lake=${{ github.workspace }}/.lake-cache
      - name: Build the rewrite (the default config and the query of the plan)
        env:
          SEARCH: ${{ needs.plan.outputs.search }}
          # end-floor (task sim-end-floor): only the default config and the arms' queries (packages/measure-webkit/src/sim-end-floor.mjs ARMS)
          END_FLOOR: ${{ contains(github.event.head_commit.message, '[end-floor]') && 'yes' || 'no' }}
          # [end-cut] (task sim-end-cut) picks the arm set cut (v2p, parks, pauses, both); without it the sim-floor-attrib set
          EF_ARMS: ${{ contains(github.event.head_commit.message, '[end-cut]') && 'cut' || 'attrib' }}
        run: |
          set -euo pipefail
          if [ "$END_FLOOR" = yes ]; then
            cfg=()
            while IFS= read -r q; do cfg+=(--config "$q"); done < <(node packages/measure-webkit/src/sim-end-floor-cli.mjs searches --arms "$EF_ARMS")
            pnpm --filter @fw/site build --configs none "${cfg[@]}"
          elif [ -n "$SEARCH" ]; then pnpm --filter @fw/site build --config "$SEARCH"; else pnpm --filter @fw/site build; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: apps/site/dist/aot
          if-no-files-found: error
          retention-days: 3
      - uses: ./.github/actions/telemetry
        if: ${{ (always()) && steps.stale.outcome == 'skipped' }}
        with:
          mode: finish
          label: site

  sim:
    needs: [guard, plan, site]
    # site is skipped for target original: that must not skip the sim jobs
    if: ${{ !cancelled() && needs.guard.outputs.run == 'true' && needs.plan.result == 'success' && needs.site.result != 'failure' }}
    concurrency:
      group: ci-lane:webkit-sim:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:sim:${{ strategy.job-index }}
    runs-on: xcode-27
    # Lean's bound (Fw.Measure.SimBound.jobMin via the plan): setup, the measuring step's bound and the tail; the setup allowance is checked against Fw.Measure.SimBound.Seen
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.job_min) }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      FW_IOS_VERSION: '27.0'
      FW_IOS_BUILD: 24A434
      FW_SIM_NAME: fw-iphone-27
      # the measuring step's bound in minutes (Lean Fw.Measure.SimBound.stepMin via the plan): the tick steps' period and deadline
      FW_TICK_STEP_MIN: ${{ needs.plan.outputs.step_min }}
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      # Fail fast: the pin check is the first step after the checkout, before brew or anything that costs minutes.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Pinned iOS runtime build, then create the device
        run: sh .github/scripts/check-simulator.sh --create

      - name: Verify the snapshot against snapshot.lock.json
        if: ${{ matrix.arm == 'original' }}
        run: node .github/scripts/verify-snapshot.mjs

      - uses: ./.github/actions/telemetry
        with:
          mode: start
          label: sim-${{ matrix.vm }}

      # Inspector bridge to the Simulator's webinspectord socket. Not pinned by brew (formula version = the tap's), so the
      # version is recorded in the artifact. The kegs brew adds to the image are cached per image build: a hit unpacks and
      # links them, a miss (or a hit that does not run) installs with brew and saves them.
      - name: ios_webkit_debug_proxy cache key
        id: iwdp-key
        shell: bash
        run: echo "key=iwdp-$(uname -m)-$(sw_vers -productVersion)-$(sw_vers -buildVersion)-${ImageVersion:-none}-v1" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: iwdp-cache
        with:
          path: ${{ runner.temp }}/iwdp
          key: ${{ steps.iwdp-key.outputs.key }}
      - name: ios_webkit_debug_proxy
        shell: bash
        env:
          HIT: ${{ steps.iwdp-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          prefix=$(brew --prefix)
          dir="$RUNNER_TEMP/iwdp"
          ok=no
          if [ "$HIT" = true ] && [ -f "$dir/kegs.txt" ]; then
            if tar -xf "$dir/kegs.tar" -C "$prefix/Cellar" \
              && while read -r k; do ln -sfn "../Cellar/$k" "$prefix/opt/${k%/*}"; done < "$dir/kegs.txt" \
              && brew link --overwrite ios-webkit-debug-proxy > /dev/null \
              && ios_webkit_debug_proxy --help > /dev/null 2>&1; then
              ok=yes
              echo "ios_webkit_debug_proxy: unpacked from the cache"
            else
              echo "ios_webkit_debug_proxy: the cache did not run, installing with brew"
              while read -r k; do rm -rf "${prefix:?}/Cellar/$k"; rm -f "${prefix:?}/opt/${k%/*}"; done < "$dir/kegs.txt"
            fi
          fi
          if [ "$ok" = no ]; then
            rm -rf "$dir"
            mkdir -p "$dir"
            find "$prefix/Cellar" -mindepth 2 -maxdepth 2 -type d | sed "s|^$prefix/Cellar/||" | LC_ALL=C sort > "$dir/before.txt"
            brew install ios-webkit-debug-proxy
            find "$prefix/Cellar" -mindepth 2 -maxdepth 2 -type d | sed "s|^$prefix/Cellar/||" | LC_ALL=C sort > "$dir/after.txt"
            LC_ALL=C comm -13 "$dir/before.txt" "$dir/after.txt" > "$dir/kegs.txt"
            tar -cf "$dir/kegs.tar" -C "$prefix/Cellar" -T "$dir/kegs.txt"
            rm "$dir/before.txt" "$dir/after.txt"
          fi
          command -v ios_webkit_debug_proxy
          brew list --versions ios-webkit-debug-proxy

      - name: The rewrite build (site job)
        if: ${{ matrix.arm == 'rewrite' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: ${{ runner.temp }}/site

      - name: Tool and runner facts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/result"
          sh .github/scripts/runner-info.sh "$RUNNER_TEMP/result/runner.json"
          {
            sw_vers
            xcodebuild -version
            xcrun simctl list runtimes
            brew list --versions ios-webkit-debug-proxy
            sysctl -n hw.ncpu hw.memsize
          } | tee "$RUNNER_TEMP/result/tools.txt"

      # Boot once and keep it booted; bootDevice() is idempotent and every command below passes --keep.
      - name: Boot the Simulator (kept booted for the whole job)
        run: |
          set -euo pipefail
          xcrun simctl shutdown all || true
          udid=$(cat "$RUNNER_TEMP/fw-sim-udid.txt")
          boot_from=$(date +%s)
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          # telemetry (task ci-telemetry): the boot time of this Simulator, whole seconds
          node scripts/ci-telemetry/cli.mjs sim-boot-ms $(( ($(date +%s) - boot_from) * 1000 )) || true

      # The measuring step runs in the background (own process group) so that tick steps can upload while it runs: a job lost or stopped at its cap
      # then still leaves every finished pass and the telemetry probes (task macos-vm-upload; Lean Fw.Ci.Telemetry.wakeWhy, tickPeriodMin).
      - name: Determinism sessions (start in the background)
        env:
          FW_SNAPSHOT_SITE: ${{ github.workspace }}/snapshot/site
          SESSIONS: ${{ inputs.sessions || '1' }}
          FRESH: ${{ inputs.fresh_boot && 'yes' || 'no' }}
          VM: ${{ matrix.vm }}
          ARM: ${{ matrix.arm }}
          # the query this cell is served with (Lean's plan: empty for every original cell and for the default rewrite)
          SEARCH: ${{ matrix.search }}
          SITE_DIR: ${{ runner.temp }}/site
          EXPERIMENT: ${{ inputs.experiment || 'determinism' }}
          # end-floor (task sim-end-floor): the head commit says [end-floor]; one Simulator session loads the four arms of the site build and records the end-of-page idle recalcs
          END_FLOOR: ${{ contains(github.event.head_commit.message, '[end-floor]') && 'yes' || 'no' }}
          # [end-floor-vms:3] (task sim-floor-attrib): seven arms do not fit three rounds in one step, so each of 3 jobs runs one round, arm order rotated by 2 per job
          EF_ROUNDS: ${{ contains(github.event.head_commit.message, '[end-floor-vms:3]') && '1' || '3' }}
          # [end-cut] (task sim-end-cut): four arms, so the order rotates by 1 per job (v2p, parks, pauses first)
          EF_ARMS: ${{ contains(github.event.head_commit.message, '[end-cut]') && 'cut' || 'attrib' }}
          EF_ROT: ${{ contains(github.event.head_commit.message, '[end-cut]') && '1' || '2' }}
          LAG: ${{ (inputs.lag || contains(github.event.head_commit.message, '[swap-lane]')) && 'yes' || 'no' }}
          # lag cost passes: the cost dispatch input (off|on|only); a push carries no inputs, so it is off, unless the head commit says [swap-lane]:
          # then a push runs the swap lane (rewrite, fw people.carousel:crop, 3 VMs, lag cost only; task carousel-swap-webkit-lane)
          COST: ${{ inputs.cost || (contains(github.event.head_commit.message, '[swap-lane]') && 'only') || 'off' }}
          # swap-window pass (--swap) only when the head commit says [swap-lane]
          SWAP: ${{ contains(github.event.head_commit.message, '[swap-lane]') && '--swap' || '' }}
          # hero.accent frozen from the harness (--freeze hero-accent) only when the head commit says [swap-freeze] next to [swap-lane]
          FREEZE: ${{ contains(github.event.head_commit.message, '[swap-freeze]') && '--freeze hero-accent' || '' }}
          # the accent lane (--accent: faithful, draw-nolayout and draw-nolayout-full of hero.accent, swap and hero-exit captures, plus a draw-frozen faithful state) only when the head commit says [swap-accent] next to [swap-lane]
          ACCENT: ${{ contains(github.event.head_commit.message, '[swap-accent]') && '--accent' || '' }}
          # the freeze and accent runs are one pass per job (13 to 14 loads; the runners are slow), the state order alternating by VM number
          PASSES: ${{ (contains(github.event.head_commit.message, '[swap-freeze]') || contains(github.event.head_commit.message, '[swap-accent]')) && '1' || '2' }}
          # the numeric job id, written into every sample's job key
          FW_JOB_ID: ${{ job.check_run_id }}
          ARMS: ${{ inputs.arms || '0,1,3' }}
          REPS: ${{ inputs.reps || '3' }}
          # The runner (3 vCPU) boots the Simulator and Safari several times slower than a Mac: every wait in
          # packages/measure-webkit is multiplied by this (counts do not depend on waits), and a load + scroll step
          # may retry twice after a reconnect. Local runs use neither (defaults 1 and 2).
          FW_WK_TIMEOUT_SCALE: '8'
          FW_WK_ATTEMPTS: '3'
          # stall watchdog: Lean's Fw.Measure.SimBound.stallMs via the plan; it is main's limit, checked against the silences in Fw.Measure.SimBound.Seen
          FW_WK_STALL_MS: ${{ needs.plan.outputs.stall_ms }}
          # retry gate: the step bound in minutes (Lean: SimBound.stepMin via the plan); a retry that would end past it is not started (Fw.Measure.SimHost.retryFits)
          FW_WK_STEP_MIN: ${{ needs.plan.outputs.step_min }}
          # fail-fast proof: the fault input, or the commit token of a ci/* push (a push carries no inputs); empty = no fault
          FW_WK_FAULT: ${{ inputs.fault || (contains(github.event.head_commit.message, '[fault:kill-safari]') && 'kill-safari') || (contains(github.event.head_commit.message, '[fault:kill-proxy]') && 'kill-proxy') || '' }}
        working-directory: packages/measure-webkit
        run: |
          set -euo pipefail
          mkdir -p out
          body="$RUNNER_TEMP/measure-body.sh"
          cat > "$body" <<'BODY'
          set -euo pipefail
          # rewrite arm: --site serves the prerendered build at the planned query (empty = default config) instead of the snapshot
          site=()
          if [ "$ARM" = rewrite ]; then site=(--site "$SITE_DIR" --search "$SEARCH"); fi
          if [ "$END_FLOOR" = yes ]; then
            n="${VM//[!0-9]/}"; n="${n:-1}"
            node src/sim-end-floor-cli.mjs run --site "$SITE_DIR" --arms "$EF_ARMS" --rounds "$EF_ROUNDS" --rotate "$(( (n - 1) * EF_ROT ))" --out out --name "$VM-end-floor" 2> >(tee "out/$VM-end-floor.log" >&2)
            ls -l out
            exit 0
          fi
          if [ "$EXPERIMENT" = quiet ]; then
            node src/cli.mjs quiet --arms "$ARMS" --reps "$REPS" --keep --out "out/$VM-quiet.json" 2> >(tee "out/$VM-quiet.log" >&2)
            ls -l out
            exit 0
          fi
          if [ "$LAG" != yes ] && [ "$COST" != off ]; then echo "::error::cost=$COST needs lag=true"; exit 2; fi
          if [ "$LAG" = yes ]; then
            node src/lag/cli.mjs run --passes "$PASSES" --cost "$COST" $SWAP $ACCENT $FREEZE --keep ${site[@]+"${site[@]}"} --out "out/$VM-lag.json" 2> >(tee "out/$VM-lag.log" >&2)
            ls -l out
            exit 0
          fi
          for s in $(seq 1 "$SESSIONS"); do
            keep=--keep
            # fresh_boot: no --keep, so each session ends with the device shut down and the next one boots it again
            if [ "$FRESH" = yes ]; then keep=; fi
            node src/cli.mjs determinism --runs 2 $keep ${site[@]+"${site[@]}"} --out "out/$VM-session-$s.json" 2> >(tee "out/$VM-session-$s.log" >&2) | tee "out/$VM-session-$s.md"
          done
          ls -l out
          BODY
          node ../../scripts/ci-telemetry/tick.mjs launch -- bash "$body"

      - name: 'Upload tick 1: wait for a new pass, the period or the end'
        id: tick1
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(needs.plan.outputs.step_min) }}
        run: node scripts/ci-telemetry/tick.mjs wait 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.tick1.outputs.stage == 'yes' }}
        continue-on-error: true
        with:
          name: sim-tick-${{ matrix.vm }}-1
          path: ${{ runner.temp }}/fw-measure/tick/1
          if-no-files-found: ignore
          retention-days: 7
      - name: 'Upload tick 2: wait for a new pass, the period or the end'
        id: tick2
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(needs.plan.outputs.step_min) }}
        run: node scripts/ci-telemetry/tick.mjs wait 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.tick2.outputs.stage == 'yes' }}
        continue-on-error: true
        with:
          name: sim-tick-${{ matrix.vm }}-2
          path: ${{ runner.temp }}/fw-measure/tick/2
          if-no-files-found: ignore
          retention-days: 7
      - name: 'Upload tick 3: wait for a new pass, the period or the end'
        id: tick3
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(needs.plan.outputs.step_min) }}
        run: node scripts/ci-telemetry/tick.mjs wait 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.tick3.outputs.stage == 'yes' }}
        continue-on-error: true
        with:
          name: sim-tick-${{ matrix.vm }}-3
          path: ${{ runner.temp }}/fw-measure/tick/3
          if-no-files-found: ignore
          retention-days: 7
      - name: 'Upload tick 4: wait for a new pass, the period or the end'
        id: tick4
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(needs.plan.outputs.step_min) }}
        run: node scripts/ci-telemetry/tick.mjs wait 4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.tick4.outputs.stage == 'yes' }}
        continue-on-error: true
        with:
          name: sim-tick-${{ matrix.vm }}-4
          path: ${{ runner.temp }}/fw-measure/tick/4
          if-no-files-found: ignore
          retention-days: 7
      - name: 'Upload tick 5: wait for a new pass, the period or the end'
        id: tick5
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(needs.plan.outputs.step_min) }}
        run: node scripts/ci-telemetry/tick.mjs wait 5
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.tick5.outputs.stage == 'yes' }}
        continue-on-error: true
        with:
          name: sim-tick-${{ matrix.vm }}-5
          path: ${{ runner.temp }}/fw-measure/tick/5
          if-no-files-found: ignore
          retention-days: 7
      - name: 'Upload tick 6: wait for a new pass, the period or the end'
        id: tick6
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(needs.plan.outputs.step_min) }}
        run: node scripts/ci-telemetry/tick.mjs wait 6
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.tick6.outputs.stage == 'yes' }}
        continue-on-error: true
        with:
          name: sim-tick-${{ matrix.vm }}-6
          path: ${{ runner.temp }}/fw-measure/tick/6
          if-no-files-found: ignore
          retention-days: 7
      - name: 'Upload tick 7: wait for a new pass, the period or the end'
        id: tick7
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(needs.plan.outputs.step_min) }}
        run: node scripts/ci-telemetry/tick.mjs wait 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.tick7.outputs.stage == 'yes' }}
        continue-on-error: true
        with:
          name: sim-tick-${{ matrix.vm }}-7
          path: ${{ runner.temp }}/fw-measure/tick/7
          if-no-files-found: ignore
          retention-days: 7
      - name: 'Upload tick 8: wait for a new pass, the period or the end'
        id: tick8
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(needs.plan.outputs.step_min) }}
        run: node scripts/ci-telemetry/tick.mjs wait 8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.tick8.outputs.stage == 'yes' }}
        continue-on-error: true
        with:
          name: sim-tick-${{ matrix.vm }}-8
          path: ${{ runner.temp }}/fw-measure/tick/8
          if-no-files-found: ignore
          retention-days: 7

      - name: Determinism sessions
        timeout-minutes: ${{ fromJSON(needs.plan.outputs.step_min) }}   # Lean: Fw.Measure.SimBound.stepMin, via the plan
        run: node scripts/ci-telemetry/tick.mjs await

      # The within-VM class tables are made by the merge job: pairing rows is fwcore's (Lean) and this job has no Linux binary.

      # Steps after the measurement step are the Lean allowlist (Fw.Ci.Steps, scripts/ci-steps-lint.mjs). The VM is discarded
      # after the job, so the Simulator is neither shut down nor deleted. Kept when a session failed; no step has a timeout.
      - name: Keep logs
        if: ${{ (!cancelled()) && steps.stale.outcome == 'skipped' }}
        working-directory: packages/measure-webkit
        env:
          VM: ${{ matrix.vm }}
        run: |
          mkdir -p out "$RUNNER_TEMP/result"
          cp out/"$VM"-* "$RUNNER_TEMP/result/" 2>/dev/null || true

      # Host state, only after a failure: where a slow start stalled. The whole block runs in the background and is abandoned after 45 s, so a wedged Simulator cannot hold the upload (run 40162538610 r1 lost its logs to a 16 min hang here).
      - name: Host state on failure
        if: ${{ failure() && steps.stale.outcome == 'skipped' }}
        continue-on-error: true
        env:
          VM: ${{ matrix.vm }}
        run: |
          out="$RUNNER_TEMP/result/$VM-host.txt"
          bounded() { perl -e 'alarm 20; exec @ARGV' -- "$@"; }
          # shellcheck disable=SC2009
          { uptime; bounded xcrun simctl list devices booted; ps -axo pid,pcpu,rss,comm | sort -k2 -nr | head -15; ps -axo pid,ppid,etime,stat,command | grep -E "cli.mjs|ios_webkit|tee " | grep -v grep; } > "$out" 2>&1 < /dev/null &
          pid=$!
          for _ in $(seq 1 45); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          if kill -0 "$pid" 2>/dev/null; then echo "host state: abandoned after 45 s" >> "$out"; kill -9 "$pid" 2>/dev/null || true; fi
          exit 0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ (!cancelled()) && steps.stale.outcome == 'skipped' }}
        with:
          name: webkit-sim-${{ matrix.vm }}
          path: ${{ runner.temp }}/result
          if-no-files-found: error
          retention-days: 30
      - uses: ./.github/actions/telemetry
        if: ${{ (always()) && steps.stale.outcome == 'skipped' }}
        with:
          mode: finish
          label: sim-${{ matrix.vm }}

  # Classes over all VMs (the worse class wins, as `merge` does locally; rows are paired by key in Lean, rows not every VM has
  # are listed as unpaired). Needs node and fwcore only, so it runs on Linux.
  merge:
    needs: [plan, sim, fwcore]
    if: ${{ needs.plan.outputs.original == 'true' && (inputs.experiment || 'determinism') == 'determinism' && !inputs.lag }}
    concurrency:
      group: ci-lane:webkit-sim:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:merge:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: webkit-sim-*
          path: ${{ runner.temp }}/vms
          # one artifact per VM; with a single match the action extracts it without a subdirectory, so subdirectories cannot be
          # relied on. Merging flat is safe: every file name starts with its VM (v1-session-1.json).
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fwcore
          path: ${{ runner.temp }}/bin
      - name: Classes over all sessions of all VMs
        env:
          FWCORE: ${{ runner.temp }}/bin/fwcore
        run: |
          set -euo pipefail
          chmod +x "$FWCORE"
          out="$RUNNER_TEMP/classes"
          mkdir -p "$out"
          # the classes are those of the original arm (v*); the rewrite arm (r*) is compared by the align job
          files=("$RUNNER_TEMP"/vms/v*-session-*.json)
          printf "%s\n" "${files[@]}"
          node packages/measure-webkit/src/cli.mjs merge "${files[@]}" | tee "$out/classes.md"
          # within-VM tables (all sessions of one VM), as the sim jobs made them before merge needed fwcore
          for f in "$RUNNER_TEMP"/vms/*-session-1.json; do
            vm=$(basename "$f"); vm=${vm%%-session-*}
            node packages/measure-webkit/src/cli.mjs merge "$RUNNER_TEMP"/vms/"$vm"-session-*.json > "$out/$vm-classes.md"
          done
          sha256sum "${files[@]}" | tee "$out/sha256.txt"
          {
            echo '### webkit-sim: classes over all VMs and sessions (worst wins)'
            cat "$out/classes.md"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webkit-classes
          path: ${{ runner.temp }}/classes
          if-no-files-found: error
          retention-days: 30

  # Original against rewrite by scroll position (Lean: Fw.Measure.StepAlign). Pair vN/rN session k: pass i of one against
  # pass i of the other. Only meaningful for target both. Linux: it needs node and fwcore only.
  align:
    needs: [plan, sim, fwcore]
    if: ${{ needs.plan.outputs.both == 'true' && needs.sim.result == 'success' && !inputs.lag }}
    concurrency:
      group: ci-lane:webkit-sim:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:align:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: webkit-sim-*
          path: ${{ runner.temp }}/vms
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fwcore
          path: ${{ runner.temp }}/bin
      - name: Align A (v) and R (r) per VM and session
        env:
          FWCORE: ${{ runner.temp }}/bin/fwcore
        run: |
          set -euo pipefail
          chmod +x "$FWCORE"
          out="$RUNNER_TEMP/align"
          mkdir -p "$out"
          for a in "$RUNNER_TEMP"/vms/v*-session-*.json; do
            n=$(basename "$a"); r="$RUNNER_TEMP/vms/r${n#v}"
            test -f "$r" || { echo "no rewrite counterpart for $n" >&2; exit 1; }
            node packages/measure-webkit/src/cli.mjs align "$a" "$r" --out "$out/${n%.json}.align.json" | tee "$out/${n%.json}.align.md"
          done
          # classes of the full-zone sums over every pass of every VM and session (deterministic / stable / quarantined)
          args=()
          for a in "$RUNNER_TEMP"/vms/v*-session-*.json; do n=$(basename "$a"); args+=("$a" "$RUNNER_TEMP/vms/r${n#v}"); done
          node packages/measure-webkit/src/cli.mjs align-classes "${args[@]}" --types RecalculateStyles,Layout,Paint,Composite,RenderingFrame --out "$out/classes.align.json" | tee "$out/classes.align.md"
          {
            echo '### webkit-sim: original (A) against rewrite (R) by scroll position'
            echo '#### classes of the full-zone sums over all passes'
            cat "$out/classes.align.md"
            echo '#### per zone, per VM and session'
            cat "$out"/v*.align.md
            echo '#### pages served (query, config hash, viewport width, document height, hydration)'
            for f in "$RUNNER_TEMP"/vms/*-session-1.json; do
              echo "- $(basename "$f" .json): $(jq -c '{search: (.site.search // ""), site: .site.configHash, vw: .passes[0].info.vw, docH: .passes[0].info.docH, fw: .passes[0].info.fw}' "$f")"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$RUNNER_TEMP"/vms/*-session-*.json | tee "$out/sha256.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webkit-align
          path: ${{ runner.temp }}/align
          if-no-files-found: error
          retention-days: 30

  # The ranked attribution of the lag probe (webkit-lag-probe): original (vN) against faithful rewrite (rN), every VM's session.
  lag-report:
    needs: [guard, plan, sim]
    # !cancelled(): a session whose lag JSON was written but whose later step failed (Keep logs and host state) still counts; the CLI takes the partial sessions.
    if: ${{ !cancelled() && needs.guard.outputs.run == 'true' && needs.plan.result == 'success' && inputs.lag && needs.plan.outputs.both == 'true' && needs.sim.result != 'cancelled' }}
    concurrency:
      group: ci-lane:webkit-sim:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:lag-report:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: webkit-sim-*
          path: ${{ runner.temp }}/vms
          merge-multiple: true
      - name: Rank the regions
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/lag"
          mkdir -p "$out"
          shopt -s nullglob
          join_files() { local IFS=,; echo "$*"; }
          origs=("$RUNNER_TEMP"/vms/v*-lag.json)
          faiths=("$RUNNER_TEMP"/vms/r*-lag.json)
          echo "original sessions: ${#origs[@]}, faithful sessions: ${#faiths[@]}"
          if [ "${#origs[@]}" -eq 0 ] || [ "${#faiths[@]}" -eq 0 ]; then echo "no lag JSON for one arm"; exit 1; fi
          sha256sum "${origs[@]}" "${faiths[@]}" | tee "$out/sha256.txt"
          orig=$(join_files "${origs[@]}")
          faith=$(join_files "${faiths[@]}")
          node packages/measure-webkit/src/lag/cli.mjs report --original "$orig" --faithful "$faith" --json "$out/lag-report.json" | tee "$out/lag-report.md"
          { echo '### webkit-sim: lag regions, original against faithful'; cat "$out/lag-report.md"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webkit-lag-report
          path: ${{ runner.temp }}/lag
          if-no-files-found: error
          retention-days: 30
