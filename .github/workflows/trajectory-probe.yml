name: trajectory-probe

# The title of a dispatched run echoes its nonce (`trajectory-probe dispatch nonce=<n>`), so `fw run --trajectory` finds the run it
# dispatched by identity (Lean Fw.Ci.Dispatch.pick; `fw ci wait --nonce` uses Dispatch.select), never as "the newest run". A push keeps its default title (the commit subject);
# the inputs it ran with are in the step name `trajectory inputs: ...` of job `site` and in the artifact `trajectory-inputs`.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('trajectory-probe dispatch nonce={0}', inputs.nonce || 'none') || '' }}

# The trajectory probe (task trajectory-probe): does the rewrite MOVE like the original along a scroll path? The breakpoint gate,
# the counts and the goldens compare rest states and frame counts, so they missed three bugs of the motion itself (hero copy and
# cards stale in WebKit under hero.exit:scoped; nav classes stale under morph.tween:waapi; is-on-dark never re-evaluated on the
# morph). Docs: docs/team/tools/trajectory-probe.md; code: packages/gate-breakpoints/src/trajectory/; the verdicts are Lean's
# (lean/Fw/Gate/Trajectory.lean, golden packages/contracts/golden/gate/trajectory.jsonl).
# Engines on the runner: Chrome Headless Shell (the counts lane's browser) and Playwright WebKit on Linux (a WebKitGTK/WPE port,
# NOT Safari). The probe reads getComputedStyle and takes no screenshot; a FAIL verdict is a result, so the job exits 0 once the
# probe completed (the verdicts are in the step summary and the artifact `trajectory-<engine>`).
# Legs and paths (Lean Fw.Gate.Trajectory: enginesOf, legs, walks, plan; the node twin packages/gate-breakpoints/src/trajectory/plan.mjs): the
# site job plans the matrix. Every engine is split into width legs that run in parallel (Linux one width per leg, macOS two legs), each leg
# uploads `trajectory-leg-<engine>-<leg>`, and a merge job per lane joins the legs of one engine and reduces them as one run into the
# artifact the recorder reads (`trajectory-<engine>`, `trajectory-apple`): the artifact layout did not change. An engine walks the paths it can
# decide: Chromium and macOS WebKit hero and morph, Linux WebKit hero only (its 150 ms frames cannot decide the morph pushes).
# Apple witness (job probe-apple): the same lane on a free standard macos-26 runner with Playwright WebKit (the macOS build, the
# closest engine CI has to Safari), the dispatched rewrite search vs the original on the hero and morph paths. It runs for every dispatch
# whose engines include playwright-webkit (Lean enginesOf: macOS WebKit runs with every WebKit), so each flag can get the
# macOS morph cell v2-proved needs; on a ci/* push it runs only when the commit carries `[frames:` or its probe line names a page recorder
# (`debug=`): Lean `Fw.Ci.Trigger.appleRuns` decides, the plan step prints it as `apple_run` and the `if:` below only reads it;
# max-parallel 2 (5 macOS slots are shared across lanes); its verdict is a separate artifact `trajectory-apple` and never part of the Linux verdicts.
# Frames on macOS (task earn-look-review-webkit): a ci/* push whose head commit carries `[frames:<part:variant>]` also runs job probe-apple,
# with its walk skipped and a frames step in its place (no second macOS job); merge-apple skips. Docs: docs/team/tools/trajectory-frames.md.
on:
  # Every push creates a run and its guard job decides on these inputs (Lean Fw.Ci.Intent); `workflow_dispatch` runs it on demand
  # (pnpm -s fw run --trajectory ...). Why: docs/team/handoffs/ci-trigger-scope.md.
  push:
    branches: ['ci/**']
  workflow_dispatch:
    inputs:
      engines:
        description: Engines to run
        type: choice
        options: [both, chromium, playwright-webkit]
        default: both
      fw:
        description: >-
          Flag set of the rewrite arm, e.g. hero.exit:scoped (becomes ?fw=...; the build prerenders every single-variant page). Allowed characters: [A-Za-z0-9.:,-_@]. Empty = the default config.
        type: string
        default: ''
      preset:
        description: >-
          Preset of the rewrite arm, e.g. v2-proved (becomes ?preset=...; the build prerenders every preset). Exclusive with fw. Empty = none.
        type: string
        default: ''
      widths:
        description: >-
          Widths to walk, comma separated, from 390, 640, 641, 1280 without repeats. Empty = all four. A subset needs diagnostic = true.
        type: string
        default: ''
      diagnostic:
        description: >-
          Mark the run diagnostic (read by hand, never stored or judged): only then may widths be a subset. A verdict run (the default) walks all four widths.
        type: boolean
        default: false
      nonce:
        description: >-
          Identity of this dispatch, echoed in the run title (8 to 32 characters of a-z0-9; `fw run --trajectory` sets it). Empty = a manual dispatch.
        type: string
        default: ''

permissions:
  contents: read

env:
  # Same pinned browser as packages/measure-chromium/Dockerfile.
  HS_VERSION: 156.0.8078.4
  HS_SHA256: 81ab9d4d3c301dc5fdfb6c541b9e6632b16fc819a6a854460f40a76fe2b2c476

jobs:
  # Guard (Lean Fw.Ci.Intent + Fw.Ci.Trigger, scripts/ci-paths.mjs). On a ci/* push it, and so every job, is skipped unless
  # the head commit asks for this lane (`[ci:<lane>]`; the default lane lean always); then it runs the workflow only if
  # the commit is the branch tip, is not on main yet, and (lean: always) some file that differs from main on the whole
  # branch is an input. A main push starts no run; dispatches always run. Fails open.
  # Every other job re-checks the tip first (`stale:` fails it) and has its own group, never cancelled on ci/*.
  guard:
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/ci/') || contains(github.event.head_commit.message, '[ci:trajectory-probe]') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - id: g
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          GUARD_TOKEN: ${{ github.token }}
        run: node .github/scripts/changed-inputs.mjs --workflow .github/workflows/trajectory-probe.yml
      - name: 'decision: run'
        if: steps.g.outputs.run == 'true'
        run: 'true'
      - name: 'decision: skip: ${{ steps.g.outputs.reason }}'
        if: steps.g.outputs.run != 'true'
        run: 'true'

  # The rewrite, built once; every probe job downloads this exact build. The search of the rewrite arm and the widths are decided
  # here, so a refused input fails in a minute instead of after a build.
  site:
    needs: [guard]
    if: ${{ needs.guard.outputs.run == 'true' }}
    concurrency:
      group: ci-lane:trajectory-probe:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:site:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    outputs:
      engines: ${{ steps.p.outputs.engines }}
      linux: ${{ steps.p.outputs.linux }}
      apple: ${{ steps.p.outputs.apple }}
      apple_n: ${{ steps.p.outputs.apple_n }}
      apple_run: ${{ steps.p.outputs.apple_run }}
      search: ${{ steps.p.outputs.search }}
      widths: ${{ steps.p.outputs.widths }}
      debug: ${{ steps.p.outputs.debug }}
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/telemetry
        with:
          mode: start
          label: site
      # The inputs of this run: a dispatch's own, or on a ci/* push the `[trajectory ...]` line of the head commit (Lean
      # Fw.Ci.Trigger.pushProbe, twin .github/scripts/trajectory-line.mjs). A line that does not parse fails the job with its reason.
      - id: in
        name: Read the inputs (dispatch inputs or the commit line)
        env:
          EVENT: ${{ github.event_name }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
          LANE: trajectory  # Lean ProbeLane: the mark rule binds this lane; a [frames: message is exempt (Lean effLane)
          ENGINES: ${{ inputs.engines || 'both' }}
          FW: ${{ inputs.fw || '' }}
          PRESET: ${{ inputs.preset || '' }}
          WIDTHS: ${{ inputs.widths || '' }}
          DIAGNOSTIC: ${{ inputs.diagnostic && 'true' || 'false' }}
        run: |
          set -euo pipefail
          # The mark rule (Lean Fw.Gate.Trajectory.Dispatch) on a dispatch's widths and diagnostic inputs, or on a push line's widths and diagnostic word, runs
          # here, the first step that reads the inputs: a width subset without diagnostic fails the run before the build, with the Dispatch refusal text.
          node --test .github/scripts/trajectory-line.test.mjs  # the line parser equals Lean pushProbe, the mark rule equals Lean Dispatch
          node .github/scripts/trajectory-line.mjs | tee -a "$GITHUB_OUTPUT"
      - name: 'trajectory inputs: engines=${{ steps.in.outputs.engines }} fw=${{ steps.in.outputs.fw }} preset=${{ steps.in.outputs.preset }} widths=${{ steps.in.outputs.widths }} debug=${{ steps.in.outputs.debug }} diagnostic=${{ steps.in.outputs.diagnostic }} (${{ steps.in.outputs.source }})'
        env:
          NONCE: ${{ inputs.nonce }}
          IN_ENGINES: ${{ steps.in.outputs.engines }}
          IN_FW: ${{ steps.in.outputs.fw }}
          IN_PRESET: ${{ steps.in.outputs.preset }}
          IN_WIDTHS: ${{ steps.in.outputs.widths }}
          IN_DEBUG: ${{ steps.in.outputs.debug }}
          IN_DIAGNOSTIC: ${{ steps.in.outputs.diagnostic }}
          IN_SOURCE: ${{ steps.in.outputs.source }}
        run: |
          set -euo pipefail
          mkdir -p trajectory-inputs
          jq -n --arg event "$GITHUB_EVENT_NAME" --arg sha "$GITHUB_SHA" --arg nonce "$NONCE" --arg engines "$IN_ENGINES" --arg fw "$IN_FW" --arg preset "$IN_PRESET" --arg widths "$IN_WIDTHS" --arg debug "$IN_DEBUG" --arg diagnostic "$IN_DIAGNOSTIC" --arg source "$IN_SOURCE" \
            '{event:$event,sha:$sha,nonce:$nonce,engines:$engines,fw:$fw,preset:$preset,widths:$widths,debug:$debug,diagnostic:($diagnostic == "true"),source:$source}' | tee trajectory-inputs/inputs.json
          echo "inputs: engines=$IN_ENGINES fw=$IN_FW preset=$IN_PRESET widths=$IN_WIDTHS debug=$IN_DEBUG diagnostic=$IN_DIAGNOSTIC source=$IN_SOURCE sha=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trajectory-inputs
          path: trajectory-inputs/inputs.json
          if-no-files-found: error
          retention-days: 3
      - id: p
        name: Plan the probe (engines, search, widths)
        env:
          ENGINES: ${{ steps.in.outputs.engines }}
          FW: ${{ steps.in.outputs.fw }}
          PRESET: ${{ steps.in.outputs.preset }}
          WIDTHS: ${{ steps.in.outputs.widths }}
          DEBUG: ${{ steps.in.outputs.debug }}
          EVENT: ${{ github.event_name }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          node --test .github/scripts/gate-search.test.mjs  # the search decision equals Fw.Gate.Search
          search=$(node .github/scripts/gate-search.mjs --fw "$FW" --preset "$PRESET")
          case "$ENGINES" in
            both) engines='["chromium","playwright-webkit"]' ;;
            chromium) engines='["chromium"]' ;;
            playwright-webkit) engines='["playwright-webkit"]' ;;
            *) echo "bad engines" >&2; exit 1 ;;
          esac
          # The widths allowlist is Lean's (Fw.Gate.Trajectory.pickWidths); the node twin refuses the same inputs.
          node --input-type=module -e 'import { pickWidths } from "./packages/gate-breakpoints/src/trajectory/reduce.mjs"; if (pickWidths(process.env.WIDTHS) === null) { console.error("widths must be a comma list of 390, 640, 641, 1280 without repeats"); process.exit(1); }'
          # The legs (matrix rows: engine, widths, paths) are Lean's (Fw.Gate.Trajectory.plan); plan.mjs is its twin.
          plan=$(node packages/gate-breakpoints/src/trajectory/plan.mjs "$ENGINES" "$WIDTHS")
          {
            echo "engines=$engines"
            echo "linux=$(echo "$plan" | jq -c .linux)"
            echo "apple=$(echo "$plan" | jq -c .apple)"
            echo "apple_n=$(echo "$plan" | jq '.apple.include | length')"
            echo "search=$search"
            echo "widths=$WIDTHS"
            echo "debug=$DEBUG"
            # Does the macOS leg run? Lean's Fw.Ci.Trigger.appleRuns; the twin is .github/scripts/trajectory-line.mjs.
            APPLE_N=$(echo "$plan" | jq '.apple.include | length') node .github/scripts/trajectory-line.mjs apple
          } >> "$GITHUB_OUTPUT"
          echo "$engines search=$search widths=${WIDTHS:-all}"
          echo "$plan" | jq -c '.linux.include[], .apple.include[]'

      - uses: ./.github/actions/setup-lean
      - uses: ./.github/actions/telemetry
        with:
          mode: cache
          cache-dirs: lake=${{ github.workspace }}/.lake-cache
      # `pnpm build` of the site first runs `lake exe breakgen --check` (the checked-in gen file must equal Lean's output).
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@fw/site...'
      - name: Build the rewrite (default prerendered config)
        run: pnpm --filter @fw/site build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: apps/site/dist/aot
          if-no-files-found: error
          retention-days: 3
      - uses: ./.github/actions/telemetry
        if: ${{ (always()) && steps.stale.outcome == 'skipped' }}
        with:
          mode: finish
          label: site

  # One job per (engine, width leg) of the plan: it walks its widths, all three arms at each, on the paths the engine decides. The legs of
  # one engine are joined and reduced by job `merge`; the verdict is in its step summary and artifact. A leg fails only when the probe
  # could not run.
  probe:
    needs: [site]
    if: ${{ !contains(github.event.head_commit.message, '[frames:') }}
    concurrency:
      group: ci-lane:trajectory-probe:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:probe:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    name: probe ${{ matrix.engine }} ${{ matrix.leg }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.site.outputs.linux) }}
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@fw/gate-breakpoints'
      - uses: ./.github/actions/telemetry
        with:
          mode: start
          label: probe-${{ matrix.engine }}-${{ matrix.leg }}
      - name: Verify the snapshot against snapshot.lock.json
        run: node .github/scripts/verify-snapshot.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: apps/site/dist/aot
      - uses: ./.github/actions/gate-engine
        with:
          engine: ${{ matrix.engine }}
      - name: Smoke test the engine (fails in under two minutes instead of burning the job budget)
        env:
          ENGINE: ${{ matrix.engine }}
          FW_SNAPSHOT_SITE: ${{ github.workspace }}/snapshot/site
          FW_SITE_DIST: ${{ github.workspace }}/apps/site/dist/aot
          FW_SEARCH: ${{ needs.site.outputs.search }}
          SMOKE: ${{ github.workspace }}/.github/scripts/gate-smoke.mjs
        working-directory: packages/gate-breakpoints
        timeout-minutes: 5
        run: node "$SMOKE" --engine "$ENGINE"
      - name: Walk the scroll paths of this leg (all three arms, its widths) and reduce
        env:
          ENGINE: ${{ matrix.engine }}
          WIDTHS: ${{ matrix.widths }}
          PATHS: ${{ matrix.paths }}
          SEARCH: ${{ needs.site.outputs.search }}
          FW_SNAPSHOT_SITE: ${{ github.workspace }}/snapshot/site
          FW_SITE_DIST: ${{ github.workspace }}/apps/site/dist/aot
          # full = every property in every frame; lean = discrete props, m, logo rect and hero copy/cards during pushes (switch it
          # when the read-timing table shows reads dominate the frame; the setting is recorded in the artifact).
          READS: full
          # The page recorder of the push commit line (`debug=`, Lean allowlist); empty = none, and then nothing in the page records.
          FW_DEBUG: ${{ needs.site.outputs.debug }}
          # Rep count of the morph path (one empty tenth-bucket in a push is fail:coverage; more passes fill it).
          REPS: 5
        working-directory: packages/gate-breakpoints
        run: node src/trajectory/cli.mjs run --engine "$ENGINE" --widths "$WIDTHS" --search "$SEARCH" --paths "$PATHS" --reads "$READS" --reps "$REPS" --out out/trajectory
      # The GPU cells (task gpu-trajectory-cells; Lean Fw.Gate.TrajectoryGpu): the first Chromium row also walks the faithful page for the
      # nav clip, panel effect, pain dark and carousel cells and uploads them (cells-gpu-chromium). continue-on-error: the cells grade a
      # rewrite against itself or a candidate, they are not part of the trajectory verdict.
      - name: Walk the GPU cells (Chromium, first row only)
        if: ${{ (!cancelled()) && steps.stale.outcome == 'skipped' && matrix.engine == 'chromium' && strategy.job-index == 0 }}
        continue-on-error: true
        env:
          SEARCH: ${{ needs.site.outputs.search }}
          FW_SNAPSHOT_SITE: ${{ github.workspace }}/snapshot/site
          FW_SITE_DIST: ${{ github.workspace }}/apps/site/dist/aot
        working-directory: packages/gate-breakpoints
        timeout-minutes: 15
        run: node src/trajectory/cells-gpu-cli.mjs run --engine chromium --search "$SEARCH" --out out/cells-gpu
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ (!cancelled()) && steps.stale.outcome == 'skipped' && matrix.engine == 'chromium' && strategy.job-index == 0 }}
        with:
          name: cells-gpu-chromium
          path: packages/gate-breakpoints/out/cells-gpu
          if-no-files-found: ignore
          retention-days: 30
      # The artifact's own name inside it: a download that matches ONE artifact puts the files in the target itself, without the
      # artifact-name directory a download of several makes, and the merge job moves them back under their name from this file.
      - name: Name the leg inside its artifact
        if: ${{ (!cancelled()) && steps.stale.outcome == 'skipped' }}
        run: echo "trajectory-leg-${{ matrix.engine }}-${{ matrix.leg }}" > packages/gate-breakpoints/out/trajectory/artifact-name.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ (!cancelled()) && steps.stale.outcome == 'skipped' }}
        with:
          name: trajectory-leg-${{ matrix.engine }}-${{ matrix.leg }}
          path: packages/gate-breakpoints/out/trajectory
          if-no-files-found: error
          retention-days: 30
      - uses: ./.github/actions/telemetry
        if: ${{ (always()) && steps.stale.outcome == 'skipped' }}
        with:
          mode: finish
          label: probe-${{ matrix.engine }}-${{ matrix.leg }}

  # Joins the legs of one engine: the raw readings of every leg become one run (same search, same reps), reduced by the same code, and the
  # result is the artifact `trajectory-<engine>` the recorder reads. No browser; it only needs node and the reducer.
  # Frames for a person's visual review of a look change (src/trajectory/frames.mjs): on a ci/* push whose head commit carries
  # `[ci:trajectory-probe]` and `[frames:<part:variant>]`, the faithful rewrite and that flag walk the same end-of-page path in
  # each Linux engine at 390 and 1280, the nav band is screenshotted from each wheel push on, and strips put the two rows side
  # by side (artifact frames-<engine>). The probe and merge jobs skip on such a push. Review material only, no verdict.
  frames:
    needs: [site]
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[frames:') }}
    concurrency:
      group: ci-lane:trajectory-probe:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:frames:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    name: frames ${{ matrix.engine }}
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, playwright-webkit]
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - id: s
        name: The flag of the frames run (from the head commit message)
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          fw=$(printf '%s' "$HEAD_MSG" | grep -oE '\[frames:[A-Za-z0-9.:,_@-]+\]' | head -1 | sed -E 's/^\[frames:(.*)\]$/\1/')
          search=$(node .github/scripts/gate-search.mjs --fw "$fw" --preset '')
          echo "search=$search" >> "$GITHUB_OUTPUT"
          echo "frames search: $search"
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@fw/gate-breakpoints'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: apps/site/dist/aot
      - uses: ./.github/actions/gate-engine
        with:
          engine: ${{ matrix.engine }}
      - name: Capture the nav band through both pushes, then compose the strips
        env:
          ENGINE: ${{ matrix.engine }}
          SEARCH: ${{ steps.s.outputs.search }}
          FW_SNAPSHOT_SITE: ${{ github.workspace }}/snapshot/site
          FW_SITE_DIST: ${{ github.workspace }}/apps/site/dist/aot
          RUN_ID: ${{ github.run_id }}
        working-directory: packages/gate-breakpoints
        run: |
          set -euo pipefail
          node src/trajectory/frames.mjs capture --engine "$ENGINE" --widths 390,1280 --search "$SEARCH" --out out/frames/raw
          node src/trajectory/frames.mjs strips --in out/frames/raw --out out/frames/strips --run "$RUN_ID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ (!cancelled()) && steps.stale.outcome == 'skipped' }}
        with:
          name: frames-${{ matrix.engine }}
          path: packages/gate-breakpoints/out/frames
          if-no-files-found: error
          retention-days: 30

  merge:
    needs: [site, probe]
    if: ${{ !cancelled() && needs.site.result == 'success' && !contains(github.event.head_commit.message, '[frames:') }}
    concurrency:
      group: ci-lane:trajectory-probe:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:merge:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    name: merge ${{ matrix.engine }}
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJSON(needs.site.outputs.engines) }}
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@fw/gate-breakpoints'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: trajectory-leg-${{ matrix.engine }}-*
          merge-multiple: false
          path: legs
      - name: Join the legs and reduce
        env:
          ENGINE: ${{ matrix.engine }}
          FW_SNAPSHOT_SITE: ${{ github.workspace }}/snapshot/site
        working-directory: packages/gate-breakpoints
        run: |
          set -euo pipefail
          # Every leg lands in legs/<artifact name>/, also a run with ONE leg (one engine, one width): then the download put the
          # files in legs/ itself (merge: no leg, runs 39519445950 and 39519469405), so move them under the name they carry.
          legs="$GITHUB_WORKSPACE/legs"
          if [ -f "$legs/artifact-name.txt" ]; then
            n=$(cat "$legs/artifact-name.txt")
            mkdir -p "$legs/$n"
            find "$legs" -mindepth 1 -maxdepth 1 ! -name "$n" -exec mv {} "$legs/$n/" \;
          fi
          dirs=$(find "$GITHUB_WORKSPACE/legs" -mindepth 1 -maxdepth 1 -type d -name "trajectory-leg-$ENGINE-*" | sort | paste -sd, -)
          echo "legs: $dirs"
          node src/trajectory/cli.mjs merge --in "$dirs" --engine "$ENGINE" --out out/trajectory
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ (!cancelled()) && steps.stale.outcome == 'skipped' }}
        with:
          name: trajectory-${{ matrix.engine }}
          path: packages/gate-breakpoints/out/trajectory
          if-no-files-found: error
          retention-days: 30

  # The Apple witness: Playwright WebKit on macOS (free standard runner), hero and morph paths, the dispatched rewrite search against
  # the original, in the width legs of the plan (two). The Linux jobs above never wait for it and it never changes their verdicts.
  probe-apple:
    needs: [site]
    if: ${{ needs.site.outputs.apple_run == 'true' }}
    concurrency:
      group: ci-lane:trajectory-probe:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:probe-apple:${{ strategy.job-index }}
    runs-on: macos-26
    timeout-minutes: 15
    name: probe apple (playwright-webkit, macos-26) ${{ matrix.leg }}
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix: ${{ fromJSON(needs.site.outputs.apple) }}
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@fw/gate-breakpoints'
      - name: Verify the snapshot against snapshot.lock.json
        run: node .github/scripts/verify-snapshot.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: apps/site/dist/aot
      - name: Playwright WebKit (macOS build; no system libraries to install)
        working-directory: packages/gate-breakpoints
        run: pnpm exec playwright-core install webkit
      - name: Smoke test the engine
        env:
          ENGINE: ${{ matrix.engine }}
          FW_SNAPSHOT_SITE: ${{ github.workspace }}/snapshot/site
          FW_SITE_DIST: ${{ github.workspace }}/apps/site/dist/aot
          FW_SEARCH: ${{ needs.site.outputs.search }}
          SMOKE: ${{ github.workspace }}/.github/scripts/gate-smoke.mjs
        working-directory: packages/gate-breakpoints
        timeout-minutes: 5
        run: node "$SMOKE" --engine "$ENGINE"
      - name: Walk the paths of this leg (all three arms, its widths) and reduce
        if: ${{ !contains(github.event.head_commit.message, '[frames:') }}
        env:
          ENGINE: ${{ matrix.engine }}
          WIDTHS: ${{ matrix.widths }}
          PATHS: ${{ matrix.paths }}
          REPS: 5
          FW_DEBUG: ${{ needs.site.outputs.debug }}
          SEARCH: ${{ needs.site.outputs.search }}
          FW_SNAPSHOT_SITE: ${{ github.workspace }}/snapshot/site
          FW_SITE_DIST: ${{ github.workspace }}/apps/site/dist/aot
        working-directory: packages/gate-breakpoints
        run: node src/trajectory/cli.mjs run --engine "$ENGINE" --widths "$WIDTHS" --search "$SEARCH" --paths "$PATHS" --reads full --reps "$REPS" --out out/trajectory
      - name: Name the leg inside its artifact
        if: ${{ (!cancelled()) && steps.stale.outcome == 'skipped' && !contains(github.event.head_commit.message, '[frames:') }}
        run: echo "trajectory-leg-apple-${{ matrix.leg }}" > packages/gate-breakpoints/out/trajectory/artifact-name.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ (!cancelled()) && steps.stale.outcome == 'skipped' && !contains(github.event.head_commit.message, '[frames:') }}
        with:
          name: trajectory-leg-apple-${{ matrix.leg }}
          path: packages/gate-breakpoints/out/trajectory
          if-no-files-found: error
          retention-days: 30
      # A push whose head commit carries `[frames:<part:variant>]` runs no walk here: this leg captures the nav band of the faithful
      # rewrite and of that flag at its widths (src/trajectory/frames.mjs), by screenshots and by the screencast, and composes the
      # strips. Review material for a person, no verdict; artifact frames-apple-<leg>.
      - id: fs
        name: The flag of the frames run (from the head commit message)
        if: ${{ contains(github.event.head_commit.message, '[frames:') }}
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          fw=$(printf '%s' "$HEAD_MSG" | grep -oE '\[frames:[A-Za-z0-9.:,_@-]+\]' | head -1 | sed -E 's/^\[frames:(.*)\]$/\1/')
          search=$(node .github/scripts/gate-search.mjs --fw "$fw" --preset '')
          echo "search=$search" >> "$GITHUB_OUTPUT"
          echo "frames search: $search"
      - name: Capture the nav band through both pushes (screenshots, then the screencast), then compose the strips
        if: ${{ contains(github.event.head_commit.message, '[frames:') }}
        env:
          ENGINE: ${{ matrix.engine }}
          WIDTHS: ${{ matrix.widths }}
          SEARCH: ${{ steps.fs.outputs.search }}
          FW_SNAPSHOT_SITE: ${{ github.workspace }}/snapshot/site
          FW_SITE_DIST: ${{ github.workspace }}/apps/site/dist/aot
          RUN_ID: ${{ github.run_id }}
        working-directory: packages/gate-breakpoints
        run: |
          set -euo pipefail
          node src/trajectory/frames.mjs capture --engine "$ENGINE" --widths "$WIDTHS" --search "$SEARCH" --source screenshot --reps 3 --out out/frames/raw-screenshot
          node src/trajectory/frames.mjs capture --engine "$ENGINE" --widths "$WIDTHS" --search "$SEARCH" --source screencast --reps 3 --out out/frames/raw-screencast
          node src/trajectory/frames.mjs strips --in out/frames/raw-screenshot,out/frames/raw-screencast --out out/frames/strips --run "$RUN_ID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ (!cancelled()) && steps.stale.outcome == 'skipped' && contains(github.event.head_commit.message, '[frames:') }}
        with:
          name: frames-apple-${{ matrix.leg }}
          path: packages/gate-breakpoints/out/frames
          if-no-files-found: error
          retention-days: 30

  # Joins the macOS legs into `trajectory-apple` (the artifact the recorder reads for the mac-webkit cells).
  merge-apple:
    needs: [site, probe-apple]
    if: ${{ !cancelled() && needs.site.result == 'success' && needs.probe-apple.result != 'skipped' && !contains(github.event.head_commit.message, '[frames:') }}
    concurrency:
      group: ci-lane:trajectory-probe:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:merge-apple:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    name: merge apple
    strategy:
      matrix:
        engine: [playwright-webkit]
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@fw/gate-breakpoints'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: trajectory-leg-apple-*
          merge-multiple: false
          path: legs
      - name: Join the legs and reduce
        env:
          ENGINE: ${{ matrix.engine }}
          FW_SNAPSHOT_SITE: ${{ github.workspace }}/snapshot/site
        working-directory: packages/gate-breakpoints
        run: |
          set -euo pipefail
          # Every leg lands in legs/<artifact name>/, also a run with ONE leg (one engine, one width): then the download put the
          # files in legs/ itself (merge: no leg, runs 39519445950 and 39519469405), so move them under the name they carry.
          legs="$GITHUB_WORKSPACE/legs"
          if [ -f "$legs/artifact-name.txt" ]; then
            n=$(cat "$legs/artifact-name.txt")
            mkdir -p "$legs/$n"
            find "$legs" -mindepth 1 -maxdepth 1 ! -name "$n" -exec mv {} "$legs/$n/" \;
          fi
          dirs=$(find "$GITHUB_WORKSPACE/legs" -mindepth 1 -maxdepth 1 -type d -name "trajectory-leg-apple-*" | sort | paste -sd, -)
          echo "legs: $dirs"
          node src/trajectory/cli.mjs merge --in "$dirs" --engine "$ENGINE" --out out/trajectory
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ (!cancelled()) && steps.stale.outcome == 'skipped' }}
        with:
          name: trajectory-apple
          path: packages/gate-breakpoints/out/trajectory
          if-no-files-found: error
          retention-days: 30
