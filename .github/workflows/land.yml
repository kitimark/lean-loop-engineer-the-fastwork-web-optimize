name: land

# The land lane (task land-lane): the heavy land checks on a free Linux runner instead of this Mac. `pnpm fw checks --affected
# --tier remote` selects the checks the diff against --base touches (Lean selectChecks over the declared reads of
# apps/runner/src/land.ts) and runs the ones Lean puts in the remote tier (lean/Fw/Console/LandTier.lean `remoteIds`), one
# `VERDICT <pass|fail|skipped> <id>` line each. fwcore is built first, so the tests that need the binary run; a skipped test of
# a suite that runs fwcore fails the lane (Lean `laneVerdict`). Push `ci/land-<task>` with `[ci:land]` in the head commit.
on:
  push:
    branches: ['ci/land-*']
  workflow_dispatch:
    inputs:
      base:
        description: Revision the diff is taken against (empty means the first parent of HEAD, skipping tip commits that change nothing)
        type: string
        default: ''
      measure_warm:
        description: Build fwcore a second time from the Lake artifact cache and report its time (measurement)
        type: boolean
        default: false

permissions:
  contents: read

env:
  # The pinned browser of the preview browser suite (same as breakpoint-gate and preview-e2e).
  HS_VERSION: 156.0.8078.4
  HS_SHA256: 81ab9d4d3c301dc5fdfb6c541b9e6632b16fc819a6a854460f40a76fe2b2c476

jobs:
  # Guard (Lean Fw.Ci.Intent + Fw.Ci.Trigger, scripts/ci-paths.mjs). On a ci/* push it, and so every job, is skipped unless
  # the head commit asks for this lane (`[ci:<lane>]`; the default lane lean always); then it runs the workflow only if
  # the commit is the branch tip, is not on main yet, and (lean: always) some file that differs from main on the whole
  # branch is an input. A main push starts no run; dispatches always run. Fails open.
  # Every other job re-checks the tip first (`stale:` fails it) and has its own group, never cancelled on ci/*.
  guard:
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/ci/') || contains(github.event.head_commit.message, '[ci:land]') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
      lean: ${{ steps.lean.outputs.changed }}
      hit: ${{ steps.hit.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: g
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          GUARD_TOKEN: ${{ github.token }}
        run: node .github/scripts/changed-inputs.mjs --workflow .github/workflows/land.yml
      - name: 'decision: run'
        if: steps.g.outputs.run == 'true'
        run: 'true'
      - name: 'decision: skip: ${{ steps.g.outputs.reason }}'
        if: steps.g.outputs.run != 'true'
        run: 'true'
      # The prep job's facts (Lean Fw.Console.LandLegs.prepRuns): does a path under lean/ differ from the base the legs diff against,
      # and does the exact Lake key exist (lookup only: nothing is downloaded or saved). Fails open: an unreadable diff counts as changed.
      - id: lean
        if: steps.g.outputs.run == 'true'
        env:
          BASE: ${{ github.event.inputs.base }}
        run: |
          base="${BASE:-}"
          if [ -z "$base" ]; then base=$(sh .github/scripts/land-base.sh base) || base=""; fi
          if [ -z "$base" ] || ! d=$(git diff --name-only "$base" HEAD -- lean); then echo "changed=true" >> "$GITHUB_OUTPUT"; echo "lean: diff unreadable, counts as changed"
          elif [ -n "$d" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; echo "lean: changed against $base"
          else echo "changed=false" >> "$GITHUB_OUTPUT"; echo "lean: unchanged against $base"; fi
      - id: hit
        if: steps.lean.outputs.changed == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          lookup-only: true
          path: ${{ github.workspace }}/.lake-cache
          key: lake-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-${{ hashFiles('lean/lakefile.toml', 'lean/*.lean', 'lean/Fw/**', 'lean/FwTest/**') }}

  # The one fwcore build of the run (task land-fwcore-once, Lean Fw.Console.LandLegs prepRuns, fwcoreFrom): when lean/ changed and the exact
  # Lake key misses, every leg used to rebuild fwcore (206 s each in run 39360937987). This job builds it once and uploads the build tree; the legs
  # download it. Skipped otherwise: the legs then build as before (a cache replay, about 20 s). Only the writer of this artifact; it
  # restores the Lake cache and saves nothing (setup-lean save is false).
  fwcore:
    needs: [guard]
    if: ${{ needs.guard.outputs.run == 'true' && needs.guard.outputs.lean == 'true' && needs.guard.outputs.hit != 'true' }}
    concurrency:
      group: ci-lane:land:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:fwcore:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lean
      - name: fwcore build (the one build of this run)
        working-directory: lean
        run: |
          s=$(date +%s)
          lake build fwcore
          echo "PHASE fwcore_build_prep $(( $(date +%s) - s ))s" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: land-fwcore
          path: lean/.lake/build
          include-hidden-files: true
          compression-level: 1
          if-no-files-found: error
          retention-days: 1

  land:
    needs: [guard, fwcore]
    if: ${{ !cancelled() && needs.guard.outputs.run == 'true' && (needs.fwcore.result == 'success' || needs.fwcore.result == 'skipped') }}
    concurrency:
      group: ci-lane:land:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:land:${{ strategy.job-index }}
    # One job per leg (Lean Fw.Console.LandLegs, lean/land-legs.txt): the suites legs split the remote checks, the engine legs run the
    # preview browser suite on their engine. Every leg builds fwcore and selects the same checks, so the wall time is the slowest leg.
    # fail-fast is off: every leg reports. The run passes iff every leg passed (Lean legsOk; the adapter re-checks it, land-remote.ts).
    strategy:
      fail-fast: false
      matrix:
        leg: [suites-a, suites-b, chromium, playwright-webkit]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      # Phase timings (MEASURED, printed as PHASE lines and in the step summary): queue = push to first step, setup = checkout,
      # Lean, pnpm; fwcore = lake build fwcore; suites = the remote tier.
      - name: 'phase: start'
        env:
          PUSHED_AT: ${{ github.event.repository.pushed_at }}
        run: |
          now=$(date +%s)
          echo "T0=$now" >> "$GITHUB_ENV"
          case "$PUSHED_AT" in ''|*[!0-9]*) echo "QUEUE=n/a" >> "$GITHUB_ENV" ;; *) echo "QUEUE=$((now - PUSHED_AT))s" >> "$GITHUB_ENV" ;; esac
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # The runner tests read main's history (the incident ledger, the last land diffs) and commit in temp repos. main is
      # the pushed commit's first parent (the local main the land merge was made on), so the facts equal the local ones
      # whatever origin/main is (.github/scripts/land-base.sh).
      - name: main ref and commit identity
        run: |
          set -euo pipefail
          git branch -f main "$(sh .github/scripts/land-base.sh main)"
          git config --global user.name land-lane
          git config --global user.email land-lane

      - uses: ./.github/actions/setup-lean

      # One source: lean/land-filter.txt is written by Lean (Fw.Console.LandTier.filterList, one selector per remoteIds
      # entry) and checked by lean/scripts/check.sh, so a suite added to the allowlist is installed here too.
      - name: package filter (from Lean)
        id: filter
        run: echo "filter=$(cat lean/land-filter.txt)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-pnpm
        with:
          filter: ${{ steps.filter.outputs.filter }}

      - name: 'phase: setup done'
        run: echo "T1=$(date +%s)" >> "$GITHUB_ENV"

      # Where the Lean build comes from (Lean fwcoreFrom): the prep job's build tree (fwcore and the modules the suites' `lake env lean` scripts
      # import; a bare binary left gate-breakpoints rebuilding them for 270 s, run 39369120267) after it built, or the Lake cache restored above
      # when the prep job was skipped. Either way `lake build fwcore` then runs: after a download it only checks the traces (the build is kept
      # if they hold, rebuilt if not), on a cache hit it replays the artifacts.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ needs.fwcore.result == 'success' }}
        with:
          name: land-fwcore
          path: lean/.lake/build
      - name: fwcore build
        working-directory: lean
        run: |
          chmod +x .lake/build/bin/fwcore 2>/dev/null || true
          lake build fwcore

      - name: 'phase: fwcore done'
        run: echo "T2=$(date +%s)" >> "$GITHUB_ENV"

      # Measurement only (dispatch with measure_warm, or `[warm]` in the head commit message): the same build again from the Lake artifact cache the first build filled
      # (build directory removed), which is what a restored exact-key cache costs.
      - name: fwcore build again from the artifact cache (measure_warm)
        if: ${{ github.event.inputs.measure_warm == 'true' || contains(github.event.head_commit.message, '[warm]') }}
        working-directory: lean
        run: |
          rm -rf .lake/build
          s=$(date +%s)
          lake build fwcore
          echo "WARM_FWCORE=$(( $(date +%s) - s ))s" >> "$GITHUB_ENV"

      # The lane states which commit and which check set it ran (Lean Fw.Console.LandRemote Want): sha is the change under test,
      # digest is the `LANE digest=` line of `fw checks --tier remote`. Both are in the step name below and in the summary.
      - name: suites (the remote tier of the Lean-selected checks)
        id: suites
        shell: bash
        env:
          BASE: ${{ github.event.inputs.base }}
          LEG: ${{ matrix.leg }}
        run: |
          set -u
          base="${BASE:-}"
          if [ -z "$base" ]; then base=$(sh .github/scripts/land-base.sh base); fi
          echo "sha=$(sh .github/scripts/land-base.sh rev)" >> "$GITHUB_OUTPUT"
          set +e
          pnpm fw checks --affected --base "$base" --tier remote --leg "$LEG" 2>&1 | tee "$RUNNER_TEMP/land.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "digest=$(sed -n 's/^LANE digest=//p' "$RUNNER_TEMP/land.log" | head -n1)" >> "$GITHUB_OUTPUT"
          echo "engine=$(sed -n 's/^LANE leg=.* engine=\([a-z]*\) .*/\1/p' "$RUNNER_TEMP/land.log" | head -n1)" >> "$GITHUB_OUTPUT"
          grep -E '^(VERDICT|TIMING|checks:|LANE)' "$RUNNER_TEMP/land.log" >> "$GITHUB_STEP_SUMMARY" || true
          exit "$rc"

      - name: 'lane: sha=${{ steps.suites.outputs.sha }} digest=${{ steps.suites.outputs.digest }}'
        if: ${{ always() && steps.stale.outcome == 'skipped' && steps.suites.outcome != 'skipped' }}
        env:
          SHA: ${{ steps.suites.outputs.sha }}
          DIGEST: ${{ steps.suites.outputs.digest }}
        run: echo "LANE sha=$SHA digest=$DIGEST"

      # The preview browser suite (packages/e2e-preview, docs/team/tools/preview-e2e.md) runs in the engine legs, and in them only when the
      # selection holds the e2e-preview check (`LANE leg=<engine> engine=true`, Lean Fw.Console.LandLegs.engineRuns): the browser is
      # installed for no other land. Chrome Headless Shell in the chromium leg, Playwright WebKit in the playwright-webkit leg,
      # at the same time as the suites legs.
      - uses: ./.github/actions/gate-engine
        if: ${{ !cancelled() && steps.stale.outcome == 'skipped' && steps.suites.outputs.engine == 'true' }}
        with:
          engine: ${{ matrix.leg }}
      - name: 'browser suite: ${{ matrix.leg }}'
        if: ${{ !cancelled() && steps.stale.outcome == 'skipped' && steps.suites.outputs.engine == 'true' }}
        run: node src/run.mjs --engine ${{ matrix.leg }} --out out
        working-directory: packages/e2e-preview
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.stale.outcome == 'skipped' && steps.suites.outputs.engine == 'true' }}
        with:
          name: land-preview-e2e-${{ matrix.leg }}
          path: packages/e2e-preview/out/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: phases
        if: ${{ always() && steps.stale.outcome == 'skipped' }}
        run: |
          now=$(date +%s)
          t1=${T1:-$now}; t2=${T2:-$now}
          {
            echo "PHASE queue ${QUEUE:-n/a}"
            echo "PHASE setup $((t1 - T0))s"
            echo "PHASE fwcore_build $((t2 - t1))s"
            echo "PHASE suites $((now - t2))s"
            echo "PHASE fwcore_build_warm_again ${WARM_FWCORE:-not measured}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
