name: gate-gaps

# The gaps lane (Q33): the 8 cells the default breakpoint gate cannot judge (fractional widths 600.5 / 640.5 / 860.5 /
# 1000.5 at DPR 2; hover x pointer pairs the platform does not offer). packages/gate-breakpoints/src/gaps/README.md.
#   collect-linux   Chromium (Playwright's full Chromium, new headless; the headless shell has no browser zoom) with the
#                   Lean environment built through browser zoom + a whole CDP override, and Playwright WebKit (GLib port)
#                   with its DPR / pair evidence. Two independent jobs (rep 1, 2).
#   collect-macos   (workflow_dispatch only, one VM: the account has 5 macOS slots shared by every lane) Apple WebKit:
#                   Playwright WebKit (Apple port), the WKWebView host at several page zooms and the A=R row, and the iOS
#                   Simulator iPhone / iPad with the meta-viewport variants.
#   judge           Every verdict comes from fwcore (Lean), never from the collecting jobs. One gaps.json / gaps.md per
#                   collect job, uploaded together.
# Counts and verdicts only: nothing measured here is phone time.
on:
  push:
    branches: ['ci/**', main]
    paths:
      - 'packages/gate-breakpoints/**'
      - 'apps/site/**'
      - 'lean/Main.lean'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'
      - 'lean/lean-toolchain'
      - 'lean/Fw/Board.lean'
      - 'lean/Fw/Ci/Budget.lean'
      - 'lean/Fw/Ci/Wire.lean'
      - 'lean/Fw/Console.lean'
      - 'lean/Fw/Console/Alert.lean'
      - 'lean/Fw/Console/Land.lean'
      - 'lean/Fw/Console/Self.lean'
      - 'lean/Fw/Gate/Compare.lean'
      - 'lean/Fw/Gate/Items.lean'
      - 'lean/Fw/Gate/Reach.lean'
      - 'lean/Fw/Gate/Rule.lean'
      - 'lean/Fw/Gate/State.lean'
      - 'lean/Fw/Measure/Arms.lean'
      - 'lean/Fw/Measure/Classes.lean'
      - 'lean/Fw/Measure/EngineCheck.lean'
      - 'lean/Fw/Measure/Freeze.lean'
      - 'lean/Fw/Measure/Neutral.lean'
      - 'lean/Fw/Measure/Quiet.lean'
      - 'lean/Fw/Measure/SelfCheck.lean'
      - 'lean/Fw/Measure/Snapshot.lean'
      - 'lean/Fw/Measure/Splits.lean'
      - 'lean/Fw/Measure/StepAlign.lean'
      - 'lean/Fw/Measure/Tolerance.lean'
      - 'lean/Fw/Measure/WebKit.lean'
      - 'lean/Fw/Measure/Wire.lean'
      - 'lean/Fw/Measure/ZoneBaseline.lean'
      - 'lean/Fw/Measure/Zones.lean'
      - 'lean/Fw/Obs/Health.lean'
      - 'lean/Fw/Obs/Next.lean'
      - 'lean/Fw/Obs/Signals.lean'
      - 'lean/Fw/Obs/Timing.lean'
      - 'lean/Fw/Ops/Identity.lean'
      - 'lean/Fw/Ops/Meter.lean'
      - 'lean/Fw/Ops/Obs.lean'
      - 'lean/Fw/Ops/PathCheck.lean'
      - 'lean/Fw/Ops/SpawnGuard.lean'
      - 'lean/Fw/Ops/Usage.lean'
      - 'lean/Fw/Ops/Wire.lean'
      - 'lean/Fw/Plan/Core.lean'
      - 'lean/Fw/Plan/Graph.lean'
      - 'lean/Fw/Plan/Incident.lean'
      - 'lean/Fw/Plan/Lint.lean'
      - 'lean/Fw/Plan/Trailer.lean'
      - 'lean/Fw/Sched/Admit.lean'
      - 'lean/Fw/Sched/ParMetrics.lean'
      - 'lean/Fw/Serve.lean'
      - 'lean/Fw/Site/BreakpointFacts.lean'
      - 'lean/Fw/Site/BreakpointGen.lean'
      - 'lean/Fw/Site/BreakpointMatrix.lean'
      - 'lean/Fw/Site/Breakpoints.lean'
      - 'lean/Fw/Spec/Cost.lean'
      - 'lean/Fw/Spec/DeviceQueue.lean'
      - 'lean/Fw/Spec/Flags.lean'
      - 'lean/Fw/Spec/Frames.lean'
      - 'lean/Fw/Spec/Lease.lean'
      - 'lean/Fw/Spec/Null.lean'
      - 'lean/Fw/Spec/Screen.lean'
      - 'lean/Fw/Spec/Verdict.lean'
      - 'lean/Fw/Store/Ci.lean'
      - 'lean/Fw/Store/Layout.lean'
      - 'lean/Fw/Store/Reduce.lean'
      - 'lean/Fw/Wire.lean'
      - 'lean/Fw/Wire/Console.lean'
      - 'lean/Fw/Wire/Gate.lean'
      - 'lean/Fw/Wire/Obs.lean'
      - 'lean/Fw/Wire/OpsGate.lean'
      - 'lean/Fw/Wire/Plan.lean'
      - 'lean/Fw/Wire/Sched.lean'
      - 'lean/Fw/Wire/Store.lean'
      - 'lean/BreakgenMain.lean'
      - 'lean/Fw/Site/GenRoute.lean'
      - 'snapshot/**'
      - 'snapshot.lock.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/scripts/verify-snapshot.mjs'
      - '.github/scripts/check-simulator.sh'
      - '.github/scripts/changed-inputs.mjs'
      - '.github/actions/setup-lean/**'
      - '.github/actions/setup-pnpm/**'
      - '.github/workflows/gate-gaps.yml'
  workflow_dispatch:
    inputs:
      macos:
        description: Also run the one macOS job (Simulator and WKWebView arms); uses one of the shared macOS slots
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/ci/') }}

jobs:
  # Paths guard: see wktr.yml. Gates every job of the workflow on a ci/* push; main pushes and dispatches always run.
  guard:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: g
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: node .github/scripts/changed-inputs.mjs --workflow .github/workflows/gate-gaps.yml

  site:
    needs: [guard]
    if: ${{ needs.guard.outputs.run == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lean
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@fw/site...'
      - name: Build the rewrite (default prerendered config)
        run: pnpm --filter @fw/site build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: apps/site/dist/aot
          if-no-files-found: error
          retention-days: 3

  collect-linux:
    needs: [site]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rep: [r1, r2]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Verify the snapshot against snapshot.lock.json
        run: node .github/scripts/verify-snapshot.mjs
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@fw/gate-breakpoints'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: apps/site/dist/aot
      - name: Playwright Chromium (full build, new headless) and WebKit (Linux build)
        working-directory: packages/gate-breakpoints
        run: |
          set -euo pipefail
          pnpm exec playwright-core install --with-deps chromium webkit
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor; Chromium's sandbox needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          chrome=$(node -e "import('playwright-core').then((m) => console.log(m.chromium.executablePath()))")
          test -x "$chrome"
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
          "$chrome" --version
      - name: Collect (Chromium and Playwright WebKit; no judging here)
        env:
          FW_SNAPSHOT_SITE: ${{ github.workspace }}/snapshot/site
          FW_SITE_DIST: ${{ github.workspace }}/apps/site/dist/aot
        working-directory: packages/gate-breakpoints
        run: node src/cli.mjs gaps collect --engines chromium,webkit --ci --out out/gaps
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gaps-raw-linux-${{ matrix.rep }}
          path: packages/gate-breakpoints/out/gaps
          if-no-files-found: error
          retention-days: 14

  # Dispatch only, one VM, max-parallel 1, tight timeout: the account has 5 macOS slots shared by every macOS lane.
  collect-macos:
    needs: [guard, site]
    if: ${{ needs.guard.outputs.run == 'true' && github.event_name == 'workflow_dispatch' && inputs.macos }}
    runs-on: xcode-27
    timeout-minutes: 40
    strategy:
      max-parallel: 1
      matrix:
        rep: [m1]
    env:
      FW_IOS_VERSION: '27.0'
      FW_IOS_BUILD: 24A434
      FW_SIM_NAME: fw-iphone-27
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Pinned iOS runtime build, then create the iPhone
        run: sh .github/scripts/check-simulator.sh --create
      - name: Verify the snapshot against snapshot.lock.json
        run: node .github/scripts/verify-snapshot.mjs
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@fw/gate-breakpoints'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: apps/site/dist/aot
      - name: Playwright WebKit (macOS build)
        working-directory: packages/gate-breakpoints
        run: pnpm exec playwright-core install webkit
      - name: Collect (Playwright WebKit, WKWebView, Simulator; no judging here)
        env:
          FW_SNAPSHOT_SITE: ${{ github.workspace }}/snapshot/site
          FW_SITE_DIST: ${{ github.workspace }}/apps/site/dist/aot
          # The runner (3 vCPU) boots Safari several times slower than a Mac (first run: openurl timed out at 60 s, no report in
          # 60 s): waits x3, a failed launch is retried, an arm stops adding variants after 8 minutes (recorded in skipped).
          FW_SIM_TIMEOUT_SCALE: '3'
          FW_SIM_ARM_BUDGET_MS: '480000'
        working-directory: packages/gate-breakpoints
        timeout-minutes: 34
        run: node src/cli.mjs gaps collect --engines webkit --ci --out out/gaps
      - name: Shut down and delete the Simulator devices
        if: ${{ always() }}
        run: |
          xcrun simctl shutdown all || true
          xcrun simctl delete "$FW_SIM_NAME" || true
          xcrun simctl delete fw-gaps-ipad || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: gaps-raw-macos-${{ matrix.rep }}
          path: packages/gate-breakpoints/out/gaps
          if-no-files-found: error
          retention-days: 14

  judge:
    needs: [collect-linux, collect-macos]
    if: ${{ !cancelled() && needs.collect-linux.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lean
      - name: Build fwcore
        working-directory: lean
        run: lake build fwcore
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@fw/gate-breakpoints'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gaps-raw-*
          path: ${{ runner.temp }}/raw
      - name: Judge each collect job's files with Lean and summarize
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/gaps"
          mkdir -p "$out"
          for d in "$RUNNER_TEMP"/raw/gaps-raw-*; do
            name=$(basename "$d")
            name=${name#gaps-raw-}
            mkdir -p "$out/$name"
            cp "$d"/*.json "$out/$name/"
            node packages/gate-breakpoints/src/cli.mjs gaps summary --out "$out/$name"
            {
              echo "### gate-gaps: $name"
              cat "$out/$name/gaps.md"
            } >> "$GITHUB_STEP_SUMMARY"
          done
          (cd "$out" && sha256sum */*.json | tee sha256.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gaps-judged
          path: ${{ runner.temp }}/gaps
          if-no-files-found: error
          retention-days: 30
