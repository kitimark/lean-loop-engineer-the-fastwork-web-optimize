name: gate-gaps

# The gaps lane (Q33): the 8 cells the default breakpoint gate cannot judge (fractional widths 600.5 / 640.5 / 860.5 /
# 1000.5 at DPR 2; hover x pointer pairs the platform does not offer). packages/gate-breakpoints/src/gaps/README.md.
#   collect-linux   Chromium (Playwright's full Chromium, new headless; the headless shell has no browser zoom) with the
#                   Lean environment built through browser zoom + a whole CDP override, and Playwright WebKit (GLib port)
#                   with its DPR / pair evidence. Two independent jobs (rep 1, 2).
#   collect-macos   (workflow_dispatch only, one VM: the account has 5 macOS slots shared by every lane) Apple WebKit:
#                   Playwright WebKit (Apple port), the WKWebView host at several page zooms and the A=R row, and the iOS
#                   Simulator iPhone / iPad with the meta-viewport variants.
#   judge           Every verdict comes from fwcore (Lean), never from the collecting jobs. One gaps.json / gaps.md per
#                   collect job, uploaded together.
#   images-*        Task image-audit, asked for by `[images]` / `[images-only]` in the commit message or the `images` input:
#                   images-audit (every image of the hero, morph and people regions per Lean width and DPR, three reps per
#                   engine and arm; the drawn arm only with `[images-arm]`), images-pages and images-verify (`[images-arm]`
#                   only: visual diff of the lag parts, baseline against the drawn-size arm; each copy against its source),
#                   images-summary (ranked tables). Counts and bytes only.
# Counts and verdicts only: nothing measured here is phone time.
on:
  push:
    branches: ['ci/**']
  workflow_dispatch:
    inputs:
      macos:
        description: Also run the one macOS job (Simulator and WKWebView arms); uses one of the shared macOS slots
        type: boolean
        default: true
      images:
        description: Also run the images-* jobs (task image-audit; a push asks for them with `[images]` in the commit message)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Guard (Lean Fw.Ci.Intent + Fw.Ci.Trigger, scripts/ci-paths.mjs). On a ci/* push it, and so every job, is skipped unless
  # the head commit asks for this lane (`[ci:<lane>]`; the default lane lean always); then it runs the workflow only if
  # the commit is the branch tip, is not on main yet, and (lean: always) some file that differs from main on the whole
  # branch is an input. A main push starts no run; dispatches always run. Fails open.
  # Every other job re-checks the tip first (`stale:` fails it) and has its own group, never cancelled on ci/*.
  guard:
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/ci/') || contains(github.event.head_commit.message, '[ci:gate-gaps]') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: g
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          GUARD_TOKEN: ${{ github.token }}
        run: node .github/scripts/changed-inputs.mjs --workflow .github/workflows/gate-gaps.yml
      - name: 'decision: run'
        if: steps.g.outputs.run == 'true'
        run: 'true'
      - name: 'decision: skip: ${{ steps.g.outputs.reason }}'
        if: steps.g.outputs.run != 'true'
        run: 'true'

  site:
    needs: [guard]
    if: ${{ needs.guard.outputs.run == 'true' }}
    concurrency:
      group: ci-lane:gate-gaps:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:site:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lean
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@fw/site...'
      - name: Build the rewrite (default prerendered config)
        run: pnpm --filter @fw/site build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: apps/site/dist/aot
          if-no-files-found: error
          retention-days: 3

  collect-linux:
    needs: [site]
    # A commit that says `[images-only]` (task image-audit) runs the images-* jobs below and not the gaps collection.
    if: ${{ !contains(github.event.head_commit.message, '[images-only]') }}
    concurrency:
      group: ci-lane:gate-gaps:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:collect-linux:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rep: [r1, r2]
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Verify the snapshot against snapshot.lock.json
        run: node .github/scripts/verify-snapshot.mjs
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@fw/gate-breakpoints'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: apps/site/dist/aot
      - name: Playwright Chromium (full build, new headless) and WebKit (Linux build)
        working-directory: packages/gate-breakpoints
        run: |
          set -euo pipefail
          pnpm exec playwright-core install --with-deps chromium webkit
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor; Chromium's sandbox needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          chrome=$(node -e "import('playwright-core').then((m) => console.log(m.chromium.executablePath()))")
          test -x "$chrome"
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
          "$chrome" --version
      - name: Collect (Chromium and Playwright WebKit; no judging here)
        env:
          FW_SNAPSHOT_SITE: ${{ github.workspace }}/snapshot/site
          FW_SITE_DIST: ${{ github.workspace }}/apps/site/dist/aot
        working-directory: packages/gate-breakpoints
        run: node src/cli.mjs gaps collect --engines chromium,webkit --ci --out out/gaps
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gaps-raw-linux-${{ matrix.rep }}
          path: packages/gate-breakpoints/out/gaps
          if-no-files-found: error
          retention-days: 14

  # Dispatch only, one VM, max-parallel 1, tight timeout: the account has 5 macOS slots shared by every macOS lane.
  collect-macos:
    needs: [guard, site]
    if: ${{ needs.guard.outputs.run == 'true' && github.event_name == 'workflow_dispatch' && inputs.macos }}
    concurrency:
      group: ci-lane:gate-gaps:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:collect-macos:${{ strategy.job-index }}
    runs-on: xcode-27
    timeout-minutes: 26
    strategy:
      max-parallel: 1
      matrix:
        rep: [m1]
    env:
      FW_IOS_VERSION: '27.0'
      FW_IOS_BUILD: 24A434
      FW_SIM_NAME: fw-iphone-27
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Pinned iOS runtime build, then create the iPhone
        run: sh .github/scripts/check-simulator.sh --create
      - name: Verify the snapshot against snapshot.lock.json
        run: node .github/scripts/verify-snapshot.mjs
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@fw/gate-breakpoints'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: apps/site/dist/aot
      - name: Playwright WebKit (macOS build)
        working-directory: packages/gate-breakpoints
        run: pnpm exec playwright-core install webkit
      - name: Collect (Playwright WebKit, WKWebView, Simulator; no judging here)
        env:
          FW_SNAPSHOT_SITE: ${{ github.workspace }}/snapshot/site
          FW_SITE_DIST: ${{ github.workspace }}/apps/site/dist/aot
          # The runner (3 vCPU) boots Safari several times slower than a Mac (first run: openurl timed out at 60 s, no report in
          # 60 s): waits x3, a failed launch is retried, an arm stops adding variants after 8 minutes (recorded in skipped).
          FW_SIM_TIMEOUT_SCALE: '3'
          FW_SIM_ARM_BUDGET_MS: '480000'
        working-directory: packages/gate-breakpoints
        timeout-minutes: 34
        run: node src/cli.mjs gaps collect --engines webkit --ci --out out/gaps
      - name: Shut down and delete the Simulator devices
        if: ${{ (always()) && steps.stale.outcome == 'skipped' }}
        run: |
          xcrun simctl shutdown all || true
          xcrun simctl delete "$FW_SIM_NAME" || true
          xcrun simctl delete fw-gaps-ipad || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ (always()) && steps.stale.outcome == 'skipped' }}
        with:
          name: gaps-raw-macos-${{ matrix.rep }}
          path: packages/gate-breakpoints/out/gaps
          if-no-files-found: error
          retention-days: 14

  # Task image-audit: the image audit (every image of the hero, morph and people regions: natural against drawn size, bytes, decoded
  # memory, effects above it) in the original snapshot, the rewrite and the images-at-drawn-size arm, in Chromium and Playwright
  # WebKit; the page-level visual diff of that arm against the build as it is; the summary. Runs on a commit that says `[images]`
  # (or `[images-only]`, which also skips the gaps collection). packages/gate-breakpoints/src/images/. Counts and sizes only:
  # nothing measured here is frame time or phone time.
  images-audit:
    needs: [site]
    if: ${{ contains(github.event.head_commit.message, '[images') || (github.event_name == 'workflow_dispatch' && inputs.images) }}
    concurrency:
      group: ci-lane:gate-gaps:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:images-audit:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: chromium, arm: rewrite, rep: r1 }
          - { engine: chromium, arm: rewrite, rep: r2 }
          - { engine: chromium, arm: rewrite, rep: r3 }
          - { engine: playwright-webkit, arm: rewrite, rep: r1 }
          - { engine: playwright-webkit, arm: rewrite, rep: r2 }
          - { engine: playwright-webkit, arm: rewrite, rep: r3 }
          - { engine: chromium, arm: original, rep: r1 }
          - { engine: playwright-webkit, arm: original, rep: r1 }
          - { engine: chromium, arm: drawn, rep: r1 }
          - { engine: chromium, arm: drawn, rep: r2 }
          - { engine: chromium, arm: drawn, rep: r3 }
          - { engine: playwright-webkit, arm: drawn, rep: r1 }
          - { engine: playwright-webkit, arm: drawn, rep: r2 }
          - { engine: playwright-webkit, arm: drawn, rep: r3 }
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Verify the snapshot against snapshot.lock.json
        run: node .github/scripts/verify-snapshot.mjs
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@fw/gate-breakpoints @fw/visual-diff'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: apps/site/dist/aot
      - name: Playwright Chromium (full build, new headless) and WebKit (Linux build)
        working-directory: packages/gate-breakpoints
        run: |
          set -euo pipefail
          pnpm exec playwright-core install --with-deps chromium webkit
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          chrome=$(node -e "import('playwright-core').then((m) => console.log(m.chromium.executablePath()))")
          test -x "$chrome"
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
          "$chrome" --version
      - name: 'Audit: ${{ matrix.engine }} / ${{ matrix.arm }} / ${{ matrix.rep }} (the Lean widths at DPR 2, the headline widths at DPR 1 and 3)'
        if: ${{ matrix.arm != 'drawn' || (contains(github.event.head_commit.message, '[images-arm]') && hashFiles('apps/site/src/flags/images/drawn.json') != '') }}
        env:
          FW_SNAPSHOT_SITE: ${{ github.workspace }}/snapshot/site
          FW_SITE_DIST: ${{ github.workspace }}/apps/site/dist/aot
        working-directory: packages/gate-breakpoints
        run: node src/images/cli.mjs audit --engine ${{ matrix.engine }} --arms ${{ matrix.arm }} --widths lean --dprs 2 --extra 1512:1,1512:3,430:1,430:3,393:3 --pool 3 --out out/images
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images-audit-${{ matrix.engine }}-${{ matrix.arm }}-${{ matrix.rep }}
          path: packages/gate-breakpoints/out/images
          if-no-files-found: ignore
          retention-days: 14

  # The arm against the build as it is, with the real visual diff on the parts of the lag regions (arm pages in arm-build.mjs).
  images-pages:
    needs: [site]
    if: ${{ contains(github.event.head_commit.message, '[images-arm]') || (github.event_name == 'workflow_dispatch' && inputs.images) }}
    concurrency:
      group: ci-lane:gate-gaps:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:images-pages:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, playwright-webkit]
        rep: [r1, r2, r3]
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Verify the snapshot against snapshot.lock.json
        run: node .github/scripts/verify-snapshot.mjs
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@fw/gate-breakpoints @fw/visual-diff'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: apps/site/dist/aot
      - name: Playwright Chromium (full build, new headless) and WebKit (Linux build)
        working-directory: packages/gate-breakpoints
        run: |
          set -euo pipefail
          pnpm exec playwright-core install --with-deps chromium webkit
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          chrome=$(node -e "import('playwright-core').then((m) => console.log(m.chromium.executablePath()))")
          test -x "$chrome"
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
          "$chrome" --version
      - name: 'The table against its files and the sources'
        if: ${{ hashFiles('apps/site/src/flags/images/drawn.json') != '' }}
        env:
          FW_SNAPSHOT_SITE: ${{ github.workspace }}/snapshot/site
          FW_SITE_DIST: ${{ github.workspace }}/apps/site/dist/aot
        working-directory: packages/gate-breakpoints
        run: node src/images/cli.mjs arm check --out ../../apps/site/dist/aot/images-drawn
      - name: 'Pages: ${{ matrix.engine }} / ${{ matrix.rep }} (baseline against the arm, visual diff of the lag parts)'
        if: ${{ hashFiles('apps/site/src/flags/images/drawn.json') != '' }}
        env:
          FW_SNAPSHOT_SITE: ${{ github.workspace }}/snapshot/site
          FW_SITE_DIST: ${{ github.workspace }}/apps/site/dist/aot
        working-directory: packages/gate-breakpoints
        run: node src/images/cli.mjs arm pages --engine ${{ matrix.engine }} --out out/images-pages
        continue-on-error: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images-pages-${{ matrix.engine }}-${{ matrix.rep }}
          path: |
            packages/gate-breakpoints/out/images-pages/pages-*.json
            packages/gate-breakpoints/out/images-pages/pages-*.md
          if-no-files-found: ignore
          retention-days: 14

  # The ranked tables and the cross-run canon of the audit files; no judging of frame time (there is none).
  # Every copy of the table against its source, drawn at the sizes the copy serves, on a white page, at DPR 2 and 3, with the PL tolerance
  # (arm verify in verify.mjs). Runs with the arm (`[images-arm]`).
  images-verify:
    needs: [site]
    if: ${{ contains(github.event.head_commit.message, '[images-arm]') || (github.event_name == 'workflow_dispatch' && inputs.images) }}
    concurrency:
      group: ci-lane:gate-gaps:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:images-verify:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, playwright-webkit]
        rep: [r1, r2, r3]
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Verify the snapshot against snapshot.lock.json
        run: node .github/scripts/verify-snapshot.mjs
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@fw/gate-breakpoints @fw/visual-diff'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: apps/site/dist/aot
      - name: Playwright Chromium (full build, new headless) and WebKit (Linux build)
        working-directory: packages/gate-breakpoints
        run: |
          set -euo pipefail
          pnpm exec playwright-core install --with-deps chromium webkit
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          chrome=$(node -e "import('playwright-core').then((m) => console.log(m.chromium.executablePath()))")
          test -x "$chrome"
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
          "$chrome" --version
      - name: 'The table against its files and the sources'
        if: ${{ hashFiles('apps/site/src/flags/images/drawn.json') != '' }}
        env:
          FW_SNAPSHOT_SITE: ${{ github.workspace }}/snapshot/site
          FW_SITE_DIST: ${{ github.workspace }}/apps/site/dist/aot
        working-directory: packages/gate-breakpoints
        run: node src/images/cli.mjs arm check --out ../../apps/site/dist/aot/images-drawn
      - name: 'Verify: ${{ matrix.engine }} / ${{ matrix.rep }} (each copy against its source at DPR 2 and 3)'
        if: ${{ hashFiles('apps/site/src/flags/images/drawn.json') != '' }}
        env:
          FW_SNAPSHOT_SITE: ${{ github.workspace }}/snapshot/site
          FW_SITE_DIST: ${{ github.workspace }}/apps/site/dist/aot
        working-directory: packages/gate-breakpoints
        run: node src/images/cli.mjs arm verify --engine ${{ matrix.engine }} --out out/images-verify --dprs 2,3
        continue-on-error: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images-verify-${{ matrix.engine }}-${{ matrix.rep }}
          path: |
            packages/gate-breakpoints/out/images-verify/verify-*.json
          if-no-files-found: ignore
          retention-days: 14

  # The ranked tables and the cross-run canon of the audit files; no judging of frame time (there is none).
  images-summary:
    needs: [guard, images-audit]
    if: ${{ !cancelled() && needs.guard.outputs.run == 'true' && needs.images-audit.result != 'skipped' }}
    concurrency:
      group: ci-lane:gate-gaps:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:images-summary:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@fw/gate-breakpoints'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: images-audit-*
          path: ${{ runner.temp }}/audits
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: apps/site/dist/aot
      - name: Summarize (ranked tables, per-cell rows, canonical hash per run)
        env:
          FW_SNAPSHOT_SITE: ${{ github.workspace }}/snapshot/site
          FW_SITE_DIST: ${{ github.workspace }}/apps/site/dist/aot
        working-directory: packages/gate-breakpoints
        run: |
          set -euo pipefail
          mkdir -p out
          dirs=$(ls -d "$RUNNER_TEMP"/audits/images-audit-* | paste -sd, -)
          node src/images/cli.mjs summary --in "$dirs" --out out/images-summary | tee out/images-summary.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images-summary
          path: |
            packages/gate-breakpoints/out/images-summary
            packages/gate-breakpoints/out/images-summary.log
          if-no-files-found: error
          retention-days: 30

  judge:
    needs: [collect-linux, collect-macos]
    if: ${{ !cancelled() && needs.collect-linux.result == 'success' }}
    concurrency:
      group: ci-lane:gate-gaps:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:judge:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lean
      - name: Build fwcore
        working-directory: lean
        run: lake build fwcore
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@fw/gate-breakpoints'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gaps-raw-*
          path: ${{ runner.temp }}/raw
      - name: Judge each collect job's files with Lean and summarize
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/gaps"
          mkdir -p "$out"
          for d in "$RUNNER_TEMP"/raw/gaps-raw-*; do
            name=$(basename "$d")
            name=${name#gaps-raw-}
            mkdir -p "$out/$name"
            cp "$d"/*.json "$out/$name/"
            node packages/gate-breakpoints/src/cli.mjs gaps summary --out "$out/$name"
            {
              echo "### gate-gaps: $name"
              cat "$out/$name/gaps.md"
            } >> "$GITHUB_STEP_SUMMARY"
          done
          (cd "$out" && sha256sum */*.json | tee sha256.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gaps-judged
          path: ${{ runner.temp }}/gaps
          if-no-files-found: error
          retention-days: 30
