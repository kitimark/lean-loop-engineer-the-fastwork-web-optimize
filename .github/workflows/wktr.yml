name: wktr

# WKTR lane (research/notes/2026/10-17-wktr-on-github-actions.md): WebKit's own prebuilt iOS-simulator
# WebKitTestRunner (CI archive r324039, Xcode 26.5, iOS 26.5; nothing is built here) runs the ORIGINAL page in an iOS 26.5
# Simulator on macos-26 and records, per scroll step, internals.lastStyleUpdateSize with styleRecalcCount, the steps
# bracketed by renderingUpdateCount. Counts only: nothing measured here is phone time. Each job runs the original `passes`
# times per harness variant (fresh WebKitTestRunnerApp processes); the classes job classes all passes per count type with
# fwcore (kMax 4, tMax 24). A frozen table (>= 3 workflow runs) is built from the downloaded artifacts of three
# dispatches: node packages/measure-wktr/src/freeze.mjs runs/* (fwcore measure.freeze).
on:
  push:
    branches: ['ci/**']
  workflow_dispatch:
    inputs:
      jobs:
        description: Independent macOS jobs (1 to 4); each runs every variant `passes` times
        type: string
        default: '2'
      passes:
        description: Fresh-process passes per variant and job (2 to 4)
        type: string
        default: '3'
      variants:
        description: 'Harness variants, comma separated: live or vt, then -warm, -still (diagnostic: animations suspended) and/or -trace (e.g. live,vt,vt-trace)'
        type: string
        default: 'live,vt'
      step:
        description: Scroll step in CSS px
        type: string
        default: '50'
      repaint:
        description: 'Invisible-paint lane instead of the count lanes: repaint rects per frame of the swipe, original / rewrite / v2-proved, 3 jobs (a push asks for it with [repaint] in the head commit)'
        type: boolean
        default: false
      toolbar:
        description: 'Toolbar forced-inset gate instead of the count lanes: WKTR walks the interactive obscured-insets change per morph.mount flag and the verdict is judged against the Lean golden, 3 jobs (a push asks for it with [toolbar] in the head commit)'
        type: boolean
        default: false
      accel:
        description: 'Geom-track accel lane instead of the count lanes: WKTR reads internals.acceleratedAnimationsForElement and styleRecalcCount per morph.geom WAAPI track, scrubbed and timed, 3 jobs (a push asks for it with [accel] in the head commit)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Guard (Lean Fw.Ci.Intent + Fw.Ci.Trigger, scripts/ci-paths.mjs). On a ci/* push it, and so every job, is skipped unless
  # the head commit asks for this lane (`[ci:<lane>]`; the default lane lean always); then it runs the workflow only if
  # the commit is the branch tip, is not on main yet, and (lean: always) some file that differs from main on the whole
  # branch is an input. A main push starts no run; dispatches always run. Fails open.
  # Every other job re-checks the tip first (`stale:` fails it) and has its own group, never cancelled on ci/*.
  guard:
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/ci/') || contains(github.event.head_commit.message, '[ci:wktr]') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Unit-test the guard
        run: node --test .github/scripts/changed-inputs.test.mjs
      - id: g
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          GUARD_TOKEN: ${{ github.token }}
        run: node .github/scripts/changed-inputs.mjs --workflow .github/workflows/wktr.yml
      - name: 'decision: run'
        if: steps.g.outputs.run == 'true'
        run: 'true'
      - name: 'decision: skip: ${{ steps.g.outputs.reason }}'
        if: steps.g.outputs.run != 'true'
        run: 'true'

  plan:
    needs: [guard]
    if: ${{ needs.guard.outputs.run == 'true' }}
    concurrency:
      group: ci-lane:wktr:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:plan:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - id: m
        env:
          JOBS: ${{ inputs.jobs || ((inputs.repaint || contains(github.event.head_commit.message, '[repaint]') || inputs.toolbar || contains(github.event.head_commit.message, '[toolbar]') || inputs.accel || contains(github.event.head_commit.message, '[accel]')) && '3') || '2' }}
          PASSES: ${{ inputs.passes || '3' }}
          VARIANTS: ${{ inputs.variants || 'live,vt' }}
        run: |
          set -euo pipefail
          case "$JOBS" in 1|2|3|4) ;; *) echo "jobs must be 1..4" >&2; exit 1 ;; esac
          case "$PASSES" in 2|3|4) ;; *) echo "passes must be 2..4" >&2; exit 1 ;; esac
          printf '%s' "$VARIANTS" | grep -Eq '^(live|vt)(-warm)?(-still)?(-trace)?(,(live|vt)(-warm)?(-still)?(-trace)?)*$' || { echo "bad variants: $VARIANTS" >&2; exit 1; }
          matrix=$(seq 1 "$JOBS" | jq -R -s -c '{job: (split("\n") | map(select(length > 0)) | map("j" + .))}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  # The rewrite arms of the invisible-paint lane: the prerendered build of apps/site at this commit, the default config and the
  # v2-proved preset as one more page (as webkit-sim.yml's site job builds it). Only when the lane is asked for.
  site:
    needs: [guard]
    if: ${{ needs.guard.outputs.run == 'true' && (inputs.repaint || contains(github.event.head_commit.message, '[repaint]') || inputs.accel || contains(github.event.head_commit.message, '[accel]')) }}
    concurrency:
      group: ci-lane:wktr:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:site:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@fw/site...'
      - uses: ./.github/actions/setup-lean
      - name: Build the rewrite (the default config and the v2-proved preset)
        if: ${{ !(inputs.accel || contains(github.event.head_commit.message, '[accel]')) }}
        run: pnpm --filter @fw/site build --config "?preset=v2-proved"
      - name: Build the rewrite (default prerender, every single-variant page and the geom pair, for the accel lane)
        if: ${{ inputs.accel || contains(github.event.head_commit.message, '[accel]') }}
        run: pnpm --filter @fw/site build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: apps/site/dist/aot
          if-no-files-found: error
          retention-days: 3

  # One macOS job at a time (the five macOS slots are shared by all lanes; research/notes/2026/10-17-macos-queue.md).
  # The first job finds no cached archive, downloads it and saves it when it ends; the next jobs restore it.
  # With [repaint] (or the repaint input) the measuring step is the invisible-paint run (packages/measure-wktr/src/repaint-cli.mjs)
  # and the count step is skipped; the steps after the measuring step are the same.
  # With [toolbar] (or the toolbar input) the measuring step is the toolbar forced-inset gate (task toolbar-wktr-gate): an archive
  # symbol check of the UI-script hooks, then packages/measure-wktr/src/toolbar-cli.mjs (2 passes per morph.mount flag) and the
  # verdict of src/gate.mjs against packages/contracts/golden/parts/morph-mount-toolbar.gate.jsonl; the job fails when a check fails.
  wktr:
    needs: [guard, plan, site]
    # site is skipped unless the repaint lane is asked for: that must not skip this job
    if: ${{ !cancelled() && needs.guard.outputs.run == 'true' && needs.plan.result == 'success' && needs.site.result != 'failure' }}
    concurrency:
      group: ci-lane:wktr:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:wktr:${{ strategy.job-index }}
    runs-on: macos-26
    timeout-minutes: 16
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Verify the snapshot against snapshot.lock.json
        run: node .github/scripts/verify-snapshot.mjs


      # The key carries the revision and the hash of archive.json (url, size, sha256): a new pin is a new key. The zip is
      # checked against size and sha256 by fetch-archive.sh whether it came from the cache or from the WebKit CI bucket.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: ${{ runner.temp }}/wktr-zip
          key: wktr-ios-min-324039-${{ hashFiles('packages/measure-wktr/src/archive.json') }}

      - name: Archive, extracted into an empty directory (size and sha256 verified)
        run: sh packages/measure-wktr/scripts/fetch-archive.sh "$RUNNER_TEMP/wktr-zip" "$RUNNER_TEMP/wktr-root"

      # The archive was built with Xcode 26.5 against the iOS 26.5 simulator SDK; run it with the same Xcode and runtime.
      - name: Select Xcode 26.5 and show the tools
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode_26.5*.app
          sudo xcode-select -s /Applications/Xcode_26.5.app
          mkdir -p "$RUNNER_TEMP/result"
          sh .github/scripts/runner-info.sh "$RUNNER_TEMP/result/runner.json"
          {
            sw_vers
            xcodebuild -version
            xcrun simctl list runtimes
            xcrun simctl list devicetypes | grep "iPhone 17"
          } | tee "$RUNNER_TEMP/result/tools.txt"

      - name: The rewrite build (site job)
        if: ${{ inputs.repaint || contains(github.event.head_commit.message, '[repaint]') || inputs.accel || contains(github.event.head_commit.message, '[accel]') }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: ${{ runner.temp }}/site

      # Invisible paint (task invisible-paint): per arm (original, rewrite, rewrite with ?preset=v2-proved) one fresh process
      # replays the swipe-touch-v1 schedule with scrollTo in native rAF; every frame the page dumps the tracked repaint rects
      # (internals.layerTreeAsText with repaint rects) of the frame before and restarts the tracking. Counts only, outside any
      # timed window. counts-<arm>-<zone>-<pass>.json (class policy), table-<arm>-<pass>.json (part x zone x class), raw-*.txt.gz.
      - name: WKTR repaint rects per frame, fresh process per arm
        if: ${{ inputs.repaint || contains(github.event.head_commit.message, '[repaint]') }}
        env:
          JOB: ${{ matrix.job }}
        run: |
          set -euo pipefail
          node packages/measure-wktr/src/repaint-cli.mjs run --keep \
            --root "$RUNNER_TEMP/wktr-root" --site snapshot/site --dist "$RUNNER_TEMP/site" --out "$RUNNER_TEMP/result" \
            --passes 1 --arms orig,rewrite,v2 --label "$JOB" 2>&1 | tee "$RUNNER_TEMP/result/run.log"
          ls -l "$RUNNER_TEMP/result"

      # Geom-track accel (task geom-track-style): per mode (morph.geom:on scrubbed, with morph.tween:geom-timed timed) one fresh
      # WebKitTestRunnerApp process loads the prerendered rewrite with the probe as the harness; per arm (all tracks, one property's tracks
      # held, none, idle) the page reads internals.acceleratedAnimationsForElement and the styleRecalcCount delta of its windows.
      # accel-<mode>-<pass>.json, raw-*.txt. Counts only, nothing here is phone time.
      - name: WKTR geom-track accel (accelerated animations and style recalcs per arm)
        if: ${{ inputs.accel || contains(github.event.head_commit.message, '[accel]') }}
        env:
          JOB: ${{ matrix.job }}
          ACCEL_MODES: ${{ contains(github.event.head_commit.message, '[accel-sweep]') && 'sweep-thr-off' || '' }}
        run: |
          set -euo pipefail
          node packages/measure-wktr/src/accel-cli.mjs run --keep \
            --root "$RUNNER_TEMP/wktr-root" --dist "$RUNNER_TEMP/site" --out "$RUNNER_TEMP/result" \
            ${ACCEL_MODES:+--modes "$ACCEL_MODES"} \
            --passes 1 --label "$JOB" 2>&1 | tee "$RUNNER_TEMP/result/run.log"
          ls -l "$RUNNER_TEMP/result"

      # Toolbar gate (task toolbar-wktr-gate). Hook presence first: the symbols the gate calls exist in the pinned binary (hooks.json),
      # then the fixture pages, one fresh WebKitTestRunnerApp process per flag and pass, then the verdict against the Lean golden.
      # toolbar-<flag>-<pass>.json, raw-*.txt, hooks.json, gate.json and gate.log are uploaded; the step fails when a check fails.
      - name: WKTR toolbar gate (hook symbols, forced-inset fixture, verdict)
        if: ${{ inputs.toolbar || contains(github.event.head_commit.message, '[toolbar]') }}
        env:
          JOB: ${{ matrix.job }}
        run: |
          set -uo pipefail
          rc=0
          sh packages/measure-wktr/scripts/hook-check.sh "$RUNNER_TEMP/wktr-root/Release-iphonesimulator/WebKitTestRunnerApp.app/WebKitTestRunnerApp" "$RUNNER_TEMP/result/hooks.json" || rc=1
          node packages/measure-wktr/src/toolbar-cli.mjs run --keep \
            --root "$RUNNER_TEMP/wktr-root" --out "$RUNNER_TEMP/result" --passes 2 --label "$JOB" 2>&1 | tee "$RUNNER_TEMP/result/run.log" || rc=1
          node packages/measure-wktr/src/gate.mjs "$RUNNER_TEMP/result" --hooks "$RUNNER_TEMP/result/hooks.json" \
            --out "$RUNNER_TEMP/result/gate.json" --min-passes 2 2>&1 | tee "$RUNNER_TEMP/result/gate.log" || rc=1
          ls -l "$RUNNER_TEMP/result"
          exit $rc

      # One device, one fresh WebKitTestRunnerApp process per pass, `passes` passes per harness variant:
      #   live  the page as it is (Date and Math.random pinned, real timers and rAF timestamps)
      #   vt    virtual time: performance.now, rAF timestamps, timers and Date move one frame at a time (src/vtime.mjs)
      #   -warm the page is scrolled through once first (lazy loads done), -still suspends CSS animations (diagnostic), -trace adds event counters (cause attribution)
      # counts-<variant>-<pass>.json per pass.
      - name: WKTR, fresh process per pass, per variant
        if: ${{ !(inputs.repaint || contains(github.event.head_commit.message, '[repaint]') || inputs.toolbar || contains(github.event.head_commit.message, '[toolbar]') || inputs.accel || contains(github.event.head_commit.message, '[accel]')) }}
        env:
          PASSES: ${{ inputs.passes || '3' }}
          STEP: ${{ inputs.step || '50' }}
          VARIANTS: ${{ inputs.variants || 'live,vt' }}
          JOB: ${{ matrix.job }}
        run: |
          set -euo pipefail
          node packages/measure-wktr/src/cli.mjs run --keep \
            --root "$RUNNER_TEMP/wktr-root" --site snapshot/site --out "$RUNNER_TEMP/result" \
            --passes "$PASSES" --step "$STEP" --variants "$VARIANTS" --label "$JOB" 2>&1 | tee "$RUNNER_TEMP/result/run.log"
          ls -l "$RUNNER_TEMP/result"

      - name: Delete the Simulator device
        if: ${{ (always()) && steps.stale.outcome == 'skipped' }}
        run: |
          xcrun simctl shutdown all || true
          xcrun simctl delete fw-wktr || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ (always()) && steps.stale.outcome == 'skipped' }}
        with:
          name: wktr-${{ matrix.job }}
          path: ${{ runner.temp }}/result
          if-no-files-found: error
          retention-days: 30

  # fwcore decides the classes (Lean Fw.Measure.classify); it is built here and used by the classes job.
  fwcore:
    needs: [guard]
    if: ${{ needs.guard.outputs.run == 'true' }}
    concurrency:
      group: ci-lane:wktr:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:fwcore:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lean
      - name: lake build fwcore
        working-directory: lean
        run: lake build fwcore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wktr-fwcore
          path: lean/.lake/build/bin/fwcore
          if-no-files-found: error
          retention-days: 1

  # Classes per count type over every pass of every job (policy kMax 4, tMax 24), and over the passes of each job alone.
  classes:
    needs: [guard, wktr, fwcore]
    if: ${{ always() && needs.guard.outputs.run == 'true' && needs.wktr.result != 'cancelled' && needs.fwcore.result == 'success' && !(inputs.repaint || contains(github.event.head_commit.message, '[repaint]') || inputs.toolbar || contains(github.event.head_commit.message, '[toolbar]') || inputs.accel || contains(github.event.head_commit.message, '[accel]')) }}
    concurrency:
      group: ci-lane:wktr:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:classes:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wktr-fwcore
          path: ${{ runner.temp }}/fwcore
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wktr-j*
          path: ${{ runner.temp }}/runs
      - name: Classes
        env:
          FW_CORE_BIN: ${{ runner.temp }}/fwcore/fwcore
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SHA: ${{ github.sha }}
          VARIANTS: ${{ inputs.variants || 'live,vt' }}
        run: |
          set -euo pipefail
          chmod +x "$FW_CORE_BIN"
          out="$RUNNER_TEMP/classes"
          mkdir -p "$out"
          cd "$RUNNER_TEMP/runs"
          # download-artifact puts a single matching artifact straight into the path (no subdirectory): jobs=1
          if ! ls -d wktr-j* > /dev/null 2>&1; then mkdir wktr-j1; find . -maxdepth 1 -type f -exec mv {} wktr-j1/ \;; fi
          ls
          cls="$GITHUB_WORKSPACE/packages/measure-chromium/src/classify.mjs"
          cat wktr-j*/runner.json > "$out/runners.jsonl"
          echo "workflow run $RUN_ID, attempt $RUN_ATTEMPT, sha $SHA, variants $VARIANTS" > "$out/run.txt"
          : > "$out/sha256.txt"
          # per variant: the class of each count type over every pass of every job (classes-<variant>-all.*) and over each
          # job's passes alone (classes-<variant>-<job>.txt)
          for variant in $(echo "$VARIANTS" | tr ',' ' '); do
            files=(wktr-j*/counts-"$variant"-[0-9]*.json)
            printf '%s\n' "${files[@]}"
            node "$cls" "${files[@]}" --kMax 4 --tMax 24 | tee "$out/classes-$variant-all.txt"
            node "$cls" "${files[@]}" --kMax 4 --tMax 24 --json > "$out/classes-$variant-all.json"
            for d in wktr-j*; do
              node "$cls" "$d"/counts-"$variant"-[0-9]*.json --kMax 4 --tMax 24 | tee "$out/classes-$variant-$d.txt"
            done
            sha256sum "${files[@]}" | tee -a "$out/sha256.txt"
            {
              echo "### wktr $variant: classes over all passes of all jobs (kMax 4, tMax 24)"
              echo '```'
              cat "$out/classes-$variant-all.txt"
              echo '```'
              for d in wktr-j*; do echo "#### $variant $d (its passes alone)"; echo '```'; cat "$out/classes-$variant-$d.txt"; echo '```'; done
            } >> "$GITHUB_STEP_SUMMARY"
          done
          { echo '### sha256 of counts per pass'; echo '```'; cat "$out/sha256.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wktr-classes
          path: ${{ runner.temp }}/classes
          if-no-files-found: error
          retention-days: 30

  # Invisible paint: the part x zone x arm table per 100 frames and the class of every count type per arm and zone over the jobs
  # (policy kMax 4, tMax 24; fwcore decides, the summary script only moves numbers).
  repaint-summary:
    needs: [guard, wktr, fwcore]
    if: ${{ always() && needs.guard.outputs.run == 'true' && needs.wktr.result != 'cancelled' && needs.fwcore.result == 'success' && (inputs.repaint || contains(github.event.head_commit.message, '[repaint]')) }}
    concurrency:
      group: ci-lane:wktr:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:repaint-summary:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wktr-fwcore
          path: ${{ runner.temp }}/fwcore
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wktr-j*
          path: ${{ runner.temp }}/runs
      - name: Summary
        env:
          FW_CORE_BIN: ${{ runner.temp }}/fwcore/fwcore
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          chmod +x "$FW_CORE_BIN"
          out="$RUNNER_TEMP/summary"
          mkdir -p "$out"
          cd "$RUNNER_TEMP/runs"
          ls
          echo "workflow run $RUN_ID, sha $SHA" > "$out/run.txt"
          cat wktr-j*/runner.json > "$out/runners.jsonl"
          node "$GITHUB_WORKSPACE/packages/measure-wktr/src/repaint-summary.mjs" "$RUNNER_TEMP/runs" --out "$out" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repaint-summary
          path: ${{ runner.temp }}/summary
          if-no-files-found: error
          retention-days: 30
