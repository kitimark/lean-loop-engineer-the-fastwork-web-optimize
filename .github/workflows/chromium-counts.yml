name: chromium-counts

# The title of a dispatched run echoes its nonce (`chromium-counts dispatch nonce=<n>`), so `fw run` and `fw ci wait --nonce` find the run
# they dispatched by identity (Lean Fw.Ci.Dispatch.wanted), never as "the newest run". A push keeps its default title.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('chromium-counts dispatch nonce={0}', inputs.nonce || 'none') || '' }}

# Chromium counts lane (PLAN 4.1-4.2) on GitHub-hosted arm64 Linux: the same image and browser bytes as the local Docker
# run. N runs on N fresh VMs give the cross-machine determinism check (V-i) that one Mac cannot.
# CI results are a separate `platform` key until a local-vs-CI V-b check passes (research note ci-measurement-feasibility).
on:
  # Inputs: the Chromium harness and image, the rewrite it measures (apps/site, built with the pnpm workspace files), fwcore and
  # the breakpoint sources (lean/), the snapshot and its lock, the scripts and actions the jobs use.
  # Every push creates a run and its guard job decides on these inputs (Lean Fw.Ci.Intent); `workflow_dispatch` runs it on demand
  # (gh workflow run <name> --ref <branch>). Why: docs/team/handoffs/ci-trigger-scope.md.
  push:
    branches: ['ci/**']
  workflow_dispatch:
    inputs:
      profile:
        description: Profile file name in packages/measure-chromium/profiles, or a probe in packages/measure-chromium/probes (without .json)
        type: string
        default: swipe-v1
      runs:
        description: Determinism runs, each on its own VM (2 to 10, the Lean request rule Fw.Store.Layout.reqProblems; one run has no class, and actions/download-artifact extracts a single matched artifact without its directory)
        type: string
        default: '3'
      target:
        description: Which page to measure, each on its own VMs with the same profile, image and flags (original = the snapshot, rewrite = apps/site prerendered build)
        type: choice
        options: [both, original, rewrite]
        default: both
      preset:
        description: Rewrite preset to measure (apps/site/src/registry/presets/<name>.json); original = the default config. Applies to the rewrite jobs only (the original snapshot has no presets)
        type: string
        default: original
      fw:
        description: Rewrite flag set, comma separated part:variant (for example hero.countdown:strip), on top of the preset; empty = none. Applies to the rewrite jobs only
        type: string
        default: ''
      only:
        description: Part page to measure instead of the whole page (a part or group id such as hero or hero.exit; the rewrite stage route ?only=<id>, Fw.Site.Stage). Rewrite target only. A part page is client-rendered; its counts are those of one mounted part, so the frozen classes of the full page are a premise there (declared-rows-unverified)
        type: string
        default: ''
      image_run:
        description: Optional run id of an earlier chromium-counts run; its chromium-image artifact is reused instead of building (class-freeze pins one image across workflow runs this way)
        type: string
        default: ''
      nonce:
        description: >-
          Identity of this dispatch, echoed in the run title (8 to 32 characters of a-z0-9; `fw run` sets it). Empty = a manual dispatch.
        type: string
        default: ''

permissions:
  contents: read

env:
  IMAGE: fw-measure-chromium:1

jobs:
  # Guard (Lean Fw.Ci.Intent + Fw.Ci.Trigger, scripts/ci-paths.mjs). On a ci/* push it, and so every job, is skipped unless
  # the head commit asks for this lane (`[ci:<lane>]`; the default lane lean always); then it runs the workflow only if
  # the commit is the branch tip, is not on main yet, and (lean: always) some file that differs from main on the whole
  # branch is an input. A main push starts no run; dispatches always run. Fails open.
  # Every other job re-checks the tip first (`stale:` fails it) and has its own group, never cancelled on ci/*.
  guard:
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/ci/') || contains(github.event.head_commit.message, '[ci:chromium-counts]') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - id: g
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          GUARD_TOKEN: ${{ github.token }}
        run: node .github/scripts/changed-inputs.mjs --workflow .github/workflows/chromium-counts.yml
      - name: 'decision: run'
        if: steps.g.outputs.run == 'true'
        run: 'true'
      - name: 'decision: skip: ${{ steps.g.outputs.reason }}'
        if: steps.g.outputs.run != 'true'
        run: 'true'

  plan:
    needs: [guard]
    if: ${{ needs.guard.outputs.run == 'true' }}
    concurrency:
      group: ci-lane:chromium-counts:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:plan:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      profile: ${{ steps.m.outputs.profile }}
      targets: ${{ steps.m.outputs.targets }}
      rewrite: ${{ steps.m.outputs.rewrite }}
      search: ${{ steps.m.outputs.search }}
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            packages/measure-chromium/profiles
            packages/measure-chromium/probes
            packages/measure-chromium/src
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - id: m
        env:
          PROFILE: ${{ inputs.profile || 'swipe-v1' }}
          RUNS: ${{ inputs.runs || '3' }}
          TARGET: ${{ inputs.target || 'both' }}
          PRESET: ${{ inputs.preset || 'original' }}
          FW: ${{ inputs.fw || '' }}
          ONLY: ${{ inputs.only || '' }}
        run: |
          set -euo pipefail
          case "$PROFILE" in ''|*[!a-z0-9-]*) echo "bad profile name" >&2; exit 1 ;; esac
          case "$RUNS" in ''|*[!0-9]*) echo "runs must be a number" >&2; exit 1 ;; esac
          if [ "$RUNS" -lt 2 ] || [ "$RUNS" -gt 10 ]; then echo "runs must be 2..10" >&2; exit 1; fi
          # Lean Fw.Measure.Profile.resolve: a name is in exactly one of profiles/ (counts) and probes/ (probe).
          dir=""
          if [ -f "packages/measure-chromium/profiles/$PROFILE.json" ]; then dir=profiles; fi
          if [ -f "packages/measure-chromium/probes/$PROFILE.json" ]; then
            if [ -n "$dir" ]; then echo "profile $PROFILE is in both profiles/ and probes/" >&2; exit 1; fi
            dir=probes
          fi
          if [ -z "$dir" ]; then echo "profile $PROFILE is in neither profiles/ nor probes/" >&2; exit 1; fi
          # The rewrite page is chosen by its query string (apps/site: ?preset=<name>&fw=<part:variant,...>). The default
          # config has the empty query. The site build prerenders exactly this query, so the measured page hydrates.
          case "$PRESET" in ''|*[!a-z0-9-]*) echo "bad preset name" >&2; exit 1 ;; esac
          case "$FW" in *[!A-Za-z0-9.:@,_-]*) echo "bad fw flag set" >&2; exit 1 ;; esac
          case "$ONLY" in *[!A-Za-z0-9.]*|.*|*.) echo "bad only id" >&2; exit 1 ;; esac
          search=""
          if [ "$PRESET" != original ]; then search="?preset=$PRESET"; fi
          if [ -n "$FW" ]; then
            if [ -n "$search" ]; then search="$search&fw=$FW"; else search="?fw=$FW"; fi
          fi
          if [ -n "$ONLY" ]; then
            if [ "$TARGET" != rewrite ]; then echo "only applies to the rewrite: use target rewrite" >&2; exit 1; fi
            if [ -n "$search" ]; then search="$search&only=$ONLY"; else search="?only=$ONLY"; fi
            # Fw.Site.StageMode: the part page gets the profile viewport as its stage environment (the page pins innerWidth/innerHeight to it).
            vw=$(jq -r '.viewport.width' "packages/measure-chromium/$dir/$PROFILE.json")
            vh=$(jq -r '.viewport.height' "packages/measure-chromium/$dir/$PROFILE.json")
            search=$(node packages/measure-chromium/src/stage-mode.mjs plan "$search" "$vw" "$vh")
          fi
          if [ -n "$search" ] && [ "$TARGET" = original ]; then echo "preset/fw apply to the rewrite: use target both or rewrite" >&2; exit 1; fi
          echo "search=$search" >> "$GITHUB_OUTPUT"
          case "$TARGET" in
            both) targets='["original","rewrite"]' ;;
            original) targets='["original"]' ;;
            rewrite) targets='["rewrite"]' ;;
            *) echo "bad target" >&2; exit 1 ;;
          esac
          # One job per (target, run): every job is its own VM, original and rewrite alike.
          matrix=$(seq 1 "$RUNS" | jq -R -s -c --argjson t "$targets" '(split("\n") | map(select(length > 0)) | map("r" + .)) as $r | {include: [$t[] as $x | $r[] | {target: $x, run: .}]}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          if [ "$TARGET" = original ]; then echo "rewrite=false" >> "$GITHUB_OUTPUT"; else echo "rewrite=true" >> "$GITHUB_OUTPUT"; fi
          echo "matrix: $matrix"

  # fwcore decides the zone sums and the classes (Lean). It is built here and passed to the jobs by artifact.
  fwcore:
    needs: [guard]
    if: ${{ needs.guard.outputs.run == 'true' }}
    concurrency:
      group: ci-lane:chromium-counts:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:fwcore:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lean
      - name: lake build fwcore
        working-directory: lean
        run: lake build fwcore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fwcore
          path: lean/.lake/build/bin/fwcore
          if-no-files-found: error
          retention-days: 1

  # The rewrite, built once (prerendered default config); every rewrite counts job downloads this exact build. `pnpm build` of
  # the site first runs `lake exe breakgen --check` (the checked-in breakpoints must equal Lean's output), hence setup-lean.
  site:
    needs: [plan]
    if: ${{ needs.plan.outputs.rewrite == 'true' }}
    concurrency:
      group: ci-lane:chromium-counts:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:site:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@fw/site...'
      - uses: ./.github/actions/telemetry
        with:
          mode: start
          label: site
      - uses: ./.github/actions/setup-lean
      - uses: ./.github/actions/telemetry
        with:
          mode: cache
          cache-dirs: lake=${{ github.workspace }}/.lake-cache
      - name: Build the rewrite (default prerendered config)
        env:
          SEARCH: ${{ needs.plan.outputs.search }}
        run: |
          set -euo pipefail
          # An empty search is the default config, which every build prerenders; any other query is added as a page.
          # A part page (?only=) is not prerendered: its shell is the home page and the client renders the stage.
          case "$SEARCH" in
            ''|*only=*) pnpm --filter @fw/site build ;;
            *) pnpm --filter @fw/site build --config "$SEARCH" ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: apps/site/dist/aot
          if-no-files-found: error
          retention-days: 3
      - uses: ./.github/actions/telemetry
        if: ${{ (always()) && steps.stale.outcome == 'skipped' }}
        with:
          mode: finish
          label: site

  # Build the image once. The matrix jobs load this exact image and check its content id (the config digest)
  # against the one printed here, so no matrix job rebuilds it (apt packages are not pinned, so a rebuild could differ).
  image:
    needs: [guard]
    if: ${{ needs.guard.outputs.run == 'true' }}
    concurrency:
      group: ci-lane:chromium-counts:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:image:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    # actions: read lets the reuse step download the artifact of an earlier run of this workflow.
    permissions:
      contents: read
      actions: read
    outputs:
      image-id: ${{ steps.build.outputs.image-id || steps.reuse.outputs.image-id }}
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/telemetry
        with:
          mode: start
          label: image
      - id: build
        if: ${{ inputs.image_run == '' }}
        run: |
          set -euo pipefail
          docker build -t "$IMAGE" packages/measure-chromium
          id=$(docker image inspect --format '{{.Id}}' "$IMAGE")
          echo "image-id=$id" >> "$GITHUB_OUTPUT"
          echo "image id: $id"
          docker run --rm --entrypoint sh -v "$PWD/packages/measure-chromium/src:/driver:ro" "$IMAGE" /driver/image-check.sh
      - name: Save the image
        if: ${{ inputs.image_run == '' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/image"
          docker save "$IMAGE" | zstd -T0 -10 -q -o "$RUNNER_TEMP/image/image.tar.zst"
          ls -l "$RUNNER_TEMP/image"
      # Reuse: the same image bytes as an earlier run, so several workflow runs share one image id.
      - name: Reuse the image of an earlier run
        if: ${{ inputs.image_run != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chromium-image
          path: ${{ runner.temp }}/image
          run-id: ${{ inputs.image_run }}
          github-token: ${{ github.token }}
      - id: reuse
        if: ${{ inputs.image_run != '' }}
        run: |
          set -euo pipefail
          zstd -dc "$RUNNER_TEMP/image/image.tar.zst" | docker load
          id=$(docker image inspect --format '{{.Id}}' "$IMAGE")
          echo "image-id=$id" >> "$GITHUB_OUTPUT"
          echo "reused image id: $id (from run ${{ inputs.image_run }})"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chromium-image
          path: ${{ runner.temp }}/image/image.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - uses: ./.github/actions/telemetry
        if: ${{ (always()) && steps.stale.outcome == 'skipped' }}
        with:
          mode: finish
          label: image

  counts:
    needs: [plan, fwcore, image, site]
    # site is skipped when only the original is measured; anything else that did not succeed stops the counts.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.fwcore.result == 'success' && needs.image.result == 'success' && (needs.site.result == 'success' || needs.site.result == 'skipped') }}
    name: counts (${{ matrix.target }}, ${{ matrix.run }})
    concurrency:
      group: ci-lane:chromium-counts:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:counts:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/telemetry
        with:
          mode: start
          label: counts-${{ matrix.target }}-${{ matrix.run }}

      # First step that touches data: the snapshot in git must equal snapshot.lock.json.
      - name: Verify the snapshot against snapshot.lock.json
        run: node .github/scripts/verify-snapshot.mjs

      # The raster thread count depends on the CPU count unless it is pinned (research note, section 1). Refuse to
      # produce counts from a harness that does not pin it.
      - name: Harness pin check
        run: grep -q -- '--num-raster-threads=2' packages/measure-chromium/src/run.mjs


      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fwcore
          path: ${{ runner.temp }}/fwcore
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chromium-image
          path: ${{ runner.temp }}/image

      - name: Download the rewrite build
        if: ${{ matrix.target == 'rewrite' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: ${{ github.workspace }}/apps/site/dist/aot

      - name: Load the image and check its digest
        env:
          WANT_ID: ${{ needs.image.outputs.image-id }}
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/fwcore/fwcore"
          zstd -dc "$RUNNER_TEMP/image/image.tar.zst" | docker load
          got=$(docker image inspect --format '{{.Id}}' "$IMAGE")
          echo "want $WANT_ID"
          echo "got  $got"
          test "$got" = "$WANT_ID"

      - name: Runner facts
        run: sh .github/scripts/runner-info.sh "$RUNNER_TEMP/runner.json"

      - name: Counts run
        env:
          PROFILE: ${{ needs.plan.outputs.profile }}
          LABEL: ${{ matrix.run }}
          TARGET: ${{ matrix.target }}
          SEARCH: ${{ needs.plan.outputs.search }}
          FW_SNAPSHOT_DIR: ${{ github.workspace }}/snapshot/site
          FW_CORE_BIN: ${{ runner.temp }}/fwcore/fwcore
          # Read by the harness once it learns it (harness change H2, see .github/README.md); a no-op until then.
          FW_DOCKER_CPUS: '4'
        run: |
          set -euo pipefail
          args=(--profile "$PROFILE" --label "$LABEL" --target "$TARGET")
          if [ "$TARGET" = rewrite ] && [ -n "$SEARCH" ]; then args+=(--search "$SEARCH"); fi
          node packages/measure-chromium/src/host.mjs "${args[@]}"

      - name: Collect the result
        env:
          PROFILE: ${{ needs.plan.outputs.profile }}
          LABEL: ${{ matrix.run }}
          WANT_ID: ${{ needs.image.outputs.image-id }}
        run: |
          set -euo pipefail
          res="$RUNNER_TEMP/result"
          mkdir -p "$res"
          cp "packages/measure-chromium/out/$PROFILE/$LABEL/counts.json" "packages/measure-chromium/out/$PROFILE/$LABEL/zones.json" "packages/measure-chromium/out/$PROFILE/$LABEL/host.json" "$res/"
          cp "$RUNNER_TEMP/runner.json" "$res/runner.json"
          printf '%s\n' "$WANT_ID" > "$res/image-id.txt"
          (cd "$res" && sha256sum counts.json zones.json | tee sha256.txt)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chromium-counts-${{ matrix.target }}-${{ matrix.run }}
          path: ${{ runner.temp }}/result
          if-no-files-found: error
          retention-days: 30
      - uses: ./.github/actions/telemetry
        if: ${{ (always()) && steps.stale.outcome == 'skipped' }}
        with:
          mode: finish
          label: counts-${{ matrix.target }}-${{ matrix.run }}

  # Classes over all runs, decided by fwcore (the same classify the local lane uses), plus the byte comparison.
  classify:
    needs: [plan, fwcore, counts]
    # `counts` runs when `site` is skipped (target=original); without this condition that skip propagates to classify.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.fwcore.result == 'success' && needs.counts.result == 'success' }}
    concurrency:
      group: ci-lane:chromium-counts:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:classify:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fwcore
          path: ${{ runner.temp }}/fwcore
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: chromium-counts-*
          path: ${{ runner.temp }}/runs
      - name: Classes and byte comparison
        env:
          FW_CORE_BIN: ${{ runner.temp }}/fwcore/fwcore
          PROFILE: ${{ needs.plan.outputs.profile }}
          TARGETS: ${{ needs.plan.outputs.targets }}
          SEARCH: ${{ needs.plan.outputs.search }}
        run: |
          set -euo pipefail
          chmod +x "$FW_CORE_BIN"
          cls="$GITHUB_WORKSPACE/packages/measure-chromium/src/classify.mjs"
          out="$RUNNER_TEMP/classes"
          mkdir -p "$out"
          cd "$RUNNER_TEMP/runs"
          ls
          echo "profile $PROFILE, workflow run $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT, sha $GITHUB_SHA" > "$out/run.txt"
          echo "search of the rewrite: '$SEARCH'" >> "$out/run.txt"
          # A part page counts one mounted part; the frozen classes were measured on the whole page (apps/runner/src/engine-check.ts
          # checks against them), so every verdict on this run carries that premise (INFERRED, not measured).
          case "$SEARCH" in
            *only=*)
              echo "premise: part page, frozen-classes: the classes frozen for the whole page are assumed to bound this part page (declared-rows-unverified)" >> "$out/run.txt"
              echo '> Part page (`?only=`): counts of one mounted part. Premise: the classes frozen on the whole page are assumed to bound it (declared-rows-unverified).' >> "$GITHUB_STEP_SUMMARY" ;;
          esac
          # The pinned inputs of the image (class-freeze records them next to the image id).
          (cd "$GITHUB_WORKSPACE/packages/measure-chromium" && sha256sum Dockerfile docker/apt-manifest.txt docker/fonts.conf docker/driver/package-lock.json) > "$out/image-inputs.txt"
          echo '### chromium-counts: classes over the runs' >> "$GITHUB_STEP_SUMMARY"
          # Each target goes through the same classify path (fwcore Fw.Measure.classify, kMax 4, tMax 24).
          for t in $(echo "$TARGETS" | jq -r '.[]'); do
            d="$out/$t"; mkdir -p "$d"
            files=(chromium-counts-"$t"-*/counts.json)
            node "$cls" "${files[@]}" --kMax 4 --tMax 24 | tee "$d/classes.txt"
            node "$cls" "${files[@]}" --kMax 4 --tMax 24 --json > "$d/classes.json"
            sha256sum chromium-counts-"$t"-*/counts.json chromium-counts-"$t"-*/zones.json | tee "$d/sha256-all.txt"
            cat chromium-counts-"$t"-*/runner.json > "$d/runners.jsonl"
            cat chromium-counts-"$t"-*/image-id.txt | sort | uniq -c > "$d/image-ids.txt"
            # Container attempts per job (host.json): more than 1 = a BeginFrame wedge that the host retried.
            for h in chromium-counts-"$t"-*/host.json; do echo "$h $(jq -c '{attempts, hostWallS}' "$h")"; done | tee "$d/attempts.txt"
            {
              echo "#### $t"
              echo '```'; cat "$d/classes.txt"; echo '```'
              echo 'attempts per job:'; echo '```'; cat "$d/attempts.txt"; echo '```'
              echo 'sha256 of counts.json and zones.json per run:'; echo '```'; cat "$d/sha256-all.txt"; echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
          # Original (A) next to rewrite (R), per type.
          if [ -f "$out/original/classes.json" ] && [ -f "$out/rewrite/classes.json" ]; then
            node -e '
              const [a, r] = process.argv.slice(1).map((f) => JSON.parse(require("fs").readFileSync(f, "utf8")));
              const f = (c) => c ? `${c.class}(${c.k},${c.t})` : "-";
              const w = Math.max(...Object.keys({ ...a, ...r }).map((t) => t.length));
              console.log(`${"type".padEnd(w)}  ${"A original".padEnd(22)} R rewrite`);
              for (const t of Object.keys({ ...a, ...r })) console.log(`${t.padEnd(w)}  ${f(a[t]).padEnd(22)} ${f(r[t])}`);
            ' "$out/original/classes.json" "$out/rewrite/classes.json" | tee "$out/a-vs-r.txt"
            { echo '#### A (original) next to R (rewrite): class(k,t)'; echo '```'; cat "$out/a-vs-r.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chromium-classes
          path: ${{ runner.temp }}/classes
          if-no-files-found: error
          retention-days: 30
