name: chromium-counts

# Chromium counts lane (PLAN 4.1-4.2) on GitHub-hosted arm64 Linux: the same image and browser bytes as the local Docker
# run. N runs on N fresh VMs give the cross-machine determinism check (V-i) that one Mac cannot.
# CI results are a separate `platform` key until a local-vs-CI V-b check passes (research note ci-measurement-feasibility).
on:
  # Inputs: the Chromium harness and image, the rewrite it measures (apps/site, built with the pnpm workspace files), fwcore and
  # the breakpoint sources (lean/), the snapshot and its lock, the scripts and actions the jobs use.
  # A push runs this workflow only when it changes one of these paths; `workflow_dispatch` runs it on demand
  # (gh workflow run <name> --ref <branch>). Why: docs/team/handoffs/ci-trigger-scope.md.
  push:
    branches: ['ci/**', main]
    paths:
      - 'packages/measure-chromium/**'
      - 'apps/site/**'
      - 'lean/Main.lean'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'
      - 'lean/lean-toolchain'
      - 'lean/Fw/Board.lean'
      - 'lean/Fw/Ci/Budget.lean'
      - 'lean/Fw/Ci/Wire.lean'
      - 'lean/Fw/Console.lean'
      - 'lean/Fw/Console/Alert.lean'
      - 'lean/Fw/Console/Land.lean'
      - 'lean/Fw/Console/Self.lean'
      - 'lean/Fw/Gate/Compare.lean'
      - 'lean/Fw/Gate/Items.lean'
      - 'lean/Fw/Gate/Reach.lean'
      - 'lean/Fw/Gate/Rule.lean'
      - 'lean/Fw/Gate/State.lean'
      - 'lean/Fw/Measure/Arms.lean'
      - 'lean/Fw/Measure/Classes.lean'
      - 'lean/Fw/Measure/EngineCheck.lean'
      - 'lean/Fw/Measure/Freeze.lean'
      - 'lean/Fw/Measure/Neutral.lean'
      - 'lean/Fw/Measure/Quiet.lean'
      - 'lean/Fw/Measure/SelfCheck.lean'
      - 'lean/Fw/Measure/Snapshot.lean'
      - 'lean/Fw/Measure/Splits.lean'
      - 'lean/Fw/Measure/StepAlign.lean'
      - 'lean/Fw/Measure/Tolerance.lean'
      - 'lean/Fw/Measure/WebKit.lean'
      - 'lean/Fw/Measure/Wire.lean'
      - 'lean/Fw/Measure/ZoneBaseline.lean'
      - 'lean/Fw/Measure/Zones.lean'
      - 'lean/Fw/Obs/Health.lean'
      - 'lean/Fw/Obs/Next.lean'
      - 'lean/Fw/Obs/Signals.lean'
      - 'lean/Fw/Obs/Timing.lean'
      - 'lean/Fw/Ops/Identity.lean'
      - 'lean/Fw/Ops/Meter.lean'
      - 'lean/Fw/Ops/Obs.lean'
      - 'lean/Fw/Ops/PathCheck.lean'
      - 'lean/Fw/Ops/SpawnGuard.lean'
      - 'lean/Fw/Ops/Usage.lean'
      - 'lean/Fw/Ops/Wire.lean'
      - 'lean/Fw/Plan/Core.lean'
      - 'lean/Fw/Plan/Graph.lean'
      - 'lean/Fw/Plan/Incident.lean'
      - 'lean/Fw/Plan/Lint.lean'
      - 'lean/Fw/Plan/Trailer.lean'
      - 'lean/Fw/Sched/Admit.lean'
      - 'lean/Fw/Sched/ParMetrics.lean'
      - 'lean/Fw/Serve.lean'
      - 'lean/Fw/Site/BreakpointFacts.lean'
      - 'lean/Fw/Site/BreakpointGen.lean'
      - 'lean/Fw/Site/BreakpointMatrix.lean'
      - 'lean/Fw/Site/Breakpoints.lean'
      - 'lean/Fw/Spec/Cost.lean'
      - 'lean/Fw/Spec/DeviceQueue.lean'
      - 'lean/Fw/Spec/Flags.lean'
      - 'lean/Fw/Spec/Frames.lean'
      - 'lean/Fw/Spec/Lease.lean'
      - 'lean/Fw/Spec/Null.lean'
      - 'lean/Fw/Spec/Screen.lean'
      - 'lean/Fw/Spec/Verdict.lean'
      - 'lean/Fw/Store/Ci.lean'
      - 'lean/Fw/Store/Layout.lean'
      - 'lean/Fw/Store/Reduce.lean'
      - 'lean/Fw/Wire.lean'
      - 'lean/Fw/Wire/Console.lean'
      - 'lean/Fw/Wire/Gate.lean'
      - 'lean/Fw/Wire/Obs.lean'
      - 'lean/Fw/Wire/OpsGate.lean'
      - 'lean/Fw/Wire/Plan.lean'
      - 'lean/Fw/Wire/Sched.lean'
      - 'lean/Fw/Wire/Store.lean'
      - 'lean/BreakgenMain.lean'
      - 'lean/Fw/Gate/Merge.lean'
      - 'lean/Fw/Gate/Mount.lean'
      - 'lean/Fw/Gate/Scope.lean'
      - 'lean/Fw/Gate/ScopeGen.lean'
      - 'lean/Fw/Gate/SweepReduce.lean'
      - 'lean/Fw/Gate/SweepsGen.lean'
      - 'lean/Fw/Parts/MorphMount.lean'
      - 'snapshot/**'
      - 'snapshot.lock.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/scripts/verify-snapshot.mjs'
      - '.github/scripts/runner-info.sh'
      - '.github/scripts/changed-inputs.mjs'
      - '.github/actions/setup-lean/**'
      - '.github/actions/setup-pnpm/**'
      - '.github/workflows/chromium-counts.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: Profile file name in packages/measure-chromium/profiles (without .json)
        type: string
        default: swipe-v1
      runs:
        description: Determinism runs, each on its own VM (1 to 10)
        type: string
        default: '3'
      target:
        description: Which page to measure, each on its own VMs with the same profile, image and flags (original = the snapshot, rewrite = apps/site prerendered build)
        type: choice
        options: [both, original, rewrite]
        default: both
      preset:
        description: Rewrite preset to measure (apps/site/src/registry/presets/<name>.json); original = the default config. Applies to the rewrite jobs only (the original snapshot has no presets)
        type: string
        default: original
      fw:
        description: Rewrite flag set, comma separated part:variant (for example hero.countdown:strip), on top of the preset; empty = none. Applies to the rewrite jobs only
        type: string
        default: ''
      image_run:
        description: Optional run id of an earlier chromium-counts run; its chromium-image artifact is reused instead of building (class-freeze pins one image across workflow runs this way)
        type: string
        default: ''

permissions:
  contents: read

# A newer push to the same ci/** branch cancels the older run of this workflow; main never cancels (a run there is a record).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/ci/') }}

env:
  IMAGE: fw-measure-chromium:1

jobs:
  # Paths guard (Lean Fw.Ci.Trigger, scripts/ci-paths.mjs): on a ci/* push, runs the workflow only if THIS push changed one of
  # its inputs (the paths list under `on.push`) to something other than main's content; main pushes, dispatches and
  # schedules always run. Fails open on error.
  guard:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: g
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: node .github/scripts/changed-inputs.mjs --workflow .github/workflows/chromium-counts.yml

  plan:
    needs: [guard]
    if: ${{ needs.guard.outputs.run == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      profile: ${{ steps.m.outputs.profile }}
      targets: ${{ steps.m.outputs.targets }}
      rewrite: ${{ steps.m.outputs.rewrite }}
      search: ${{ steps.m.outputs.search }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: packages/measure-chromium/profiles
      - id: m
        env:
          PROFILE: ${{ inputs.profile || 'swipe-v1' }}
          RUNS: ${{ inputs.runs || '3' }}
          TARGET: ${{ inputs.target || 'both' }}
          PRESET: ${{ inputs.preset || 'original' }}
          FW: ${{ inputs.fw || '' }}
        run: |
          set -euo pipefail
          case "$PROFILE" in ''|*[!a-z0-9-]*) echo "bad profile name" >&2; exit 1 ;; esac
          case "$RUNS" in ''|*[!0-9]*) echo "runs must be a number" >&2; exit 1 ;; esac
          if [ "$RUNS" -lt 1 ] || [ "$RUNS" -gt 10 ]; then echo "runs must be 1..10" >&2; exit 1; fi
          test -f "packages/measure-chromium/profiles/$PROFILE.json"
          # The rewrite page is chosen by its query string (apps/site: ?preset=<name>&fw=<part:variant,...>). The default
          # config has the empty query. The site build prerenders exactly this query, so the measured page hydrates.
          case "$PRESET" in ''|*[!a-z0-9-]*) echo "bad preset name" >&2; exit 1 ;; esac
          case "$FW" in *[!A-Za-z0-9.:@,_-]*) echo "bad fw flag set" >&2; exit 1 ;; esac
          search=""
          if [ "$PRESET" != original ]; then search="?preset=$PRESET"; fi
          if [ -n "$FW" ]; then
            if [ -n "$search" ]; then search="$search&fw=$FW"; else search="?fw=$FW"; fi
          fi
          if [ -n "$search" ] && [ "$TARGET" = original ]; then echo "preset/fw apply to the rewrite: use target both or rewrite" >&2; exit 1; fi
          echo "search=$search" >> "$GITHUB_OUTPUT"
          case "$TARGET" in
            both) targets='["original","rewrite"]' ;;
            original) targets='["original"]' ;;
            rewrite) targets='["rewrite"]' ;;
            *) echo "bad target" >&2; exit 1 ;;
          esac
          # One job per (target, run): every job is its own VM, original and rewrite alike.
          matrix=$(seq 1 "$RUNS" | jq -R -s -c --argjson t "$targets" '(split("\n") | map(select(length > 0)) | map("r" + .)) as $r | {include: [$t[] as $x | $r[] | {target: $x, run: .}]}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          if [ "$TARGET" = original ]; then echo "rewrite=false" >> "$GITHUB_OUTPUT"; else echo "rewrite=true" >> "$GITHUB_OUTPUT"; fi
          echo "matrix: $matrix"

  # fwcore decides the zone sums and the classes (Lean). It is built here and passed to the jobs by artifact.
  fwcore:
    needs: [guard]
    if: ${{ needs.guard.outputs.run == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lean
      - name: lake build fwcore
        working-directory: lean
        run: lake build fwcore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fwcore
          path: lean/.lake/build/bin/fwcore
          if-no-files-found: error
          retention-days: 1

  # The rewrite, built once (prerendered default config); every rewrite counts job downloads this exact build. `pnpm build` of
  # the site first runs `lake exe breakgen --check` (the checked-in breakpoints must equal Lean's output), hence setup-lean.
  site:
    needs: [plan]
    if: ${{ needs.plan.outputs.rewrite == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lean
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@fw/site...'
      - name: Build the rewrite (default prerendered config)
        env:
          SEARCH: ${{ needs.plan.outputs.search }}
        run: |
          set -euo pipefail
          # An empty search is the default config, which every build prerenders; any other query is added as a page.
          if [ -n "$SEARCH" ]; then pnpm --filter @fw/site build --config "$SEARCH"; else pnpm --filter @fw/site build; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: apps/site/dist/aot
          if-no-files-found: error
          retention-days: 3

  # Build the image once. The matrix jobs load this exact image and check its content id (the config digest)
  # against the one printed here, so no matrix job rebuilds it (apt packages are not pinned, so a rebuild could differ).
  image:
    needs: [guard]
    if: ${{ needs.guard.outputs.run == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    # actions: read lets the reuse step download the artifact of an earlier run of this workflow.
    permissions:
      contents: read
      actions: read
    outputs:
      image-id: ${{ steps.build.outputs.image-id || steps.reuse.outputs.image-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: build
        if: ${{ inputs.image_run == '' }}
        run: |
          set -euo pipefail
          docker build -t "$IMAGE" packages/measure-chromium
          id=$(docker image inspect --format '{{.Id}}' "$IMAGE")
          echo "image-id=$id" >> "$GITHUB_OUTPUT"
          echo "image id: $id"
          docker run --rm --entrypoint sh -v "$PWD/packages/measure-chromium/src:/driver:ro" "$IMAGE" /driver/image-check.sh
      - name: Save the image
        if: ${{ inputs.image_run == '' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/image"
          docker save "$IMAGE" | zstd -T0 -10 -q -o "$RUNNER_TEMP/image/image.tar.zst"
          ls -l "$RUNNER_TEMP/image"
      # Reuse: the same image bytes as an earlier run, so several workflow runs share one image id.
      - name: Reuse the image of an earlier run
        if: ${{ inputs.image_run != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chromium-image
          path: ${{ runner.temp }}/image
          run-id: ${{ inputs.image_run }}
          github-token: ${{ github.token }}
      - id: reuse
        if: ${{ inputs.image_run != '' }}
        run: |
          set -euo pipefail
          zstd -dc "$RUNNER_TEMP/image/image.tar.zst" | docker load
          id=$(docker image inspect --format '{{.Id}}' "$IMAGE")
          echo "image-id=$id" >> "$GITHUB_OUTPUT"
          echo "reused image id: $id (from run ${{ inputs.image_run }})"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chromium-image
          path: ${{ runner.temp }}/image/image.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  counts:
    needs: [plan, fwcore, image, site]
    # site is skipped when only the original is measured; anything else that did not succeed stops the counts.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.fwcore.result == 'success' && needs.image.result == 'success' && (needs.site.result == 'success' || needs.site.result == 'skipped') }}
    name: counts (${{ matrix.target }}, ${{ matrix.run }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # First step that touches data: the snapshot in git must equal snapshot.lock.json.
      - name: Verify the snapshot against snapshot.lock.json
        run: node .github/scripts/verify-snapshot.mjs

      # The raster thread count depends on the CPU count unless it is pinned (research note, section 1). Refuse to
      # produce counts from a harness that does not pin it.
      - name: Harness pin check
        run: grep -q -- '--num-raster-threads=2' packages/measure-chromium/src/run.mjs

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fwcore
          path: ${{ runner.temp }}/fwcore
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chromium-image
          path: ${{ runner.temp }}/image

      - name: Download the rewrite build
        if: ${{ matrix.target == 'rewrite' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: ${{ github.workspace }}/apps/site/dist/aot

      - name: Load the image and check its digest
        env:
          WANT_ID: ${{ needs.image.outputs.image-id }}
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/fwcore/fwcore"
          zstd -dc "$RUNNER_TEMP/image/image.tar.zst" | docker load
          got=$(docker image inspect --format '{{.Id}}' "$IMAGE")
          echo "want $WANT_ID"
          echo "got  $got"
          test "$got" = "$WANT_ID"

      - name: Runner facts
        run: sh .github/scripts/runner-info.sh "$RUNNER_TEMP/runner.json"

      - name: Counts run
        env:
          PROFILE: ${{ needs.plan.outputs.profile }}
          LABEL: ${{ matrix.run }}
          TARGET: ${{ matrix.target }}
          SEARCH: ${{ needs.plan.outputs.search }}
          FW_SNAPSHOT_DIR: ${{ github.workspace }}/snapshot/site
          FW_CORE_BIN: ${{ runner.temp }}/fwcore/fwcore
          # Read by the harness once it learns it (harness change H2, see .github/README.md); a no-op until then.
          FW_DOCKER_CPUS: '4'
        run: |
          set -euo pipefail
          args=(--profile "$PROFILE" --label "$LABEL" --target "$TARGET")
          if [ "$TARGET" = rewrite ] && [ -n "$SEARCH" ]; then args+=(--search "$SEARCH"); fi
          node packages/measure-chromium/src/host.mjs "${args[@]}"

      - name: Collect the result
        env:
          PROFILE: ${{ needs.plan.outputs.profile }}
          LABEL: ${{ matrix.run }}
          WANT_ID: ${{ needs.image.outputs.image-id }}
        run: |
          set -euo pipefail
          res="$RUNNER_TEMP/result"
          mkdir -p "$res"
          cp "packages/measure-chromium/out/$PROFILE/$LABEL/counts.json" "packages/measure-chromium/out/$PROFILE/$LABEL/zones.json" "packages/measure-chromium/out/$PROFILE/$LABEL/host.json" "$res/"
          cp "$RUNNER_TEMP/runner.json" "$res/runner.json"
          printf '%s\n' "$WANT_ID" > "$res/image-id.txt"
          (cd "$res" && sha256sum counts.json zones.json | tee sha256.txt)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chromium-counts-${{ matrix.target }}-${{ matrix.run }}
          path: ${{ runner.temp }}/result
          if-no-files-found: error
          retention-days: 30

  # Classes over all runs, decided by fwcore (the same classify the local lane uses), plus the byte comparison.
  classify:
    needs: [plan, fwcore, counts]
    # `counts` runs when `site` is skipped (target=original); without this condition that skip propagates to classify.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.fwcore.result == 'success' && needs.counts.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fwcore
          path: ${{ runner.temp }}/fwcore
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: chromium-counts-*
          path: ${{ runner.temp }}/runs
      - name: Classes and byte comparison
        env:
          FW_CORE_BIN: ${{ runner.temp }}/fwcore/fwcore
          PROFILE: ${{ needs.plan.outputs.profile }}
          TARGETS: ${{ needs.plan.outputs.targets }}
          SEARCH: ${{ needs.plan.outputs.search }}
        run: |
          set -euo pipefail
          chmod +x "$FW_CORE_BIN"
          cls="$GITHUB_WORKSPACE/packages/measure-chromium/src/classify.mjs"
          out="$RUNNER_TEMP/classes"
          mkdir -p "$out"
          cd "$RUNNER_TEMP/runs"
          ls
          echo "profile $PROFILE, workflow run $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT, sha $GITHUB_SHA" > "$out/run.txt"
          echo "search of the rewrite: '$SEARCH'" >> "$out/run.txt"
          # The pinned inputs of the image (class-freeze records them next to the image id).
          (cd "$GITHUB_WORKSPACE/packages/measure-chromium" && sha256sum Dockerfile docker/apt-manifest.txt docker/driver/package-lock.json) > "$out/image-inputs.txt"
          echo '### chromium-counts: classes over the runs' >> "$GITHUB_STEP_SUMMARY"
          # Each target goes through the same classify path (fwcore Fw.Measure.classify, kMax 4, tMax 24).
          for t in $(echo "$TARGETS" | jq -r '.[]'); do
            d="$out/$t"; mkdir -p "$d"
            files=(chromium-counts-"$t"-*/counts.json)
            node "$cls" "${files[@]}" --kMax 4 --tMax 24 | tee "$d/classes.txt"
            node "$cls" "${files[@]}" --kMax 4 --tMax 24 --json > "$d/classes.json"
            sha256sum chromium-counts-"$t"-*/counts.json chromium-counts-"$t"-*/zones.json | tee "$d/sha256-all.txt"
            cat chromium-counts-"$t"-*/runner.json > "$d/runners.jsonl"
            cat chromium-counts-"$t"-*/image-id.txt | sort | uniq -c > "$d/image-ids.txt"
            # Container attempts per job (host.json): more than 1 = a BeginFrame wedge that the host retried.
            for h in chromium-counts-"$t"-*/host.json; do echo "$h $(jq -c '{attempts, hostWallS}' "$h")"; done | tee "$d/attempts.txt"
            {
              echo "#### $t"
              echo '```'; cat "$d/classes.txt"; echo '```'
              echo 'attempts per job:'; echo '```'; cat "$d/attempts.txt"; echo '```'
              echo 'sha256 of counts.json and zones.json per run:'; echo '```'; cat "$d/sha256-all.txt"; echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
          # Original (A) next to rewrite (R), per type.
          if [ -f "$out/original/classes.json" ] && [ -f "$out/rewrite/classes.json" ]; then
            node -e '
              const [a, r] = process.argv.slice(1).map((f) => JSON.parse(require("fs").readFileSync(f, "utf8")));
              const f = (c) => c ? `${c.class}(${c.k},${c.t})` : "-";
              const w = Math.max(...Object.keys({ ...a, ...r }).map((t) => t.length));
              console.log(`${"type".padEnd(w)}  ${"A original".padEnd(22)} R rewrite`);
              for (const t of Object.keys({ ...a, ...r })) console.log(`${t.padEnd(w)}  ${f(a[t]).padEnd(22)} ${f(r[t])}`);
            ' "$out/original/classes.json" "$out/rewrite/classes.json" | tee "$out/a-vs-r.txt"
            { echo '#### A (original) next to R (rewrite): class(k,t)'; echo '```'; cat "$out/a-vs-r.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chromium-classes
          path: ${{ runner.temp }}/classes
          if-no-files-found: error
          retention-days: 30
