name: wktr-fixtures

# WKTR fixture lane (task wktr-p1p4): does a scroll-driven animation restyle in WebKit? Small own pages
# (packages/measure-wktr/fixtures/*: control, scroll-timeline, scroll-js-transform, scroll-js-bg, time-accel) run in WebKit's
# prebuilt iOS-simulator WebKitTestRunner (same archive, Xcode and runtime as wktr.yml; nothing is built here). Per scroll
# step the harness records internals.styleRecalcCount / renderingUpdateCount deltas. Counts only; nothing is phone time.
# `jobs` independent macOS jobs (separate VMs, one at a time) x `passes` fresh processes per arm; the classes job classes
# every count type per arm with fwcore (kMax 4, tMax 24) and prints the per-pass summary table.
on:
  push:
    branches: ['ci/**']
    paths:
      - 'packages/measure-wktr/**'
      - 'packages/measure-chromium/src/classify.mjs'
      - 'packages/measure-chromium/src/fwcore.mjs'
      - 'lean/Main.lean'
      - 'lean/lakefile.toml'
      - 'lean/lake-manifest.json'
      - 'lean/lean-toolchain'
      - 'lean/Fw/**'
      - 'lean/*.lean'
      - '.github/scripts/runner-info.sh'
      - '.github/scripts/changed-inputs.mjs'
      - '.github/actions/setup-lean/**'
      - '.github/workflows/wktr-fixtures.yml'
  workflow_dispatch:
    inputs:
      jobs:
        description: Independent macOS jobs (1 to 4)
        type: string
        default: '3'
      passes:
        description: Fresh-process passes per arm and job (2 to 4)
        type: string
        default: '3'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  # Paths guard (Lean Fw.Ci.Trigger, scripts/ci-paths.mjs): on a ci/* push, runs the workflow only if THIS push changed one of
  # its inputs (the paths list under `on.push`) to something other than main's content; main pushes, dispatches and
  # schedules always run. Fails open on error.
  guard:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: g
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: node .github/scripts/changed-inputs.mjs --workflow .github/workflows/wktr-fixtures.yml

  plan:
    needs: [guard]
    if: ${{ needs.guard.outputs.run == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          JOBS: ${{ inputs.jobs || '3' }}
        run: |
          set -euo pipefail
          case "$JOBS" in 1|2|3|4) ;; *) echo "jobs must be 1..4" >&2; exit 1 ;; esac
          matrix=$(seq 1 "$JOBS" | jq -R -s -c '{job: (split("\n") | map(select(length > 0)) | map("j" + .))}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  fixtures:
    needs: [plan]
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: ${{ runner.temp }}/wktr-zip
          key: wktr-ios-min-324039-${{ hashFiles('packages/measure-wktr/src/archive.json') }}
      - name: Archive, extracted into an empty directory (size and sha256 verified)
        run: sh packages/measure-wktr/scripts/fetch-archive.sh "$RUNNER_TEMP/wktr-zip" "$RUNNER_TEMP/wktr-root"
      - name: Select Xcode 26.5 and show the tools
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode_26.5*.app
          sudo xcode-select -s /Applications/Xcode_26.5.app
          mkdir -p "$RUNNER_TEMP/result"
          sh .github/scripts/runner-info.sh "$RUNNER_TEMP/result/runner.json"
          {
            sw_vers
            xcodebuild -version
            xcrun simctl list runtimes
          } | tee "$RUNNER_TEMP/result/tools.txt"
      - name: WKTR fixtures, fresh process per pass and arm
        env:
          PASSES: ${{ inputs.passes || '3' }}
        run: |
          set -euo pipefail
          sh packages/measure-wktr/fixtures/run.sh "$RUNNER_TEMP/wktr-root" "$RUNNER_TEMP/result" "$PASSES" 2>&1 | tee "$RUNNER_TEMP/result/run.log"
          node packages/measure-wktr/fixtures/summarize.mjs "$RUNNER_TEMP/result" | tee "$RUNNER_TEMP/result/summary.md"
          node packages/measure-wktr/fixtures/summarize.mjs "$RUNNER_TEMP/result" --json > "$RUNNER_TEMP/result/summary.json"
          ls -l "$RUNNER_TEMP/result"
      - name: Delete the Simulator device
        if: ${{ always() }}
        run: |
          xcrun simctl shutdown all || true
          xcrun simctl delete fw-wktr || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: wktr-fix-${{ matrix.job }}
          path: ${{ runner.temp }}/result
          if-no-files-found: error
          retention-days: 30

  fwcore:
    needs: [guard]
    if: ${{ needs.guard.outputs.run == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lean
      - name: lake build fwcore
        working-directory: lean
        run: lake build fwcore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wktr-fix-fwcore
          path: lean/.lake/build/bin/fwcore
          if-no-files-found: error
          retention-days: 1

  # Classes per arm and variant over every pass of every job (kMax 4, tMax 24), and the summary table of every pass.
  classes:
    needs: [fixtures, fwcore]
    if: ${{ always() && needs.fixtures.result != 'cancelled' && needs.fwcore.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wktr-fix-fwcore
          path: ${{ runner.temp }}/fwcore
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wktr-fix-j*
          path: ${{ runner.temp }}/runs
      - name: Classes and summary
        env:
          FW_CORE_BIN: ${{ runner.temp }}/fwcore/fwcore
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          chmod +x "$FW_CORE_BIN"
          out="$RUNNER_TEMP/classes"
          mkdir -p "$out"
          cd "$RUNNER_TEMP/runs"
          if ! ls -d wktr-fix-j* > /dev/null 2>&1; then mkdir wktr-fix-j1; find . -maxdepth 1 -mindepth 1 ! -name wktr-fix-j1 -exec mv {} wktr-fix-j1/ \;; fi
          cls="$GITHUB_WORKSPACE/packages/measure-chromium/src/classify.mjs"
          echo "workflow run $RUN_ID, sha $SHA" > "$out/run.txt"
          node "$GITHUB_WORKSPACE/packages/measure-wktr/fixtures/summarize.mjs" wktr-fix-j* | tee "$out/summary.md"
          node "$GITHUB_WORKSPACE/packages/measure-wktr/fixtures/summarize.mjs" wktr-fix-j* --json > "$out/summary.json"
          { echo '### per pass'; cat "$out/summary.md"; } >> "$GITHUB_STEP_SUMMARY"
          for armdir in wktr-fix-j1/*-f[0-9]*/; do
            arm=$(basename "$armdir")
            for first in "$armdir"counts-*-1.json; do
              variant=$(basename "$first" -1.json); variant=${variant#counts-}
              files=(wktr-fix-j*/"$arm"/counts-"$variant"-[0-9]*.json)
              node "$cls" "${files[@]}" --kMax 4 --tMax 24 | tee "$out/classes-$arm-$variant.txt"
              { echo "### $arm $variant: classes over ${#files[@]} passes"; echo '```'; cat "$out/classes-$arm-$variant.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            done
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wktr-fix-classes
          path: ${{ runner.temp }}/classes
          if-no-files-found: error
          retention-days: 30
