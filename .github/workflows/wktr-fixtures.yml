name: wktr-fixtures

# WKTR fixture lane (task wktr-p1p4): does a scroll-driven animation restyle in WebKit? Small own pages
# (packages/measure-wktr/fixtures/*: control, scroll-timeline, scroll-js-transform, scroll-js-bg, time-accel) run in WebKit's
# prebuilt iOS-simulator WebKitTestRunner (same archive, Xcode and runtime as wktr.yml; nothing is built here). Per scroll
# step the harness records internals.styleRecalcCount / renderingUpdateCount deltas. Counts only; nothing is phone time.
# `jobs` independent macOS jobs (separate VMs; `max-parallel` is Lean's: the slots webkit-sim and gate-gaps leave free, Fw.Measure.
# WktrLayout.maxParallel) x `passes` fresh processes per cell. Inside a job the cells run in the Lean layout (lanes.mjs): mode `auto`
# deals the cells of a variant over as many Simulator devices as the premise table allows (nothing proved yet: one), mode `probe` is
# the premise test: the same cells serial (k1), two (k2) and three (k3) processes at once on one VM. premise.mjs asserts the measured
# classes of the fixtures (Fw.Measure.WktrLayout.expects; this lane is the test of premise wktr_scroll_timeline_restyle), and in
# probe mode compares the class kinds of k2 and k3 with k1. Timing spans per pass, arm and layout are in the artifacts.
on:
  push:
    branches: ['ci/**']
  workflow_dispatch:
    inputs:
      jobs:
        description: Independent macOS jobs (1 to 4)
        type: string
        default: '3'
      passes:
        description: Fresh-process passes per cell and job (2 to 4)
        type: string
        default: '3'
      mode:
        description: auto (the Lean layout) or probe (the premise test, k1 k2 k3)
        type: choice
        options: [auto, probe]
        default: auto
      req:
        description: probe only, widths to test (comma list of 1 to 3)
        type: string
        default: '1,2,3'

permissions:
  contents: read

jobs:
  # Guard (Lean Fw.Ci.Intent + Fw.Ci.Trigger, scripts/ci-paths.mjs). On a ci/* push it, and so every job, is skipped unless
  # the head commit asks for this lane (`[ci:<lane>]`; the default lane lean always); then it runs the workflow only if
  # the commit is the branch tip, is not on main yet, and (lean: always) some file that differs from main on the whole
  # branch is an input. A main push starts no run; dispatches always run. Fails open.
  # Every other job re-checks the tip first (`stale:` fails it) and has its own group, never cancelled on ci/*.
  guard:
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/ci/') || contains(github.event.head_commit.message, '[ci:wktr-fixtures]') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - id: g
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          GUARD_TOKEN: ${{ github.token }}
        run: node .github/scripts/changed-inputs.mjs --workflow .github/workflows/wktr-fixtures.yml
      - name: 'decision: run'
        if: steps.g.outputs.run == 'true'
        run: 'true'
      - name: 'decision: skip: ${{ steps.g.outputs.reason }}'
        if: steps.g.outputs.run != 'true'
        run: 'true'

  plan:
    needs: [guard]
    if: ${{ needs.guard.outputs.run == 'true' }}
    concurrency:
      group: ci-lane:wktr-fixtures:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:plan:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      maxp: ${{ steps.m.outputs.maxp }}
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: packages/contracts/golden/measure
      - id: m
        env:
          JOBS: ${{ inputs.jobs || '3' }}
          REQ: ${{ inputs.req || '1,2,3' }}
        run: |
          set -euo pipefail
          case "$JOBS" in 1|2|3|4) ;; *) echo "jobs must be 1..4" >&2; exit 1 ;; esac
          case "$REQ" in *[!1-3,]*|'') echo "req must be a comma list of 1..3" >&2; exit 1 ;; esac
          matrix=$(seq 1 "$JOBS" | jq -R -s -c '{job: (split("\n") | map(select(length > 0)) | map("j" + .))}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          # max-parallel of the fixture job: Lean's (Fw.Measure.WktrLayout.maxParallel, golden kind maxParallel)
          maxp=$(jq -s -r --argjson n "$JOBS" '[.[] | select(.kind == "maxParallel" and .jobs == $n)] | .[0].maxParallel' packages/contracts/golden/measure/wktr.fixtures.jsonl)
          case "$maxp" in 1|2|3|4|5) ;; *) echo "no maxParallel line for $JOBS jobs" >&2; exit 1 ;; esac
          echo "maxp=$maxp" >> "$GITHUB_OUTPUT"
          echo "jobs $JOBS, max-parallel $maxp"

  fixtures:
    needs: [plan]
    concurrency:
      group: ci-lane:wktr-fixtures:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:fixtures:${{ strategy.job-index }}
    runs-on: macos-26
    timeout-minutes: 21
    strategy:
      max-parallel: ${{ fromJSON(needs.plan.outputs.maxp) }}
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: ${{ runner.temp }}/wktr-zip
          key: wktr-ios-min-324039-${{ hashFiles('packages/measure-wktr/src/archive.json') }}
      - name: Archive, extracted into an empty directory (size and sha256 verified)
        run: sh packages/measure-wktr/scripts/fetch-archive.sh "$RUNNER_TEMP/wktr-zip" "$RUNNER_TEMP/wktr-root"
      - name: Select Xcode 26.5 and show the tools
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode_26.5*.app
          sudo xcode-select -s /Applications/Xcode_26.5.app
          mkdir -p "$RUNNER_TEMP/result"
          sh .github/scripts/runner-info.sh "$RUNNER_TEMP/result/runner.json"
          {
            sw_vers
            xcodebuild -version
            xcrun simctl list runtimes
          } | tee "$RUNNER_TEMP/result/tools.txt"
      - name: WKTR fixtures, fresh process per pass and cell
        env:
          PASSES: ${{ inputs.passes || '3' }}
          MODE: ${{ inputs.mode || 'auto' }}
          REQ: ${{ inputs.req || '1,2,3' }}
        run: |
          set -euo pipefail
          sh packages/measure-wktr/fixtures/run.sh "$RUNNER_TEMP/wktr-root" "$RUNNER_TEMP/result" "$PASSES" "$MODE" "$REQ" 2>&1 | tee "$RUNNER_TEMP/result/run.log"
          node packages/measure-wktr/fixtures/summarize.mjs "$RUNNER_TEMP/result" | tee "$RUNNER_TEMP/result/summary.md"
          node packages/measure-wktr/fixtures/summarize.mjs "$RUNNER_TEMP/result" --json > "$RUNNER_TEMP/result/summary.json"
          ls -l "$RUNNER_TEMP/result"
      - name: Delete the Simulator devices
        if: ${{ (always()) && steps.stale.outcome == 'skipped' }}
        run: |
          node packages/measure-wktr/fixtures/lanes.mjs cleanup || true
          xcrun simctl shutdown all || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ (always()) && steps.stale.outcome == 'skipped' }}
        with:
          name: wktr-fix-${{ matrix.job }}
          path: ${{ runner.temp }}/result
          if-no-files-found: error
          retention-days: 30

  fwcore:
    needs: [guard]
    if: ${{ needs.guard.outputs.run == 'true' }}
    concurrency:
      group: ci-lane:wktr-fixtures:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:fwcore:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lean
      - name: lake build fwcore
        working-directory: lean
        run: lake build fwcore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wktr-fix-fwcore
          path: lean/.lake/build/bin/fwcore
          if-no-files-found: error
          retention-days: 1

  # Classes per arm and variant over every pass of every job (kMax 4, tMax 24), and the summary table of every pass.
  classes:
    needs: [fixtures, fwcore]
    if: ${{ always() && needs.fixtures.result != 'cancelled' && needs.fwcore.result == 'success' }}
    concurrency:
      group: ci-lane:wktr-fixtures:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:classes:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wktr-fix-fwcore
          path: ${{ runner.temp }}/fwcore
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wktr-fix-j*
          path: ${{ runner.temp }}/runs
      - name: Classes and summary
        env:
          FW_CORE_BIN: ${{ runner.temp }}/fwcore/fwcore
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          chmod +x "$FW_CORE_BIN"
          out="$RUNNER_TEMP/classes"
          mkdir -p "$out"
          cd "$RUNNER_TEMP/runs"
          if ! ls -d wktr-fix-j* > /dev/null 2>&1; then mkdir wktr-fix-j1; find . -maxdepth 1 -mindepth 1 ! -name wktr-fix-j1 -exec mv {} wktr-fix-j1/ \;; fi
          echo "workflow run $RUN_ID, sha $SHA" > "$out/run.txt"
          node "$GITHUB_WORKSPACE/packages/measure-wktr/fixtures/summarize.mjs" wktr-fix-j* | tee "$out/summary.md"
          node "$GITHUB_WORKSPACE/packages/measure-wktr/fixtures/summarize.mjs" wktr-fix-j* --json > "$out/summary.json"
          { echo '### per pass'; cat "$out/summary.md"; } >> "$GITHUB_STEP_SUMMARY"
          # the assertions (Lean: Fw.Measure.WktrLayout.expects) and, for probe runs, the premise table; fails when an assertion
          # fails in the serial tag k1 or in auto
          set +e
          node "$GITHUB_WORKSPACE/packages/measure-wktr/fixtures/premise.mjs" wktr-fix-j* --out "$out" > "$out/premise.md" 2> "$out/premise.err"
          rc=$?
          set -e
          cat "$out/premise.err" || true
          { echo '### premise and assertions'; cat "$out/premise.md"; } >> "$GITHUB_STEP_SUMMARY"
          # lane premise wktr_scroll_timeline_restyle (Lean: Fw.Ops.Premise.laneFailures): fails when the measured recalcs per
          # update differ from wktr-lane.jsonl; only the serial tag k1 and the production tag auto are asserted
          node "$GITHUB_WORKSPACE/packages/measure-wktr/fixtures/summarize.mjs" wktr-fix-j* --assert | tee -a "$GITHUB_STEP_SUMMARY" || rc=1
          exit $rc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ (always()) && steps.stale.outcome == 'skipped' }}
        with:
          name: wktr-fix-classes
          path: ${{ runner.temp }}/classes
          if-no-files-found: error
          retention-days: 30
