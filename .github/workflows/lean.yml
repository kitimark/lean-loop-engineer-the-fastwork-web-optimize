name: lean

# Proofs, golden vectors and the fwcore binary (PLAN 3.2, 5.4 TL0). Same commands as `lean/scripts/check.sh` locally.
on:
  # Inputs: the Lean project, the checked-in breakpoint table breakgen compares against, setup-lean, the runner-facts script.
  # A push runs this workflow only when it changes one of these paths; `workflow_dispatch` runs it on demand
  # (gh workflow run <name> --ref <branch>). Why: docs/team/handoffs/ci-trigger-scope.md.
  push:
    branches: ['ci/**', main]
    paths:
      - 'lean/**'
      - 'apps/site/src/breakpoints.gen.json'
      - '.github/actions/setup-lean/**'
      - '.github/scripts/runner-info.sh'
      - '.github/workflows/lean.yml'
  workflow_dispatch:

# Public repo: read-only token, no secrets anywhere, no pull_request(_target) trigger.
permissions:
  contents: read

# A newer push to the same ci/** branch cancels the older run of this workflow; main never cancels (a run there is a record).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/ci/') }}

jobs:
  lean:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-lean

      - name: lake build
        working-directory: lean
        run: lake build

      # check-partial grep gates, lake build, lake test (golden round trips), math-view lint, the real fwcore binary on
      # golden/wire-requests.txt, breakgen --check.
      - name: lean/scripts/check.sh
        run: sh lean/scripts/check.sh

      - name: Runner facts
        run: sh .github/scripts/runner-info.sh lean-runner.json

      - name: fwcore binary
        run: sha256sum lean/.lake/build/bin/fwcore | tee fwcore.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fwcore-linux-arm64
          path: |
            lean/.lake/build/bin/fwcore
            fwcore.sha256
            lean-runner.json
          if-no-files-found: error
          retention-days: 14
