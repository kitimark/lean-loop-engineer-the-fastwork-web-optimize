name: lean

# Proofs, golden vectors and the fwcore binary (PLAN 3.2, 5.4 TL0). Same commands as `lean/scripts/check.sh` locally.
on:
  # Inputs: the Lean project, the checked-in breakpoint table breakgen compares against, setup-lean, the runner-facts script.
  # A push runs this workflow only when it changes one of these paths; `workflow_dispatch` runs it on demand
  # (gh workflow run <name> --ref <branch>). Why: docs/team/handoffs/ci-trigger-scope.md.
  push:
    branches: ['ci/**', main]
    paths:
      - 'lean/**'
      - 'apps/site/src/breakpoints.gen.json'
      - '.github/scripts/changed-inputs.mjs'
      - '.github/actions/setup-lean/**'
      - '.github/scripts/runner-info.sh'
      - '.github/workflows/lean.yml'
  workflow_dispatch:

# Public repo: read-only token, no secrets anywhere, no pull_request(_target) trigger.
permissions:
  contents: read

# A newer push to the same ci/** branch cancels the older run of this workflow; main never cancels (a run there is a record).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/ci/') }}

jobs:
  # Paths guard (Lean Fw.Ci.Trigger, scripts/ci-paths.mjs): on a ci/* push, runs the workflow only if THIS push changed one of
  # its inputs (the paths list under `on.push`) to something other than main's content; main pushes, dispatches and
  # schedules always run. Fails open on error.
  guard:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: g
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: node .github/scripts/changed-inputs.mjs --workflow .github/workflows/lean.yml

  lean:
    needs: [guard]
    if: ${{ needs.guard.outputs.run == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # The one Lake cache writer (lean/Fw/Ops/LakeCache.lean `isWriter`): it builds every target, so its entry holds every
      # module the restore-only jobs need (Fw.Ops.LakeCache.table_complete).
      - uses: ./.github/actions/setup-lean
        with:
          save: 'true'

      - name: lake build
        working-directory: lean
        run: lake build

      # check-partial grep gates, lake build, lake test (golden round trips), math-view lint, the real fwcore binary on
      # golden/wire-requests.txt, breakgen --check.
      - name: lean/scripts/check.sh
        run: sh lean/scripts/check.sh

      - name: Runner facts
        run: sh .github/scripts/runner-info.sh lean-runner.json

      - name: fwcore binary
        run: sha256sum lean/.lake/build/bin/fwcore | tee fwcore.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fwcore-linux-arm64
          path: |
            lean/.lake/build/bin/fwcore
            fwcore.sha256
            lean-runner.json
          if-no-files-found: error
          retention-days: 14

  # Module cache differential (task mathview-module-cache, premise tests of Fw.Console.LandSpeed.lint_modular): the
  # cached lint (lean/MathViewMain.lean `cachedEntries`) must give the same exit code, lint text and export (minus
  # `heartbeats`) as the full lint, on the tree as pushed and after three mutations, and must recompute exactly the
  # modules whose key changed. `mathview-cached.sh --diff` runs both and compares.
  mathview-differential:
    needs: [guard]
    if: ${{ needs.guard.outputs.run == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    # the runner context is not available at job level: steps use $RUNNER_TEMP/mathview-{store,diff}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-lean

      - name: lake build
        working-directory: lean
        run: lake build

      - name: current tree, empty store then full store
        working-directory: lean
        run: |
          sh scripts/mathview-cached.sh --diff "$RUNNER_TEMP/mathview-store" "$RUNNER_TEMP/mathview-diff/cold"
          sh scripts/mathview-cached.sh --diff "$RUNNER_TEMP/mathview-store" "$RUNNER_TEMP/mathview-diff/warm"
          grep -qx 'misses 0' "$RUNNER_TEMP/mathview-diff/warm/cached.stats"

      # a docstring edit in one module recomputes exactly the modules whose import cone contains it: the `miss` lines
      # equal `mathview --dependents` (Fw.Spec.ConeMiss.dependents, exact by mem_dependents; a hard-coded `misses 2`
      # broke once Fw.Ci.Trigger and Fw.Console.LandPool imported LandSpeed)
      - name: mutation 1, one-module edit
        working-directory: lean
        run: |
          sed -i 's/the verdict is a conjunction over modules\./the verdict is a conjunction over all modules./' Fw/Console/LandSpeed.lean
          git diff --quiet -- Fw/Console/LandSpeed.lean && { echo "mutation 1 did not apply"; exit 1; }
          lake build
          d="$RUNNER_TEMP/mathview-diff/m1"
          sh scripts/mathview-cached.sh --diff "$RUNNER_TEMP/mathview-store" "$d"
          .lake/build/bin/mathview --dependents Fw.Console.LandSpeed | sort > "$d/expected.miss"
          sed -n 's/^miss //p' "$d/cached.stats" | sort > "$d/actual.miss"
          diff "$d/expected.miss" "$d/actual.miss"
          grep -qx 'miss Fw.Console.LandSpeed' "$d/cached.stats"

      # Fw/Spec/AxReach.lean is outside the cone of Fw.Console.LandSpeed but the axiom rule runs its code: a semantic
      # change there must recompute every module, LandSpeed included (it enters every key through the tool hash)
      - name: mutation 2, tool code outside the cone
        working-directory: lean
        run: |
          cat >> Fw/Spec/AxReach.lean <<'EOF'

          /-- Mutation probe. $$p = 1$$ -/
          def mathviewMutationProbe : Nat := 1
          EOF
          lake build
          sh scripts/mathview-cached.sh --diff "$RUNNER_TEMP/mathview-store" "$RUNNER_TEMP/mathview-diff/m2"
          grep -qx 'miss Fw.Console.LandSpeed' "$RUNNER_TEMP/mathview-diff/m2/cached.stats"
          grep -qx 'hits 0' "$RUNNER_TEMP/mathview-diff/m2/cached.stats"

      # findDocString? would append this suffix to LandSpeed.lintAll's docstring from a module outside its cone; the
      # export reads the declaring module's docstring only (MathView.entries), so LandSpeed stays a hit and full = cached
      - name: mutation 3, recommended_spelling outside the cone
        working-directory: lean
        run: |
          printf '\nrecommended_spelling "zz" for "zz" in [Fw.Console.LandSpeed.lintAll]\n' >> Fw.lean
          lake build
          d="$RUNNER_TEMP/mathview-diff/m3"
          sh scripts/mathview-cached.sh --diff "$RUNNER_TEMP/mathview-store" "$d"
          .lake/build/bin/mathview --dependents Fw | sort > "$d/expected.miss"
          sed -n 's/^miss //p' "$d/cached.stats" | sort > "$d/actual.miss"
          diff "$d/expected.miss" "$d/actual.miss"
          grep -qx 'misses 1' "$d/cached.stats"
          ! grep -q 'Conventions for notations' "$RUNNER_TEMP/mathview-diff/m3/full.json"

      - name: keep the outputs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mathview-differential
          path: ${{ runner.temp }}/mathview-diff
          retention-days: 7
