name: lean

# Proofs, golden vectors and the fwcore binary (PLAN 3.2, 5.4 TL0). Same commands as `lean/scripts/check.sh` locally.
on:
  # Inputs: the Lean project, the checked-in breakpoint table breakgen compares against, setup-lean, the runner-facts script.
  # Every push creates a run and its guard job decides on these inputs (Lean Fw.Ci.Intent); `workflow_dispatch` runs it on demand
  # (gh workflow run <name> --ref <branch>). Why: docs/team/handoffs/ci-trigger-scope.md.
  push:
    branches: ['ci/**', main]
  workflow_dispatch:

# Public repo: read-only token, no secrets anywhere, no pull_request(_target) trigger.
permissions:
  contents: read

jobs:
  # Guard (Lean Fw.Ci.Intent + Fw.Ci.Trigger, scripts/ci-paths.mjs). On a ci/* push it, and so every job, is skipped unless
  # the head commit asks for this lane (`[ci:<lane>]`; the default lane lean always); then it runs the workflow only if
  # the commit is the branch tip, is not on main yet, and (lean: always) some file that differs from main on the whole
  # branch is an input. A main push runs when its own diff passes the coarse paths, and then only the cache seeders
  # (Lean Fw.Ci.Trigger.seeders); dispatches always run. Fails open.
  # Every other job re-checks the tip first (`stale:` fails it) and has its own group, never cancelled on ci/*.
  guard:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - id: g
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          GUARD_TOKEN: ${{ github.token }}
        run: node .github/scripts/changed-inputs.mjs --workflow .github/workflows/lean.yml
      - name: 'decision: run'
        if: steps.g.outputs.run == 'true'
        run: 'true'
      - name: 'decision: skip: ${{ steps.g.outputs.reason }}'
        if: steps.g.outputs.run != 'true'
        run: 'true'

  lean:
    needs: [guard]
    if: ${{ needs.guard.outputs.run == 'true' }}
    concurrency:
      group: ci-lane:lean:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:lean:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/telemetry
        with:
          mode: start
          label: lean

      # The one Lake cache writer (lean/Fw/Ops/LakeCache.lean `isWriter`): it builds every target, so its entry holds every
      # module the restore-only jobs need (Fw.Ops.LakeCache.table_complete).
      - uses: ./.github/actions/setup-lean
        with:
          save: 'true'
      - uses: ./.github/actions/telemetry
        with:
          mode: cache
          cache-dirs: lake=${{ github.workspace }}/.lake-cache

      - name: lake build
        working-directory: lean
        run: lake build

      # check-partial grep gates, lake build, lake test (golden round trips), axiom check, the real fwcore binary on
      # golden/wire-requests.txt, breakgen --check.
      - name: scripts/lake-slot.sh tests (the Linux flock branch)
        run: node --test scripts/lake-slot.test.mjs

      - name: scripts/heavy-lock.mjs and scripts/fwcore-build.sh tests (the TS stand-ins against the Lean goldens, the build record)
        run: node --test scripts/heavy-lock.test.mjs scripts/fwcore-build.test.mjs scripts/build-review.test.mjs scripts/lint-tmpdirs.test.mjs

      - name: lean/scripts/check.sh
        env:
          # check.sh's own spans (scripts/span.sh) land in the telemetry record as steps (task ci-telemetry)
          FW_TIMINGS_FILE: ${{ runner.temp }}/fw-telemetry/spans.jsonl
        run: sh lean/scripts/check.sh

      # Start cost per spawned fwcore call (task fwcore-lazy-tables): 50 calls with one cheap wire request each.
      - name: fwcore start timing
        if: ${{ (!cancelled()) && steps.stale.outcome == 'skipped' }}
        run: sh lean/scripts/start-timing.sh lean/.lake/build/bin/fwcore 50 > fwcore-start.json && cat fwcore-start.json

      - name: Runner facts
        run: sh .github/scripts/runner-info.sh lean-runner.json

      - name: fwcore binary
        run: sha256sum lean/.lake/build/bin/fwcore | tee fwcore.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fwcore-linux-arm64
          path: |
            lean/.lake/build/bin/fwcore
            fwcore.sha256
            lean-runner.json
            fwcore-start.json
          if-no-files-found: error
          retention-days: 14
      - uses: ./.github/actions/telemetry
        if: ${{ (always()) && steps.stale.outcome == 'skipped' }}
        with:
          mode: finish
          label: lean
