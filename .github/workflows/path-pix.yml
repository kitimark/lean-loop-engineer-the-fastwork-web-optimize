name: path-pix

on:
  push:
    branches: ['ci/**']

permissions:
  contents: read

jobs:
  # Guard (Lean Fw.Ci.Intent + Fw.Ci.Trigger, scripts/ci-paths.mjs). On a ci/* push it, and so every job, is skipped unless
  # the head commit asks for this lane (`[ci:<lane>]`; the default lane lean always); then it runs the workflow only if
  # the commit is the branch tip, is not on main yet, and (lean: always) some file that differs from main on the whole
  # branch is an input. A main push starts no run; dispatches always run. Fails open.
  # Every other job re-checks the tip first (`stale:` fails it) and has its own group, never cancelled on ci/*.
  guard:
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/ci/') || contains(github.event.head_commit.message, '[ci:path-pix]') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - id: g
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          GUARD_TOKEN: ${{ github.token }}
        run: node .github/scripts/changed-inputs.mjs --workflow .github/workflows/path-pix.yml
      - name: 'decision: run'
        if: steps.g.outputs.run == 'true'
        run: 'true'
      - name: 'decision: skip: ${{ steps.g.outputs.reason }}'
        if: steps.g.outputs.run != 'true'
        run: 'true'

  site:
    needs: [guard]
    if: ${{ needs.guard.outputs.run == 'true' }}
    concurrency:
      group: ci-lane:path-pix:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:site:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@fw/site...'
      - uses: ./.github/actions/telemetry
        with:
          mode: start
          label: site
      - uses: ./.github/actions/setup-lean
      - uses: ./.github/actions/telemetry
        with:
          mode: cache
          cache-dirs: lake=${{ github.workspace }}/.lake-cache
      - name: Build the rewrite (default config; every single flag has its own prerendered page)
        run: pnpm --filter @fw/site build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: apps/site/dist/aot
          if-no-files-found: error
          retention-days: 3
      - uses: ./.github/actions/telemetry
        if: ${{ (always()) && steps.stale.outcome == 'skipped' }}
        with:
          mode: finish
          label: site

  sim:
    needs: [guard, site]
    if: ${{ needs.guard.outputs.run == 'true' }}
    concurrency:
      group: ci-lane:path-pix:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:sim:${{ strategy.job-index }}
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        vm: [1, 2]
    env:
      FW_IOS_VERSION: '27.0'
      FW_IOS_BUILD: 24A434
      FW_SIM_NAME: fw-iphone-27
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Pinned iOS runtime build, then create the device
        run: sh .github/scripts/check-simulator.sh --create

      - uses: ./.github/actions/telemetry
        with:
          mode: start
          label: sim-${{ matrix.vm }}

      - name: Tool (ios_webkit_debug_proxy)
        shell: bash
        run: |
          set -euo pipefail
          brew install ios-webkit-debug-proxy
          command -v ios_webkit_debug_proxy

      - name: The rewrite build (site job)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: ${{ runner.temp }}/site

      - name: Tool and runner facts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/result"
          sh .github/scripts/runner-info.sh "$RUNNER_TEMP/result/runner.json"
          {
            sw_vers || true
            xcodebuild -version || true
            xcrun simctl list runtimes || true
            brew list --versions ios-webkit-debug-proxy || true
          } | tee "$RUNNER_TEMP/result/tools.txt"

      - name: Boot the Simulator (kept booted for the whole job)
        run: |
          set -euo pipefail
          xcrun simctl shutdown all || true
          udid=$(cat "$RUNNER_TEMP/fw-sim-udid.txt")
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b

      - name: Path-pix capture (all arms, all offsets)
        timeout-minutes: 45
        env:
          SITE_DIR: ${{ runner.temp }}/site
          VM: ${{ matrix.vm }}
          FW_WK_TIMEOUT_SCALE: '8'
          FW_WK_ATTEMPTS: '3'
          FW_WK_STALL_MS: '300000'
          P_LAYERS: ${{ matrix.vm == 1 && 'hero.cue_cue,hero.deck_article,nav_bar' || 'hero.countdown_face,hero_copy,nav_earn' }}
        working-directory: packages/measure-webkit
        run: |
          set -euo pipefail
          node --test test/pathpix.test.mjs test/pathpix-lane.test.mjs
          mkdir -p out
          node src/pathpix-cli.mjs --site "$SITE_DIR" --out "out/$VM-path-pix-webkit" --run "$GITHUB_RUN_ID" --p-layers "$P_LAYERS" --deadline-min 34 2> >(tee "out/$VM-path-pix.log" >&2)
          ls -l out

      - name: Keep logs
        if: ${{ (!cancelled()) && steps.stale.outcome == 'skipped' }}
        working-directory: packages/measure-webkit
        env:
          VM: ${{ matrix.vm }}
        run: |
          mkdir -p out "$RUNNER_TEMP/result"
          cp out/"$VM"-path-pix.log "$RUNNER_TEMP/result/" 2>/dev/null || true
          d=out/"$VM"-path-pix-webkit
          if [ -d "$d" ]; then
            mkdir -p "$RUNNER_TEMP/result/$VM-path-pix-webkit"
            cp -R "$d/manifest.json" "$d/cells.json" "$d/summary.md" "$d/strips" "$RUNNER_TEMP/result/$VM-path-pix-webkit/" 2>/dev/null || true
          fi

      - name: Host state on failure
        if: ${{ failure() && steps.stale.outcome == 'skipped' }}
        continue-on-error: true
        env:
          VM: ${{ matrix.vm }}
        run: |
          bounded() { perl -e 'alarm 20; exec @ARGV' -- "$@"; }
          # shellcheck disable=SC2009
          { uptime; bounded xcrun simctl list devices booted; ps -axo pid,pcpu,rss,comm | sort -k2 -nr | head -15; ps -axo pid,ppid,etime,stat,command | grep -E "cli.mjs|ios_webkit|xcodebuild" | grep -v grep; } > "$RUNNER_TEMP/result/$VM-host.txt" 2>&1 || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ (!cancelled()) && steps.stale.outcome == 'skipped' }}
        with:
          name: path-pix-webkit-${{ matrix.vm }}
          path: ${{ runner.temp }}/result
          if-no-files-found: error
          retention-days: 30
      - uses: ./.github/actions/telemetry
        if: ${{ (always()) && steps.stale.outcome == 'skipped' }}
        with:
          mode: finish
          label: sim-${{ matrix.vm }}

  chromium:
    needs: [guard, site]
    if: ${{ needs.guard.outputs.run == 'true' }}
    concurrency:
      group: ci-lane:path-pix:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:chromium:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2]
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/telemetry
        with:
          mode: start
          label: chromium-${{ matrix.run }}
      - name: The rewrite build (site job)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: ${{ runner.temp }}/site
      - name: Build the Chromium image
        run: |
          set -euo pipefail
          docker build -t fw-measure-chromium:1 packages/measure-chromium
          docker image inspect --format 'image id: {{.Id}}' fw-measure-chromium:1
          docker run --rm --entrypoint sh -v "$PWD/packages/measure-chromium/src:/driver:ro" fw-measure-chromium:1 /driver/image-check.sh
      - name: Runner facts
        run: |
          mkdir -p "$RUNNER_TEMP/result"
          sh .github/scripts/runner-info.sh "$RUNNER_TEMP/result/runner.json"
      - name: Path-pix capture (all arms, all offsets)
        timeout-minutes: 40
        env:
          SITE_DIR: ${{ runner.temp }}/site
        run: |
          set -euo pipefail
          node --test packages/measure-webkit/test/pathpix.test.mjs packages/measure-webkit/test/pathpix-lane.test.mjs
          node packages/measure-chromium/src/pathpix-host.mjs --site "$SITE_DIR" --out "$RUNNER_TEMP/pp-chromium" --run "$GITHUB_RUN_ID"
      - name: Collect the result
        if: ${{ (!cancelled()) && steps.stale.outcome == 'skipped' }}
        env:
          RUN: ${{ matrix.run }}
        run: |
          mkdir -p "$RUNNER_TEMP/result/$RUN-path-pix-chromium"
          d="$RUNNER_TEMP/pp-chromium"
          cp -R "$d/error.json" "$d/manifest.json" "$d/cells.json" "$d/summary.md" "$d/strips" "$RUNNER_TEMP/result/$RUN-path-pix-chromium/" 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ (!cancelled()) && steps.stale.outcome == 'skipped' }}
        with:
          name: path-pix-chromium-${{ matrix.run }}
          path: ${{ runner.temp }}/result
          if-no-files-found: error
          retention-days: 30
      - uses: ./.github/actions/telemetry
        if: ${{ (always()) && steps.stale.outcome == 'skipped' }}
        with:
          mode: finish
          label: chromium-${{ matrix.run }}

  report:
    needs: [guard, sim, chromium]
    if: ${{ !cancelled() && needs.guard.outputs.run == 'true' && (needs.sim.result != 'skipped' || needs.chromium.result != 'skipped') }}
    concurrency:
      group: ci-lane:path-pix:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:report:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: path-pix-*
          path: ${{ runner.temp }}/jobs
      - name: Summaries
        env:
          JOBS: ${{ runner.temp }}/jobs
        run: |
          set -euo pipefail
          for f in "$JOBS"/*/*/summary.md; do
            [ -f "$f" ] || continue
            printf '\n### %s\n\n' "${f#"$JOBS"/}" >> "$GITHUB_STEP_SUMMARY"
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
          done
