name: toolbar-throttle

# The toolbar-throttle probe (task toolbar-throttle-probe): does WebKit's 100 ms throttle of visible-rect updates while Safari's toolbar
# collapses (WKWebViewIOS.mm:3256-3268@862f17d) cause the still runs of the hero exit? Real touches (an XCUITest driver swipes Mobile Safari
# in the iOS Simulator; no synthetic WheelEvent) while the page records every frame; three arms, rotated per round: the default rewrite,
# the rewrite with the diagnostic flag ?fw=engine.scroll:throttle-lift (one main-thread scroll-driven animation, which lifts the throttle),
# and the original snapshot as the reference. The counts and the verdict are Lean's (lean/Fw/Device/StillRuns.lean, golden
# packages/contracts/golden/device/stillruns.jsonl, twin packages/measure-webkit/src/throttle/stillruns.mjs). Counts only: nothing measured
# here is phone time, and the Simulator's toolbar may behave unlike the phone's.
# A commit message with [throttle:finish] runs the finish drags instead (task sim-finish-throttle): the page is scrolled to 300 px above its
# end and real drags past the end open the morph panel; the counts are Lean's lean/Fw/Device/FinishRuns.lean, twin throttle/finish.mjs.
# Each VM is its own job (an independent sample) and uploads `toolbar-throttle-<vm>`; the report job builds the table from them.
on:
  push:
    branches: ['ci/**']

permissions:
  contents: read

jobs:
  # Guard (Lean Fw.Ci.Intent + Fw.Ci.Trigger, scripts/ci-paths.mjs). On a ci/* push it, and so every job, is skipped unless
  # the head commit asks for this lane (`[ci:<lane>]`; the default lane lean always); then it runs the workflow only if
  # the commit is the branch tip, is not on main yet, and (lean: always) some file that differs from main on the whole
  # branch is an input. A main push starts no run; dispatches always run. Fails open.
  # Every other job re-checks the tip first (`stale:` fails it) and has its own group, never cancelled on ci/*.
  guard:
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/ci/') || contains(github.event.head_commit.message, '[ci:toolbar-throttle]') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - id: g
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          GUARD_TOKEN: ${{ github.token }}
        run: node .github/scripts/changed-inputs.mjs --workflow .github/workflows/toolbar-throttle.yml
      - name: 'decision: run'
        if: steps.g.outputs.run == 'true'
        run: 'true'
      - name: 'decision: skip: ${{ steps.g.outputs.reason }}'
        if: steps.g.outputs.run != 'true'
        run: 'true'

  # The rewrite, built once. The default page and the page with the flag are both prerendered (every single flag is).
  site:
    needs: [guard]
    if: ${{ needs.guard.outputs.run == 'true' }}
    concurrency:
      group: ci-lane:toolbar-throttle:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:site:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@fw/site...'
      - uses: ./.github/actions/telemetry
        with:
          mode: start
          label: site
      - uses: ./.github/actions/setup-lean
      - uses: ./.github/actions/telemetry
        with:
          mode: cache
          cache-dirs: lake=${{ github.workspace }}/.lake-cache
      - name: Build the rewrite (default config; every single flag has its own prerendered page)
        run: pnpm --filter @fw/site build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: apps/site/dist/aot
          if-no-files-found: error
          retention-days: 3
      - uses: ./.github/actions/telemetry
        if: ${{ (always()) && steps.stale.outcome == 'skipped' }}
        with:
          mode: finish
          label: site

  sim:
    needs: [guard, site]
    if: ${{ needs.guard.outputs.run == 'true' }}
    concurrency:
      group: ci-lane:toolbar-throttle:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:sim:${{ strategy.job-index }}
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        vm: [1, 2, 3]
    env:
      FW_IOS_VERSION: '27.0'
      FW_IOS_BUILD: 24A434
      FW_SIM_NAME: fw-iphone-27
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      # Fail fast: the pin check is the first step after the checkout, before brew or anything that costs minutes.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Pinned iOS runtime build, then create the device
        run: sh .github/scripts/check-simulator.sh --create

      - name: Verify the snapshot against snapshot.lock.json
        run: node .github/scripts/verify-snapshot.mjs

      - uses: ./.github/actions/telemetry
        with:
          mode: start
          label: sim-${{ matrix.vm }}

      # Inspector bridge to the Simulator's webinspectord socket, and xcodegen for the touch driver's project. Neither is pinned by brew
      # (formula version = the tap's); the versions are recorded in the artifact.
      - name: Tools (ios_webkit_debug_proxy, xcodegen)
        shell: bash
        run: |
          set -euo pipefail
          brew install ios-webkit-debug-proxy xcodegen
          command -v ios_webkit_debug_proxy xcodegen

      - name: The rewrite build (site job)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: ${{ runner.temp }}/site

      - name: Tool and runner facts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/result"
          sh .github/scripts/runner-info.sh "$RUNNER_TEMP/result/runner.json"
          {
            sw_vers
            xcodebuild -version
            xcrun simctl list runtimes
            brew list --versions ios-webkit-debug-proxy xcodegen
          } | tee "$RUNNER_TEMP/result/tools.txt"

      # The touch driver is built before the Simulator boots: built next to a booted Simulator on this 3-vCPU runner it starved
      # Safari (no tab for minutes, load average in the hundreds), so the probe only runs the finished bundle.
      - name: Build the touch driver (no Simulator booted)
        working-directory: packages/measure-webkit
        run: |
          set -euo pipefail
          node src/throttle/cli.mjs build-driver --dir "$RUNNER_TEMP/touch-driver"
          uptime

      # Boot once and keep it booted; bootDevice() is idempotent and the probe passes --keep.
      - name: Boot the Simulator (kept booted for the whole job)
        run: |
          set -euo pipefail
          xcrun simctl shutdown all || true
          udid=$(cat "$RUNNER_TEMP/fw-sim-udid.txt")
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b

      - name: Touch probe (three arms, rotated per round)
        timeout-minutes: 45
        env:
          FW_SNAPSHOT_SITE: ${{ github.workspace }}/snapshot/site
          SITE_DIR: ${{ runner.temp }}/site
          VM: ${{ matrix.vm }}
          # The head commit message picks the drags: [throttle:finish] drags past the page end (task sim-finish-throttle), else the hero exit.
          MODE: ${{ contains(github.event.head_commit.message, '[throttle:finish]') && 'finish' || 'drags' }}
          # The runner (3 vCPU) boots Safari several times slower than a Mac: every wait in packages/measure-webkit is multiplied by this
          # (counts do not depend on waits), and a load step may retry twice after a reconnect.
          FW_WK_TIMEOUT_SCALE: '8'
          FW_WK_ATTEMPTS: '3'
          FW_WK_STALL_MS: '300000'
        working-directory: packages/measure-webkit
        run: |
          set -euo pipefail
          mkdir -p out
          node src/throttle/cli.mjs run --driver "$RUNNER_TEMP/touch-driver" --site "$SITE_DIR" --arms rewrite,lift,original --rounds 2 --cycles 4 --mode "$MODE" --vm "$VM" --keep --out "out/$VM-throttle.json" 2> >(tee "out/$VM-throttle.log" >&2)
          ls -l out

      # Steps after the measurement step are the Lean allowlist (Fw.Ci.Steps, scripts/ci-steps-lint.mjs). The VM is discarded
      # after the job, so the Simulator is neither shut down nor deleted. Kept when a session failed; no step has a timeout.
      - name: Keep logs
        if: ${{ (!cancelled()) && steps.stale.outcome == 'skipped' }}
        working-directory: packages/measure-webkit
        env:
          VM: ${{ matrix.vm }}
        run: |
          mkdir -p out "$RUNNER_TEMP/result"
          cp out/"$VM"-* "$RUNNER_TEMP/result/" 2>/dev/null || true

      # Host state, only after a failure: where a slow start stalled. Each Simulator command is bounded by an alarm.
      - name: Host state on failure
        if: ${{ failure() && steps.stale.outcome == 'skipped' }}
        continue-on-error: true
        env:
          VM: ${{ matrix.vm }}
        run: |
          bounded() { perl -e 'alarm 20; exec @ARGV' -- "$@"; }
          # shellcheck disable=SC2009
          { uptime; bounded xcrun simctl list devices booted; ps -axo pid,pcpu,rss,comm | sort -k2 -nr | head -15; ps -axo pid,ppid,etime,stat,command | grep -E "cli.mjs|ios_webkit|xcodebuild" | grep -v grep; } > "$RUNNER_TEMP/result/$VM-host.txt" 2>&1 || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ (!cancelled()) && steps.stale.outcome == 'skipped' }}
        with:
          name: toolbar-throttle-${{ matrix.vm }}
          path: ${{ runner.temp }}/result
          if-no-files-found: error
          retention-days: 30
      - uses: ./.github/actions/telemetry
        if: ${{ (always()) && steps.stale.outcome == 'skipped' }}
        with:
          mode: finish
          label: sim-${{ matrix.vm }}

  # The still-run table over the jobs (node only; the counts and the verdict are the Lean twin).
  report:
    needs: [guard, sim]
    if: ${{ !cancelled() && needs.guard.outputs.run == 'true' && needs.sim.result != 'skipped' }}
    concurrency:
      group: ci-lane:toolbar-throttle:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:report:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: toolbar-throttle-*
          path: ${{ runner.temp }}/jobs
      - name: Table (the verdict is the Lean twin; the step summary is a convenience, the artifacts are the record)
        working-directory: packages/measure-webkit
        env:
          JOBS: ${{ runner.temp }}/jobs
        run: |
          set -euo pipefail
          node --test test/throttle-stillruns.test.mjs
          files=$(ls "$JOBS"/*/*-throttle.json | paste -sd, -)
          node src/throttle/cli.mjs report --in "$files" --md "$RUNNER_TEMP/table.md"
          cat "$RUNNER_TEMP/table.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolbar-throttle-table
          path: ${{ runner.temp }}/table.md
          if-no-files-found: error
          retention-days: 30
