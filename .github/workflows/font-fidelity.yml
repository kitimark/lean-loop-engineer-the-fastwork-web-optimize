name: font-fidelity

# Task counts-font-fidelity (note research/notes/2026/10-2x-counts-font-fidelity.md): which font set makes the Chromium lane lay the
# original page out like WebKit does? chromium: the lane image is built once and the original page is loaded in it at 430 x 932,
# 430 x 775 (the phone's Safari viewport) and 1280 x 800 under each candidate font set of the Lean table (Fw.Measure.Profile.fontSets,
# golden line "fontSets"), twice per set, the set's Debian packages fetched inside the image from its snapshot.debian.org mirror and
# mounted with a per-set fonts.conf; webkit-mac: the same page function in Playwright WebKit on a macOS runner (the reference layout);
# report: the comparison and Lean's pick (fontPick, through its TS twin). Free runners only. Nothing here is phone time.
on:
  push:
    branches: ['ci/**']

permissions:
  contents: read

jobs:
  # Guard (Lean Fw.Ci.Intent + Fw.Ci.Trigger, scripts/ci-paths.mjs). On a ci/* push it, and so every job, is skipped unless
  # the head commit asks for this lane (`[ci:<lane>]`; the default lane lean always); then it runs the workflow only if
  # the commit is the branch tip, is not on main yet, and (lean: always) some file that differs from main on the whole
  # branch is an input. A main push starts no run; dispatches always run. Fails open.
  # Every other job re-checks the tip first (`stale:` fails it) and has its own group, never cancelled on ci/*.
  guard:
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/ci/') || contains(github.event.head_commit.message, '[ci:font-fidelity]') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - id: g
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          GUARD_TOKEN: ${{ github.token }}
        run: node .github/scripts/changed-inputs.mjs --workflow .github/workflows/font-fidelity.yml
      - name: 'decision: run'
        if: steps.g.outputs.run == 'true'
        run: 'true'
      - name: 'decision: skip: ${{ steps.g.outputs.reason }}'
        if: steps.g.outputs.run != 'true'
        run: 'true'

  chromium:
    needs: [guard]
    if: ${{ needs.guard.outputs.run == 'true' }}
    concurrency:
      group: ci-lane:font-fidelity:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:chromium:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - name: Keep line endings (the page is measured byte for byte)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            packages/measure-chromium
            packages/contracts/golden/measure
            packages/contracts/golden/port
            scripts/port
            snapshot
            .github/scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Verify the snapshot against snapshot.lock.json
        continue-on-error: true
        run: node .github/scripts/verify-snapshot.mjs
      - name: Build the lane image (the one the counts lane builds)
        run: |
          set -euo pipefail
          docker build -t fw-measure-chromium:1 packages/measure-chromium
          echo "image id: $(docker image inspect --format '{{.Id}}' fw-measure-chromium:1)"
          docker run --rm --entrypoint sh -v "$PWD/packages/measure-chromium/src:/driver:ro" fw-measure-chromium:1 /driver/image-check.sh
      - name: Section rows (the port gate's table)
        run: node packages/measure-chromium/src/fidelity-rows.mjs "$RUNNER_TEMP/rows/rows.json"
      - name: Every candidate font set, two runs each
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/out/fidelity-chromium"
          mkdir -p "$out"
          node packages/measure-chromium/src/fidelity-host.mjs --site="$GITHUB_WORKSPACE/snapshot/site" --rows="$RUNNER_TEMP/rows/rows.json" \
            --out="$out" --work="$RUNNER_TEMP/fidelity-work" --reps=2 2>&1 | tee "$out/log.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ (!cancelled()) && steps.stale.outcome == 'skipped' }}
        with:
          name: fidelity-chromium
          path: out/fidelity-chromium
          if-no-files-found: error
          retention-days: 30

  webkit-mac:
    needs: [guard]
    if: ${{ needs.guard.outputs.run == 'true' }}
    concurrency:
      group: ci-lane:font-fidelity:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:webkit-mac:${{ strategy.job-index }}
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - name: Keep line endings (the page is measured byte for byte)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            packages/measure-chromium
            packages/contracts/golden/port
            scripts/port
            snapshot
            .github/scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Verify the snapshot against snapshot.lock.json
        continue-on-error: true
        run: node .github/scripts/verify-snapshot.mjs
      - name: Section rows (the port gate's table)
        run: node packages/measure-chromium/src/fidelity-rows.mjs "$RUNNER_TEMP/rows.json"
      - name: Stage the driver with playwright-core 1.64.1 and the WebKit build
        run: |
          set -euo pipefail
          fw="$RUNNER_TEMP/fw"
          mkdir -p "$fw"
          cp -R packages/measure-chromium/src "$fw/driver"
          cd "$fw"
          npm init -y > /dev/null
          npm install --no-audit --no-fund --ignore-scripts --save-exact playwright-core@1.64.1
          npx playwright-core install webkit
      - name: Playwright WebKit, two runs (the reference layout)
        run: |
          set -euo pipefail
          fw="$RUNNER_TEMP/fw"
          out="$GITHUB_WORKSPACE/out/fidelity-webkit-mac"
          mkdir -p "$out"
          sw_vers | tee "$out/os.txt"
          for v in webkit-mac webkit-mac-r2; do
            node "$fw/driver/fidelity-playwright.mjs" --root="$GITHUB_WORKSPACE/snapshot/site" --rows="$RUNNER_TEMP/rows.json" --out="$out" --variant="$v" 2>&1 | tee -a "$out/log.txt"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ (!cancelled()) && steps.stale.outcome == 'skipped' }}
        with:
          name: fidelity-webkit-mac
          path: out/fidelity-webkit-mac
          if-no-files-found: error
          retention-days: 30

  sim:
    needs: [guard]
    if: ${{ needs.guard.outputs.run == 'true' }}
    concurrency:
      group: ci-lane:font-fidelity:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:sim:${{ strategy.job-index }}
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      FW_IOS_VERSION: '27.0'
      FW_IOS_BUILD: 24A434
      FW_SIM_NAME: fw-iphone-27
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            packages/measure-chromium
            packages/measure-webkit
            packages/contracts
            scripts/port
            snapshot
            .github/scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Pinned iOS runtime build, then create the device
        run: sh .github/scripts/check-simulator.sh --create
      - name: Tool (ios_webkit_debug_proxy)
        shell: bash
        run: |
          set -euo pipefail
          brew install ios-webkit-debug-proxy
          command -v ios_webkit_debug_proxy
      - name: Section rows (the port gate's table)
        run: node packages/measure-chromium/src/fidelity-rows.mjs "$RUNNER_TEMP/rows.json"
      - name: Boot the Simulator (kept booted for the whole job)
        run: |
          set -euo pipefail
          xcrun simctl shutdown all || true
          udid=$(cat "$RUNNER_TEMP/fw-sim-udid.txt")
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
      - name: Safari in the Simulator, the same page function (two runs)
        timeout-minutes: 25
        shell: bash
        env:
          FW_SNAPSHOT_SITE: ${{ github.workspace }}/snapshot/site
          FW_WK_TIMEOUT_SCALE: '8'
          FW_WK_ATTEMPTS: '3'
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/out/fidelity-sim"
          mkdir -p "$out"
          sw_vers | tee "$out/os.txt"
          xcrun simctl list runtimes | tee -a "$out/os.txt" || true
          for v in sim sim-r2; do
            node packages/measure-chromium/src/fidelity-sim.mjs --rows="$RUNNER_TEMP/rows.json" --out="$out" --variant="$v" 2>&1 | tee -a "$out/log.txt"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ (!cancelled()) && steps.stale.outcome == 'skipped' }}
        with:
          name: fidelity-sim
          path: out/fidelity-sim
          if-no-files-found: error
          retention-days: 30

  report:
    needs: [chromium, webkit-mac, sim]
    if: ${{ !cancelled() && needs.chromium.result == 'success' && needs.webkit-mac.result == 'success' }}
    concurrency:
      group: ci-lane:font-fidelity:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:report:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            packages/measure-chromium
            packages/contracts/golden/measure
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fidelity-*
          path: ${{ runner.temp }}/fidelity
      - name: Compare and pick (Lean fontPick through its TS twin)
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/fidelity"
          node packages/measure-chromium/src/fidelity-compare.mjs --dir="$d" --ref=webkit-mac --phone-doc=6042 --out="$d" > /dev/null
          cat "$d/fidelity-summary.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$d/fidelity-choice.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fidelity-report
          path: |
            ${{ runner.temp }}/fidelity/fidelity-summary.md
            ${{ runner.temp }}/fidelity/fidelity-choice.json
          if-no-files-found: error
          retention-days: 30
