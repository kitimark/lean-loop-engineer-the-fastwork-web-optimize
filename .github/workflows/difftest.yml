name: difftest

# Randomized differential tests (docs/team/tools/difftest.md): every TS function that mirrors a fwcore wire op runs on
# fast-check inputs next to the real fwcore binary; outputs must be equal. Free Linux runners only, no secrets.
#   fwcore    `lake build fwcore`, passed to the test jobs by artifact (same pattern as chromium-counts.yml).
#   fixed     fixed seed 20261018, DIFFTEST_RUNS=2000 per op: reproducible; a failure here blocks.
#   rotating  seed = run id (reported in the job summary), DIFFTEST_RUNS=20000: finds new cases; a failure is reported (the
#             shrunk golden-row candidates are uploaded) but does not fail the workflow, so a new seed never blocks a landing.
on:
  # Inputs: the package, the TS modules it checks, the Lean project (fwcore), the lockfile, the actions it uses.
  push:
    branches: ['ci/**', main]
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      seed:
        description: Seed for the rotating job (empty means the run id)
        type: string
        default: ''
      runs:
        description: Runs per op for the rotating job
        type: string
        default: '20000'

permissions:
  contents: read

jobs:
  # Guard (Lean Fw.Ci.Intent + Fw.Ci.Trigger, scripts/ci-paths.mjs). On a ci/* push it, and so every job, is skipped unless
  # the head commit asks for this lane (`[ci:<lane>]`; the default lane lean always); then it runs the workflow only if
  # the commit is the branch tip, is not on main yet, and (lean: always) some file that differs from main on the whole
  # branch is an input. A main push runs when its own diff passes the coarse paths; dispatches, schedules always run.
  # Fails open.
  # Every other job re-checks the tip first (`stale:` fails it) and has its own group, never cancelled on ci/*.
  guard:
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/ci/') || contains(github.event.head_commit.message, '[ci:difftest]') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: g
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          GUARD_TOKEN: ${{ github.token }}
        run: node .github/scripts/changed-inputs.mjs --workflow .github/workflows/difftest.yml
      - name: 'decision: run'
        if: steps.g.outputs.run == 'true'
        run: 'true'
      - name: 'decision: skip: ${{ steps.g.outputs.reason }}'
        if: steps.g.outputs.run != 'true'
        run: 'true'

  fwcore:
    needs: [guard]
    if: ${{ needs.guard.outputs.run == 'true' }}
    concurrency:
      group: ci-lane:difftest:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:fwcore:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lean
      - name: lake build fwcore
        working-directory: lean
        run: lake build fwcore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fwcore
          path: lean/.lake/build/bin/fwcore
          if-no-files-found: error
          retention-days: 1

  fixed:
    needs: [fwcore]
    concurrency:
      group: ci-lane:difftest:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:fixed:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@fw/difftest @fw/console-api...'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fwcore
          path: ${{ runner.temp }}/fwcore
      - name: Differential tests, fixed seed
        env:
          FW_CORE_BIN: ${{ runner.temp }}/fwcore/fwcore
          DIFFTEST_SEED: '20261018'
          DIFFTEST_RUNS: '2000'
          DIFFTEST_OUT: ${{ runner.temp }}/candidates
        run: |
          set -euo pipefail
          chmod +x "$FW_CORE_BIN"
          pnpm --filter @fw/difftest test 2>&1 | tee "$RUNNER_TEMP/fixed.log"
      - name: Summary
        if: ${{ (always()) && steps.stale.outcome == 'skipped' }}
        run: |
          {
            echo "### difftest, fixed seed 20261018"
            echo '```'
            grep -E '^difftest \{|^✖|differs' "$RUNNER_TEMP/fixed.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ (failure()) && steps.stale.outcome == 'skipped' }}
        with:
          name: difftest-candidates-fixed
          path: ${{ runner.temp }}/candidates
          if-no-files-found: ignore
          retention-days: 14

  rotating:
    needs: [fwcore]
    concurrency:
      group: ci-lane:difftest:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:rotating:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@fw/difftest @fw/console-api...'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fwcore
          path: ${{ runner.temp }}/fwcore
      - name: Pick the seed
        id: seed
        env:
          INPUT_SEED: ${{ github.event.inputs.seed }}
          INPUT_RUNS: ${{ github.event.inputs.runs }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          seed="${INPUT_SEED:-}"
          if [ -z "$seed" ]; then seed=$(( RUN_ID % 2147483647 )); fi
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "runs=${INPUT_RUNS:-20000}" >> "$GITHUB_OUTPUT"
      - name: Differential tests, rotating seed
        env:
          FW_CORE_BIN: ${{ runner.temp }}/fwcore/fwcore
          DIFFTEST_SEED: ${{ steps.seed.outputs.seed }}
          DIFFTEST_RUNS: ${{ steps.seed.outputs.runs }}
          DIFFTEST_OUT: ${{ runner.temp }}/candidates
        run: |
          set -euo pipefail
          chmod +x "$FW_CORE_BIN"
          pnpm --filter @fw/difftest test 2>&1 | tee "$RUNNER_TEMP/rotating.log"
      - name: Summary
        if: ${{ (always()) && steps.stale.outcome == 'skipped' }}
        env:
          SEED: ${{ steps.seed.outputs.seed }}
        run: |
          {
            echo "### difftest, rotating seed $SEED"
            echo '```'
            grep -E '^difftest \{|^✖|differs' "$RUNNER_TEMP/rotating.log" || true
            echo '```'
            if [ -d "$RUNNER_TEMP/candidates" ] && ls "$RUNNER_TEMP/candidates"/*.jsonl >/dev/null 2>&1; then
              echo "New golden-row candidates (artifact difftest-candidates-rotating):"
              wc -l "$RUNNER_TEMP"/candidates/*.jsonl
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ (failure()) && steps.stale.outcome == 'skipped' }}
        with:
          name: difftest-candidates-rotating
          path: ${{ runner.temp }}/candidates
          if-no-files-found: ignore
          retention-days: 30
