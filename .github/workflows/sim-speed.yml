name: sim-speed

# Research probe (note: research/notes/2026/10-17-sim-speed.md): how fast can the iOS Simulator be booted and reached
# from Node on the GitHub-hosted xcode-27 image? Boot + connect + ONE page load per job, a mark per phase, a host
# sampler (load, memory, swap, top CPU) in the background from the start. Counts are not taken here, and nothing
# measured here is phone time. It does not touch webkit-sim.yml or packages/measure-webkit (it imports them read-only).
#
# Arms (one matrix job each, `rep` = an independent VM):
#   base   the harness path as is: new device, blocking boot, terminate + launch Safari, fixed sleep, openurl, proxy
#   pre    base, but on a device that is already on the image instead of a newly created one
#   fast   new device, blocking boot, then the fast connect (openurl launches Safari, poll, re-send every 15 s)
#   quiet  base, plus Spotlight off and unified logging down on the host and in the Simulator
#   bg     fast connect, and `simctl boot` started in the background right after create (overlaps setup-node and brew)
#   f6     new device, fast connect (proxy after openurl returned) with a 6 s re-send window
#   early  f6, but with the proxy started BEFORE the first openurl (round 2: lists no tab until the proxy is restarted)
#   qe     early, plus the home-screen widget host (chronod) and other daemons a page load does not need booted out of the
#          device's launchd while it boots
#   combo  f6, on the device that is already on the image
#   (xl, f6 on the paid larger runner xcode-27-xlarge, was removed: user decision 2026-10-17, no paid runners; its rounds
#   2-3 results stay in research/notes/2026/10-17-sim-speed.md)
on:
  push:
    branches: [ci/sim-speed]
  workflow_dispatch:
    inputs:
      arms:
        description: Space-separated arms (base pre fast quiet bg f6 early qe combo)
        type: string
        default: 'base f6 combo'
      reps:
        description: Independent VMs per arm (1 to 3)
        type: string
        default: '3'

permissions:
  contents: read

jobs:
  # Guard (Lean Fw.Ci.Intent + Fw.Ci.Trigger, scripts/ci-paths.mjs). On a ci/* push it, and so every job, is skipped unless
  # the head commit asks for this lane (`[ci:<lane>]`; the default lane lean always); then it runs the workflow only if
  # the commit is the branch tip, is not on main yet, and (lean: always) some file that differs from main on the whole
  # branch is an input. A main push starts no run; dispatches always run. Fails open.
  # Every other job re-checks the tip first (`stale:` fails it) and has its own group, never cancelled on ci/*.
  guard:
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/ci/') || contains(github.event.head_commit.message, '[ci:sim-speed]') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: g
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          GUARD_TOKEN: ${{ github.token }}
        run: node .github/scripts/changed-inputs.mjs --workflow .github/workflows/sim-speed.yml
      - name: 'decision: run'
        if: steps.g.outputs.run == 'true'
        run: 'true'
      - name: 'decision: skip: ${{ steps.g.outputs.reason }}'
        if: steps.g.outputs.run != 'true'
        run: 'true'

  plan:
    needs: [guard]
    if: ${{ needs.guard.outputs.run == 'true' }}
    concurrency:
      group: ci-lane:sim-speed:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:plan:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - id: m
        env:
          ARMS: ${{ inputs.arms || 'base f6 combo' }}
          REPS: ${{ inputs.reps || '3' }}
        run: |
          set -euo pipefail
          case "$REPS" in 1|2|3) ;; *) echo "reps must be 1..3" >&2; exit 1 ;; esac
          for a in $ARMS; do case "$a" in base|pre|fast|quiet|bg|f6|early|qe|combo) ;; *) echo "unknown arm $a" >&2; exit 1 ;; esac; done
          arms=$(printf '%s\n' $ARMS | jq -R -s -c 'split("\n") | map(select(length > 0))')
          reps=$(seq 1 "$REPS" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          matrix=$(jq -n -c --argjson a "$arms" --argjson r "$reps" '{arm: $a, rep: $r}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  probe:
    needs: [guard, plan]
    if: ${{ needs.guard.outputs.run == 'true' }}
    concurrency:
      group: ci-lane:sim-speed:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:probe:${{ strategy.job-index }}
    runs-on: xcode-27
    timeout-minutes: 17
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      FW_IOS_VERSION: '27.0'
      FW_IOS_BUILD: 24A434
      FW_SIM_NAME: fw-iphone-27
      ARM: ${{ matrix.arm }}
      CONNECT: ${{ (matrix.arm == 'base' || matrix.arm == 'pre' || matrix.arm == 'quiet') && 'legacy' || 'fast' }}
      EXTRA: '1'
      EARLY: ${{ (matrix.arm == 'early' || matrix.arm == 'qe') && '1' || '0' }}
      RESEND_MS: ${{ (matrix.arm == 'f6' || matrix.arm == 'early' || matrix.arm == 'qe' || matrix.arm == 'combo') && '6000' || '15000' }}
      FW_SNAPSHOT_SITE: ${{ github.workspace }}/snapshot/site
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Marks go to $RUNNER_TEMP/result/marks.txt as "<epoch ms> <label>"; the sampler starts before `simctl create`.
      - name: Marks and host sampler
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/result"
          sh .github/scripts/sim-speed-mark.sh "job start arm=$ARM rep=${{ matrix.rep }}"
          nohup sh .github/scripts/sim-speed-sampler.sh "$RUNNER_TEMP/result/sampler.txt" 15 >/dev/null 2>&1 &
          echo $! > "$RUNNER_TEMP/sampler.pid"

      - name: Host quieting (arm quiet)
        if: ${{ matrix.arm == 'quiet' }}
        run: |
          for c in "mdutil -a -i off" "log config --mode persist:off" "log config --mode level:off"; do
            s=$(date +%s)
            # shellcheck disable=SC2086
            if sudo -n $c; then r=ok; else r="failed"; fi
            sh .github/scripts/sim-speed-mark.sh "quiet host: $c -> $r in $(( $(date +%s) - s )) s"
          done

      - name: Pinned iOS runtime build, then the device (new, or the image's own for pre/combo)
        run: |
          set -euo pipefail
          sh .github/scripts/sim-speed-mark.sh "create begin"
          if [ "$ARM" = pre ] || [ "$ARM" = combo ]; then sh .github/scripts/check-simulator.sh; else sh .github/scripts/check-simulator.sh --create; fi
          sh .github/scripts/sim-speed-mark.sh "create end"

      # bg: boot now, in the background, so it overlaps setup-node and brew. Waited for with bootstatus in the probe.
      - name: Background boot (arm bg)
        if: ${{ matrix.arm == 'bg' }}
        run: |
          set -euo pipefail
          xcrun simctl shutdown all || true
          udid=$(cat "$RUNNER_TEMP/fw-sim-udid.txt")
          sh .github/scripts/sim-speed-mark.sh "boot-bg: started"
          nohup sh -c "xcrun simctl boot $udid; sh .github/scripts/sim-speed-mark.sh 'boot-bg: simctl boot returned'" >"$RUNNER_TEMP/result/boot-bg.log" 2>&1 &

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: ios_webkit_debug_proxy
        run: |
          set -euo pipefail
          sh .github/scripts/sim-speed-mark.sh "brew begin"
          brew install ios-webkit-debug-proxy
          sh .github/scripts/sim-speed-mark.sh "brew end"

      - name: Tool and runner facts
        run: |
          set -euo pipefail
          sh .github/scripts/runner-info.sh "$RUNNER_TEMP/result/runner.json"
          {
            sw_vers
            xcodebuild -version
            xcrun simctl list runtimes
            xcrun simctl list devices
            sysctl hw.memsize hw.ncpu
            df -h / | tail -1
          } > "$RUNNER_TEMP/result/tools.txt" 2>&1 || true
          sh .github/scripts/sim-speed-mark.sh "facts end"

      - name: Probe (boot, connect, one page, then the extra sessions)
        run: |
          set -euo pipefail
          if [ "$ARM" != bg ]; then xcrun simctl shutdown all || true; fi
          node .github/scripts/sim-speed-probe.mjs 2>&1 | tee "$RUNNER_TEMP/result/probe.log"

      # Always: stop only the sampler this job started, keep the log, delete the device.
      - name: Stop sampler, shut down
        if: ${{ (always()) && steps.stale.outcome == 'skipped' }}
        run: |
          kill "$(cat "$RUNNER_TEMP/sampler.pid")" 2>/dev/null || true
          sh .github/scripts/sim-speed-mark.sh "teardown"
          xcrun simctl shutdown all || true
          xcrun simctl delete "$FW_SIM_NAME" || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ (always()) && steps.stale.outcome == 'skipped' }}
        with:
          name: sim-speed-${{ matrix.arm }}-${{ matrix.rep }}
          path: ${{ runner.temp }}/result
          if-no-files-found: error
          retention-days: 30
