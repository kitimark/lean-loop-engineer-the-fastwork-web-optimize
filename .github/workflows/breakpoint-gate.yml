name: breakpoint-gate

# The title of a dispatched run echoes its nonce (`breakpoint-gate dispatch nonce=<n>`), so `fw run` and `fw ci wait --nonce` find the run
# they dispatched by identity (Lean Fw.Ci.Dispatch.wanted), never as "the newest run". A push keeps its default title.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('breakpoint-gate dispatch nonce={0}', inputs.nonce || 'none') || '' }}

# Breakpoint parity gate (PLAN 6.6): original snapshot against the rewrite, 124 loads per engine and the 4 live-resize
# sweeps, split over a few jobs per engine by the Lean split (default: Fw.Gate.Shard, LPT over measured unit costs,
# golden/gate/shards.jsonl; older sets: Fw.Gate.Schedule.choose, golden/gate/schedule.jsonl; .github/scripts/gate-jobs.mjs
# passes the jobs through and checks coverage), merged into the same <engine>.json that
# `cli.mjs summary` reads on the Mac. Why few jobs: the free plan runs 20 jobs for the whole account and one run used to
# start 22 (docs/team/tools/gate-speed.md).
# Engines on the runner: Chrome Headless Shell 156.0.8078.4 (the counts lane's browser; the local gate uses desktop
# Chrome) and Playwright WebKit on Linux (a WebKitGTK/WPE port, NOT Mobile Safari). Both are separate `platform` keys:
# a CI table is a second opinion, not a replacement for the Mac run (research note ci-measurement-feasibility).
on:
  # Inputs: the gate package, the rewrite it builds (apps/site), lean/ (breakgen, fwcore), the snapshot and its lock, the pnpm
  # workspace files, the scripts and actions the jobs use.
  # Every push creates a run and its guard job decides on these inputs (Lean Fw.Ci.Intent); `workflow_dispatch` runs it on demand
  # (gh workflow run <name> --ref <branch>). Why: docs/team/handoffs/ci-trigger-scope.md.
  push:
    branches: ['ci/**']
  workflow_dispatch:
    inputs:
      engines:
        description: Engines to run
        type: choice
        options: [both, chromium, playwright-webkit]
        default: both
      runs:
        description: >-
          Gate runs expected to share the 20-job pool at once (1 to 3); picks the line of the Lean split
          (the split is the same for 1 to 3 with the cached times; it differs once the reduced sweep is live)
        type: string
        default: '2'
      free:
        description: >-
          Runners of the account's 20 you expect to be free for this run (4, 8, 12 or 20); picks the line of the Lean split
          (fewer free runners favour fewer jobs: Fw.Gate.Schedule.wall_lower, wall_upper)
        type: string
        default: '8'
      times:
        description: >-
          Time set of the Lean split: measured (default; Fw.Gate.Shard LPT over the measured unit costs,
          golden/gate/shards.jsonl) or the older mean-cost sets base, cached, reduced (Fw.Gate.Schedule)
        type: string
        default: 'measured'
      fw:
        description: >-
          Flag set of the rewrite arm, e.g. morph.tween:waapi (becomes ?fw=...; the build prerenders every single-variant page). Allowed characters: [A-Za-z0-9.:,-_@]. Empty = the default config.
        type: string
        default: ''
      preset:
        description: >-
          Preset of the rewrite arm, e.g. v2-proved (becomes ?preset=...; the build prerenders every preset). Exclusive with fw. Empty = none.
        type: string
        default: ''
      parts:
        description: >-
          Pilot parts to check, comma separated (engine.scroll, nav.hitTest, hero.countdown, hero.exit); empty = all.
          A narrowed run loads only the probes and sweeps of those parts' Lean scope (packages/gate-breakpoints/src/scope.gen.json), collects and judges only those parts, and its summary names the parts covered and skipped.
          (Not the pnpm FILTERS of setup-pnpm, which select packages to install.)
        type: string
        default: ''
      nonce:
        description: >-
          Identity of this dispatch, echoed in the run title (8 to 32 characters of a-z0-9; `fw run` sets it). Empty = a manual dispatch.
        type: string
        default: ''

permissions:
  contents: read

env:
  # Same pinned browser as packages/measure-chromium/Dockerfile.
  HS_VERSION: 156.0.8078.4
  HS_SHA256: 81ab9d4d3c301dc5fdfb6c541b9e6632b16fc819a6a854460f40a76fe2b2c476

jobs:
  # Guard (Lean Fw.Ci.Intent + Fw.Ci.Trigger, scripts/ci-paths.mjs). On a ci/* push it, and so every job, is skipped unless
  # the head commit asks for this lane (`[ci:<lane>]`; the default lane lean always); then it runs the workflow only if
  # the commit is the branch tip, is not on main yet, and (lean: always) some file that differs from main on the whole
  # branch is an input. A main push starts no run; dispatches always run. Fails open.
  # Every other job re-checks the tip first (`stale:` fails it) and has its own group, never cancelled on ci/*.
  guard:
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/ci/') || contains(github.event.head_commit.message, '[ci:breakpoint-gate]') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - id: g
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          GUARD_TOKEN: ${{ github.token }}
        run: node .github/scripts/changed-inputs.mjs --workflow .github/workflows/breakpoint-gate.yml
      - name: 'decision: run'
        if: steps.g.outputs.run == 'true'
        run: 'true'
      - name: 'decision: skip: ${{ steps.g.outputs.reason }}'
        if: steps.g.outputs.run != 'true'
        run: 'true'

  # The rewrite, built once; every gate job downloads this exact build (its buildId is in each run header, and the merge
  # job refuses files whose headers differ).
  # It also holds the plan (the Lean job split, a few ms of node): a separate plan job took a runner of the shared 20
  # and its own queue wait (Fw.Gate.Schedule: Fixed.two_fewer_jobs).
  site:
    needs: [guard]
    if: ${{ needs.guard.outputs.run == 'true' }}
    concurrency:
      group: ci-lane:breakpoint-gate:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:site:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      engines: ${{ steps.p.outputs.engines }}
      parts: ${{ steps.p.outputs.parts }}
      search: ${{ steps.p.outputs.search }}
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/telemetry
        with:
          mode: start
          label: site
      - id: p
        name: Plan the gate jobs (Lean split for the free runners)
        env:
          ENGINES: ${{ inputs.engines || 'both' }}
          RUNS: ${{ inputs.runs || '2' }}
          FREE: ${{ inputs.free || '8' }}
          TIMES: ${{ inputs.times || 'measured' }}
          PARTS: ${{ inputs.parts || '' }}
          FW: ${{ inputs.fw || '' }}
          PRESET: ${{ inputs.preset || '' }}
        run: |
          set -euo pipefail
          node --test .github/scripts/gate-search.test.mjs  # the search decision equals Fw.Gate.Search
          search=$(node .github/scripts/gate-search.mjs --fw "$FW" --preset "$PRESET")
          node --test .github/scripts/gate-jobs.test.mjs  # the times default equals the Lean plan default (merge-drift guard)
          case "$RUNS" in 1|2|3) ;; *) echo "runs must be 1, 2 or 3" >&2; exit 1 ;; esac
          case "$FREE" in 4|8|12|20) ;; *) echo "free must be 4, 8, 12 or 20" >&2; exit 1 ;; esac
          case "$TIMES" in measured|base|cached|reduced) ;; *) echo "times must be measured, base, cached or reduced" >&2; exit 1 ;; esac
          case "$ENGINES" in
            both) engines='["chromium","playwright-webkit"]' ;;
            chromium) engines='["chromium"]' ;;
            playwright-webkit) engines='["playwright-webkit"]' ;;
            *) echo "bad engines" >&2; exit 1 ;;
          esac
          # gate-jobs checks the part ids against anchors.json (exit 2 on an unknown id); empty means all parts.
          parts_args=()
          if [ -n "$PARTS" ]; then parts_args=(--parts "$PARTS"); fi
          jobs=$(node .github/scripts/gate-jobs.mjs --params "$TIMES" --runs "$RUNS" --free "$FREE" --engines "$ENGINES" ${parts_args[@]+"${parts_args[@]}"})
          matrix=$(printf '%s' "$jobs" | node -e 'process.stdout.write(JSON.stringify({include: JSON.parse(require("fs").readFileSync(0, "utf8")).include}))')
          {
            echo "engines=$engines"
            echo "parts=$PARTS"
            echo "search=$search"
            echo "matrix=$matrix"
          } >> "$GITHUB_OUTPUT"
          echo "$engines"
          echo "$matrix" | cut -c1-400
      - uses: ./.github/actions/setup-lean
      - uses: ./.github/actions/telemetry
        with:
          mode: cache
          cache-dirs: lake=${{ github.workspace }}/.lake-cache
      # `pnpm build` of the site first runs `lake exe breakgen --check` (the checked-in gen file must equal Lean's output).
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@fw/site...'
      - name: Build the rewrite (default prerendered config)
        run: pnpm --filter @fw/site build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: apps/site/dist/aot
          if-no-files-found: error
          retention-days: 3
      - uses: ./.github/actions/telemetry
        if: ${{ (always()) && steps.stale.outcome == 'skipped' }}
        with:
          mode: finish
          label: site

  # One job per entry of the Lean split: its probes (`cli.mjs run --probes`) and its whole sweeps (`--sweeps`); "none" = nothing.
  gate:
    needs: [site]
    concurrency:
      group: ci-lane:breakpoint-gate:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:gate:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    name: gate ${{ matrix.engine }} ${{ matrix.job }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.site.outputs.matrix) }}
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@fw/gate-breakpoints'
      - uses: ./.github/actions/telemetry
        with:
          mode: start
          label: gate-${{ matrix.engine }}-${{ matrix.job }}
      - name: Verify the snapshot against snapshot.lock.json
        run: node .github/scripts/verify-snapshot.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: apps/site/dist/aot
      - uses: ./.github/actions/gate-engine
        with:
          engine: ${{ matrix.engine }}
      - name: Smoke test the engine (fails in under two minutes instead of burning the job budget)
        env:
          ENGINE: ${{ matrix.engine }}
          FW_SNAPSHOT_SITE: ${{ github.workspace }}/snapshot/site
          FW_SITE_DIST: ${{ github.workspace }}/apps/site/dist/aot
          FW_SEARCH: ${{ needs.site.outputs.search }}
          SMOKE: ${{ github.workspace }}/.github/scripts/gate-smoke.mjs
        working-directory: packages/gate-breakpoints
        timeout-minutes: 5
        run: node "$SMOKE" --engine "$ENGINE"
      - name: Run the job (probes, then whole sweeps)
        env:
          ENGINE: ${{ matrix.engine }}
          PROBES: ${{ matrix.probes }}
          SWEEPS: ${{ matrix.sweeps }}
          PARTS: ${{ needs.site.outputs.parts }}
          FW_SNAPSHOT_SITE: ${{ github.workspace }}/snapshot/site
          FW_SITE_DIST: ${{ github.workspace }}/apps/site/dist/aot
          FW_SEARCH: ${{ needs.site.outputs.search }}
        working-directory: packages/gate-breakpoints
        run: |
          parts_args=()
          if [ -n "$PARTS" ]; then parts_args=(--parts "$PARTS"); fi
          node src/cli.mjs run --engine "$ENGINE" --probes "$PROBES" --sweeps "$SWEEPS" --concurrency 4 ${parts_args[@]+"${parts_args[@]}"} --out out/job
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-${{ matrix.engine }}-${{ matrix.job }}
          path: packages/gate-breakpoints/out/job/${{ matrix.engine }}.json
          if-no-files-found: error
          retention-days: 14
      - uses: ./.github/actions/telemetry
        if: ${{ (always()) && steps.stale.outcome == 'skipped' }}
        with:
          mode: finish
          label: gate-${{ matrix.engine }}-${{ matrix.job }}

  # The flip-state cell (task geom-flip-fix, packages/gate-breakpoints/src/flip-cell.mjs; bound, ms and bands from the Lean golden
  # morph-geom.jsonl) and the pixel look report (packages/premise-tests/src/look.mjs: bar, column and page regions against the base
  # page at m in 0, .25, .5, .75, 1), for morph.geom:on and for morph.geom:on with morph.tween:geom-timed, whatever flag set the
  # gate jobs above run. Graded (a finding fails the job): the morph.geom:on cell, the flip verify (A3a time kept, A4 quiet leave, A5
  # timed take; packages/gate-breakpoints/src/flip-verify.mjs, task flip-verify-auto) and the mutation runs (each fix reverted at run time
  # must make its own reading fail; --expect-fail). Reported only (exit 0, the line says so): the geom-timed cell and the look report. The
  # verdict is the cell's own line in the step log and the JSON artifact.
  flip-cell:
    needs: [site]
    concurrency:
      group: ci-lane:breakpoint-gate:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:flip-cell:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    name: flip-cell ${{ matrix.engine }}
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, playwright-webkit]
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@fw/gate-breakpoints @fw/premise-tests @fw/visual-diff'
      - uses: ./.github/actions/telemetry
        with:
          mode: start
          label: flip-cell-${{ matrix.engine }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: apps/site/dist/aot
      - uses: ./.github/actions/gate-engine
        with:
          engine: ${{ matrix.engine }}
      - name: Flip-state cell
        if: ${{ !cancelled() && steps.stale.outcome == 'skipped' }}
        env:
          ENGINE: ${{ matrix.engine }}
          FW_SITE_DIST: ${{ github.workspace }}/apps/site/dist/aot
        working-directory: packages/gate-breakpoints
        run: node src/cli.mjs flip --engine "$ENGINE" --fw morph.geom:on --out out/flip/on
      - name: Flip-state cell, geom-timed (reported only)
        if: ${{ !cancelled() && steps.stale.outcome == 'skipped' }}
        env:
          ENGINE: ${{ matrix.engine }}
          FW_SITE_DIST: ${{ github.workspace }}/apps/site/dist/aot
        working-directory: packages/gate-breakpoints
        run: node src/cli.mjs flip --engine "$ENGINE" --fw morph.geom:on,morph.tween:geom-timed --report-only --out out/flip/timed
      - name: Flip verify (A3a, A4, A5)
        if: ${{ !cancelled() && steps.stale.outcome == 'skipped' }}
        env:
          ENGINE: ${{ matrix.engine }}
          FW_SITE_DIST: ${{ github.workspace }}/apps/site/dist/aot
        working-directory: packages/gate-breakpoints
        run: node src/cli.mjs verify --engine "$ENGINE" --out out/verify
      - name: Flip verify repeats (two more passes in this job on three bands; in-job repeats, not separate jobs)
        if: ${{ !cancelled() && steps.stale.outcome == 'skipped' }}
        env:
          ENGINE: ${{ matrix.engine }}
          FW_SITE_DIST: ${{ github.workspace }}/apps/site/dist/aot
        working-directory: packages/gate-breakpoints
        shell: bash
        run: |
          rc=0
          for r in 2 3; do
            node src/cli.mjs verify --engine "$ENGINE" --bands 390x844,1280x800,1920x1080 --out "out/verify-rep$r" || rc=1
          done
          exit $rc
      - name: Flip mutation runs (each reverted fix must fail its reading)
        if: ${{ !cancelled() && steps.stale.outcome == 'skipped' }}
        env:
          ENGINE: ${{ matrix.engine }}
          FW_SITE_DIST: ${{ github.workspace }}/apps/site/dist/aot
        working-directory: packages/gate-breakpoints
        shell: bash
        run: |
          rc=0
          for m in A1 A3b A3c; do
            node src/cli.mjs flip --engine "$ENGINE" --fw morph.geom:on --bands 390x844,1280x800 --mutation "$m" --expect-fail --out out/mutation || rc=1
          done
          for m in A4 A3a A5; do
            node src/cli.mjs verify --engine "$ENGINE" --bands 390x844,1280x800 --cycles 1 --mutation "$m" --expect-fail --out out/mutation || rc=1
          done
          exit $rc
      - name: Pixel look report
        if: ${{ !cancelled() && steps.stale.outcome == 'skipped' }}
        env:
          ENGINE: ${{ matrix.engine }}
          FW_SITE_DIST: ${{ github.workspace }}/apps/site/dist/aot
        working-directory: packages/premise-tests
        run: |
          node src/look.mjs --engine "$ENGINE" --fw morph.geom:on --out out/look/on
          node src/look.mjs --engine "$ENGINE" --fw morph.geom:on,morph.tween:geom-timed --out out/look/timed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ (always()) && steps.stale.outcome == 'skipped' }}
        with:
          name: flip-cell-${{ matrix.engine }}
          path: |
            packages/gate-breakpoints/out/flip
            packages/gate-breakpoints/out/verify
            packages/gate-breakpoints/out/verify-rep2
            packages/gate-breakpoints/out/verify-rep3
            packages/gate-breakpoints/out/mutation
            packages/premise-tests/out/look/*/look-*.json
          if-no-files-found: error
          retention-days: 14
      - uses: ./.github/actions/telemetry
        if: ${{ (always()) && steps.stale.outcome == 'skipped' }}
        with:
          mode: finish
          label: flip-cell-${{ matrix.engine }}

  # One merge job for the engines: `fwcore` is built once (a merge job per engine built it twice, 36 s each, and took a second
  # runner of the shared 20: Fw.Gate.Schedule.Fixed.work_saved). Each engine is merged and summarized on its own, so a failing
  # WebKit job does not hide the Chromium table, and each keeps its own artifact.
  merge:
    needs: [site, gate]
    if: ${{ !cancelled() && needs.site.result == 'success' }}
    concurrency:
      group: ci-lane:breakpoint-gate:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:merge:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # `summary` asks Lean for every status and verdict (fwcore ops gate.*: lean/Fw/Wire/Gate.lean).
      - uses: ./.github/actions/setup-lean
      - name: Build fwcore
        working-directory: lean
        run: lake build fwcore
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gate-*-j*
          path: ${{ runner.temp }}/parts
      - name: Merge the jobs and summarize
        env:
          ENGINES: ${{ join(fromJSON(needs.site.outputs.engines), ' ') }}
        run: |
          set -euo pipefail
          parts="$RUNNER_TEMP/parts"
          ls "$parts"
          # `summary` is the same code the Mac run uses; it reads <engine>.json from --out.
          # `summary` exits non-zero exactly when the merged verdict is not pass (gate-exit-verdict, Lean exit_zero_iff). Keep the
          # code per engine, write the step summary, and fail the job at the end, so the uploads below still run on a failing verdict.
          rc=0
          for ENGINE in $ENGINES; do
            out="$RUNNER_TEMP/gate-$ENGINE"
            mkdir -p "$out"
            jobs=("$parts"/gate-"$ENGINE"-j[0-9]*/"$ENGINE".json)
            if ! node .github/scripts/merge-gate.mjs --out "$out/$ENGINE.json" "${jobs[@]}"; then rc=1; continue; fi
            erc=0
            node packages/gate-breakpoints/src/cli.mjs summary --out "$out" || erc=$?
            sha256sum "$out"/*.json | tee "$out/sha256.txt"
            {
              echo "### breakpoint-gate: $ENGINE"
              cat "$out/summary.md"
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$erc" -ne 0 ]; then rc="$erc"; fi
          done
          exit "$rc"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ (!cancelled()) && steps.stale.outcome == 'skipped' }}
        with:
          name: gate-merged-chromium
          path: ${{ runner.temp }}/gate-chromium
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ (!cancelled()) && steps.stale.outcome == 'skipped' }}
        with:
          name: gate-merged-playwright-webkit
          path: ${{ runner.temp }}/gate-playwright-webkit
          if-no-files-found: ignore
          retention-days: 30
