name: breakpoint-gate

# Breakpoint parity gate (PLAN 6.6): original snapshot against the rewrite, 124 loads per engine and the 4 live-resize
# sweeps, split over a few jobs per engine by the Lean split (Fw.Gate.Schedule.choose, golden/gate/schedule.jsonl;
# .github/scripts/gate-jobs.mjs deals the probes and checks coverage), merged into the same <engine>.json that
# `cli.mjs summary` reads on the Mac. Why few jobs: the free plan runs 20 jobs for the whole account and one run used to
# start 22 (docs/team/tools/gate-speed.md).
# Engines on the runner: Chrome Headless Shell 156.0.8078.4 (the counts lane's browser; the local gate uses desktop
# Chrome) and Playwright WebKit on Linux (a WebKitGTK/WPE port, NOT Mobile Safari). Both are separate `platform` keys:
# a CI table is a second opinion, not a replacement for the Mac run (research note ci-measurement-feasibility).
on:
  # Inputs: the gate package, the rewrite it builds (apps/site), lean/ (breakgen, fwcore), the snapshot and its lock, the pnpm
  # workspace files, the scripts and actions the jobs use.
  # A push runs this workflow only when it changes one of these paths; `workflow_dispatch` runs it on demand
  # (gh workflow run <name> --ref <branch>). Why: docs/team/handoffs/ci-trigger-scope.md.
  push:
    branches: ['ci/**', main]
    paths:
      - 'packages/gate-breakpoints/**'
      - 'apps/site/**'
      - 'lean/**'
      - 'snapshot/**'
      - 'snapshot.lock.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/scripts/gate-shards.mjs'
      - '.github/scripts/gate-jobs.mjs'
      - '.github/scripts/cache-key.mjs'
      - 'packages/contracts/golden/gate/schedule.jsonl'
      - 'packages/contracts/golden/ops/cache.jsonl'
      - '.github/scripts/gate-smoke.mjs'
      - '.github/scripts/merge-gate.mjs'
      - '.github/scripts/verify-snapshot.mjs'
      - '.github/actions/setup-lean/**'
      - '.github/actions/setup-pnpm/**'
      - '.github/actions/gate-engine/**'
      - '.github/workflows/breakpoint-gate.yml'
  workflow_dispatch:
    inputs:
      engines:
        description: Engines to run
        type: choice
        options: [both, chromium, playwright-webkit]
        default: both
      runs:
        description: >-
          Gate runs expected to share the 20-job pool at once (1 to 3); picks the line of the Lean split
          (the split is the same for 1 to 3 with the cached times; it differs once the reduced sweep is live)
        type: string
        default: '2'
      times:
        description: Time set of the Lean split (base, cached, reduced); cached until the reduced sweep is wired into run.mjs
        type: string
        default: 'cached'
      fw:
        description: >-
          Flag set of the rewrite arm, e.g. morph.tween:waapi (becomes ?fw=...; the build prerenders every single-variant page). Empty = the default config.
        type: string
        default: ''
      parts:
        description: >-
          Pilot parts to check, comma separated (engine.scroll, nav.hitTest, hero.countdown, hero.exit); empty = all.
          A narrowed run loads only the probes and sweeps of those parts' Lean scope (packages/gate-breakpoints/src/scope.gen.json), collects and judges only those parts, and its summary names the parts covered and skipped.
          (Not the pnpm FILTERS of setup-pnpm, which select packages to install.)
        type: string
        default: ''

permissions:
  contents: read

# A newer push to the same ci/** branch cancels the older run of this workflow; main never cancels (a run there is a record).
# Runs of other branches never cancel each other (the ref is in the group). Dispatches on one branch with different inputs
# (flag set, parts, engines) are different groups, so a loop of variant dispatches is not cancelled by its own next iteration.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.fw }}-${{ inputs.parts }}-${{ inputs.engines }}-${{ inputs.runs }}-${{ inputs.times }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/ci/') }}

env:
  # Same pinned browser as packages/measure-chromium/Dockerfile.
  HS_VERSION: 156.0.8078.4
  HS_SHA256: 81ab9d4d3c301dc5fdfb6c541b9e6632b16fc819a6a854460f40a76fe2b2c476

jobs:
  plan:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      engines: ${{ steps.p.outputs.engines }}
      parts: ${{ steps.p.outputs.parts }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            apps/site/src/breakpoints.gen.json
            packages/gate-breakpoints/src
            packages/contracts/golden/gate/schedule.jsonl
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - id: p
        env:
          ENGINES: ${{ inputs.engines || 'both' }}
          RUNS: ${{ inputs.runs || '2' }}
          TIMES: ${{ inputs.times || 'cached' }}
          PARTS: ${{ inputs.parts || '' }}
        run: |
          set -euo pipefail
          case "$RUNS" in 1|2|3) ;; *) echo "runs must be 1, 2 or 3" >&2; exit 1 ;; esac
          case "$TIMES" in base|cached|reduced) ;; *) echo "times must be base, cached or reduced" >&2; exit 1 ;; esac
          case "$ENGINES" in
            both) engines='["chromium","playwright-webkit"]' ;;
            chromium) engines='["chromium"]' ;;
            playwright-webkit) engines='["playwright-webkit"]' ;;
            *) echo "bad engines" >&2; exit 1 ;;
          esac
          # gate-jobs checks the part ids against anchors.json (exit 2 on an unknown id); empty means all parts.
          parts_args=()
          if [ -n "$PARTS" ]; then parts_args=(--parts "$PARTS"); fi
          case "$ENGINES" in both) eng_arg=both ;; *) eng_arg="$ENGINES" ;; esac
          jobs=$(node .github/scripts/gate-jobs.mjs --params "$TIMES" --runs "$RUNS" --engines "$eng_arg" ${parts_args[@]+"${parts_args[@]}"})
          matrix=$(printf '%s' "$jobs" | node -e 'process.stdout.write(JSON.stringify({include: JSON.parse(require("fs").readFileSync(0, "utf8")).include}))')
          {
            echo "engines=$engines"
            echo "parts=$PARTS"
            echo "matrix=$matrix"
          } >> "$GITHUB_OUTPUT"
          echo "$engines"
          echo "$matrix" | cut -c1-400

  # The rewrite, built once; every gate job downloads this exact build (its buildId is in each run header, and the merge
  # job refuses files whose headers differ).
  site:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lean
      # `pnpm build` of the site first runs `lake exe breakgen --check` (the checked-in gen file must equal Lean's output).
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@fw/site...'
      - name: Build the rewrite (default prerendered config)
        run: pnpm --filter @fw/site build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: apps/site/dist/aot
          if-no-files-found: error
          retention-days: 3

  # One job per entry of the Lean split: its probes (`cli.mjs run --probes`) and its whole sweeps (`--sweeps`); "none" = nothing.
  gate:
    needs: [plan, site]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    name: gate ${{ matrix.engine }} ${{ matrix.job }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Verify the snapshot against snapshot.lock.json
        run: node .github/scripts/verify-snapshot.mjs
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@fw/gate-breakpoints'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: apps/site/dist/aot
      - uses: ./.github/actions/gate-engine
        with:
          engine: ${{ matrix.engine }}
      - name: Smoke test the engine (fails in under two minutes instead of burning the job budget)
        env:
          ENGINE: ${{ matrix.engine }}
          FW_SNAPSHOT_SITE: ${{ github.workspace }}/snapshot/site
          FW_SITE_DIST: ${{ github.workspace }}/apps/site/dist/aot
          FW_SEARCH: ${{ inputs.fw && format('?fw={0}', inputs.fw) || '' }}
          SMOKE: ${{ github.workspace }}/.github/scripts/gate-smoke.mjs
        working-directory: packages/gate-breakpoints
        timeout-minutes: 5
        run: node "$SMOKE" --engine "$ENGINE"
      - name: Run the job (probes, then whole sweeps)
        env:
          ENGINE: ${{ matrix.engine }}
          PROBES: ${{ matrix.probes }}
          SWEEPS: ${{ matrix.sweeps }}
          PARTS: ${{ needs.plan.outputs.parts }}
          FW_SNAPSHOT_SITE: ${{ github.workspace }}/snapshot/site
          FW_SITE_DIST: ${{ github.workspace }}/apps/site/dist/aot
          FW_SEARCH: ${{ inputs.fw && format('?fw={0}', inputs.fw) || '' }}
        working-directory: packages/gate-breakpoints
        run: |
          parts_args=()
          if [ -n "$PARTS" ]; then parts_args=(--parts "$PARTS"); fi
          node src/cli.mjs run --engine "$ENGINE" --probes "$PROBES" --sweeps "$SWEEPS" --concurrency 4 ${parts_args[@]+"${parts_args[@]}"} --out out/job
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-${{ matrix.engine }}-${{ matrix.job }}
          path: packages/gate-breakpoints/out/job/${{ matrix.engine }}.json
          if-no-files-found: error
          retention-days: 14

  # One merge job per engine, so a failing WebKit job does not hide the Chromium table.
  merge:
    needs: [plan, gate]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJSON(needs.plan.outputs.engines) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # `summary` asks Lean for every status and verdict (fwcore ops gate.*: lean/Fw/Wire/Gate.lean).
      - uses: ./.github/actions/setup-lean
      - name: Build fwcore
        working-directory: lean
        run: lake build fwcore
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gate-${{ matrix.engine }}-*
          path: ${{ runner.temp }}/parts
      - name: Merge the jobs and summarize
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          set -euo pipefail
          parts="$RUNNER_TEMP/parts"
          out="$RUNNER_TEMP/gate"
          mkdir -p "$out"
          ls "$parts"
          jobs=("$parts"/gate-"$ENGINE"-j[0-9]*/"$ENGINE".json)
          node .github/scripts/merge-gate.mjs --out "$out/$ENGINE.json" "${jobs[@]}"
          # `summary` is the same code the Mac run uses; it reads <engine>.json from --out.
          node packages/gate-breakpoints/src/cli.mjs summary --out "$out"
          sha256sum "$out"/*.json | tee "$out/sha256.txt"
          {
            echo "### breakpoint-gate: $ENGINE"
            cat "$out/summary.md"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-merged-${{ matrix.engine }}
          path: ${{ runner.temp }}/gate
          if-no-files-found: error
          retention-days: 30
