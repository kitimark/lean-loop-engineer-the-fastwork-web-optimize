name: smoothness

# The smoothness probe, part B (task smoothness-probe): how evenly do frames arrive while the page scrolls, in the original, the faithful
# rewrite, a second faithful rewrite (the A/A pair that bounds the noise) and the candidate? The gate, the counts and the trajectory
# probe compare values and frame counts; none of them looked at the time between frames, which is what a person feels as lag.
# Docs: docs/team/tools/smoothness-probe.md; code: packages/gate-breakpoints/src/smooth/; the verdict rule is Lean's
# (lean/Fw/Gate/Smooth.lean, golden packages/contracts/golden/gate/smooth.jsonl, twin src/smooth/reduce.mjs).
# Engine: Chrome Headless Shell (the counts lane's pinned browser) on ubuntu-24.04-arm, on its normal vsync (no BeginFrameControl, no
# frozen clock, native requestAnimationFrame). Each leg is one width; every window is read by an in-page rAF recorder and, in extra
# traced repeats, by Chromium's frame trace. WebKit is not run on Linux (about 150 ms frames in software: the runner's cadence, not
# Safari's). Task smoothness-webkit-cadence adds two macOS jobs, run only when the head commit carries `[webkit-cadence]` (the Chromium
# `cadence` job is then skipped): `webkit-mac` (Playwright WebKit on macos-26, a real wheel) and `webkit-sim` (Mobile Safari in the iOS
# Simulator on xcode-27, scripted hero scroll, end push by real touches). Each runs every arm in one job and records the WebKit Timeline per frame and zone
# (lean/Fw/Measure/WebKitProfile.lean, twin packages/measure-webkit/src/profile/reduce.mjs); both have a cap row in Fw.Ci.Pool.Caps.
# A head commit that also carries `[earn-bound]` (task earn-bound-arm) runs only `base`, `aa` and the probe-only `bound` arm (the faithful page with
# the earn button's transitions off, packages/gate-breakpoints/src/smooth/bound.mjs) with each half of the end push held 1400 ms; no candidate search.
# `[sim-only]` (with `[earn-bound]`) skips the macOS leg and runs 6 reps per simulator job (36 windows; a job needs 5 kept finish windows per arm to decide, and the Simulator tends to die after about 30 to 40 windows).
# Tables: `node packages/measure-webkit/src/profile/cli.mjs report` over the downloaded artifacts smoothness-webkit-mac-N / -sim-N (N = the matrix job, 1 to 3).
# Inputs of a ci/* push: the `[trajectory ...]` line of the head commit, parsed by the Lean-checked parser .github/scripts/trajectory-line.mjs
# (preset or fw picks the candidate, widths the legs; empty widths = 390 and 1280; the engines key is ignored).
# The artifact of a leg is `smoothness-<width>-<set>`; each of the three sets of a width is its own job on its own runner (an independent noise sample); the table is built from downloaded runs: `node src/smooth/cli.mjs cadence`.
# CPU throttle (task smoothness-cpu-throttle): the cadence job can run with CDP Emulation.setCPUThrottlingRate 6 (control 1, the default) on the scripted
# scroll only. A PROXY of the lag felt on WebKit (iPhone), never WebKit evidence. A dispatch sets the `cpu_throttle` input; a ci/* push cannot take
# inputs, so its head commit says `[cpu-throttle=6]` (no token = 1). Only 1 and 6 pass. Under a throttle no traced reps run (they never enter the verdict).
on:
  push:
    branches: ['ci/**']
  workflow_dispatch:
    inputs:
      cpu_throttle:
        description: CPU throttle of the cadence windows (1 = control, 6 = the proxy of a slow phone CPU)
        type: choice
        options: ['1', '6']
        default: '1'
      fw:
        description: Flag set of the candidate arm, e.g. morph.tween:scroll-lock,nav:earn-no-transition (becomes ?fw=...). Empty = the default config.
        type: string
        default: ''
      widths:
        description: Widths of the legs
        type: string
        default: '390,1280'

permissions:
  contents: read

env:
  # Same pinned browser as packages/measure-chromium/Dockerfile.
  HS_VERSION: 156.0.8078.4
  HS_SHA256: 81ab9d4d3c301dc5fdfb6c541b9e6632b16fc819a6a854460f40a76fe2b2c476

jobs:
  # Guard (Lean Fw.Ci.Intent + Fw.Ci.Trigger, scripts/ci-paths.mjs). On a ci/* push it, and so every job, is skipped unless
  # the head commit asks for this lane (`[ci:<lane>]`; the default lane lean always); then it runs the workflow only if
  # the commit is the branch tip, is not on main yet, and (lean: always) some file that differs from main on the whole
  # branch is an input. A main push starts no run; dispatches always run. Fails open.
  # Every other job re-checks the tip first (`stale:` fails it) and has its own group, never cancelled on ci/*.
  guard:
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/ci/') || contains(github.event.head_commit.message, '[ci:smoothness]') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - id: g
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          GUARD_TOKEN: ${{ github.token }}
        run: node .github/scripts/changed-inputs.mjs --workflow .github/workflows/smoothness.yml
      - name: 'decision: run'
        if: steps.g.outputs.run == 'true'
        run: 'true'
      - name: 'decision: skip: ${{ steps.g.outputs.reason }}'
        if: steps.g.outputs.run != 'true'
        run: 'true'

  # The rewrite, built once; every leg downloads this exact build. The candidate's search and the widths are decided here.
  site:
    needs: [guard]
    if: ${{ needs.guard.outputs.run == 'true' }}
    concurrency:
      group: ci-lane:smoothness:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:site:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    outputs:
      legs: ${{ steps.p.outputs.legs }}
      search: ${{ steps.p.outputs.search }}
      throttle: ${{ steps.t.outputs.throttle }}
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/telemetry
        with:
          mode: start
          label: site
      - id: in
        name: Read the inputs (the commit line)
        env:
          EVENT: ${{ github.event_name }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
          LANE: smoothness  # Lean ProbeLane: the mark rule does not bind this lane (its verdict is at 390,1280)
          FW: ${{ inputs.fw }}  # a dispatch carries its inputs; a push reads the commit line instead
          WIDTHS: ${{ inputs.widths }}
        run: |
          set -euo pipefail
          node --test .github/scripts/trajectory-line.test.mjs  # the line parser equals Lean pushProbe
          node .github/scripts/trajectory-line.mjs | tee -a "$GITHUB_OUTPUT"
      - id: t
        name: The CPU throttle (dispatch input, else the head commit's [cpu-throttle=N]; 1 or 6)
        env:
          THROTTLE_IN: ${{ inputs.cpu_throttle }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          t="$THROTTLE_IN"
          if [ -z "$t" ]; then t=$(printf '%s\n' "$HEAD_MSG" | grep -oiE '\[cpu-throttle=[0-9]+\]' | head -n 1 | tr -dc '0-9' || true); fi
          t="${t:-1}"
          case "$t" in 1|6) ;; *) echo "smoothness: refused: the CPU throttle must be 1 or 6, got '$t'" >&2; exit 1 ;; esac
          echo "throttle=$t" >> "$GITHUB_OUTPUT"
          echo "smoothness: CPU throttle ${t}x (PROXY, not WebKit)" | tee -a "$GITHUB_STEP_SUMMARY"
      - id: p
        name: Plan the legs (widths) and the candidate search
        env:
          FW: ${{ steps.in.outputs.fw }}
          PRESET: ${{ steps.in.outputs.preset }}
          WIDTHS: ${{ steps.in.outputs.widths }}
        run: |
          set -euo pipefail
          node --test .github/scripts/gate-search.test.mjs  # the search decision equals Fw.Gate.Search
          search=$(node .github/scripts/gate-search.mjs --fw "$FW" --preset "$PRESET")
          legs=$(jq -cn --arg w "${WIDTHS:-390,1280}" '{width: ($w | split(",") | map(tonumber)), set: [1, 2, 3]}')
          echo "search=$search" >> "$GITHUB_OUTPUT"
          echo "legs=$legs" >> "$GITHUB_OUTPUT"
          echo "smoothness: search='$search' legs=$legs" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/setup-lean
      - uses: ./.github/actions/telemetry
        with:
          mode: cache
          cache-dirs: lake=${{ github.workspace }}/.lake-cache
      # `pnpm build` of the site first runs `lake exe breakgen --check` (the checked-in gen file must equal Lean's output).
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@fw/site...'
      # A `[webkit-cadence]` commit builds the candidate's query as one more page (the WebKit legs serve it). A `[cpu-throttle=N]` commit or a dispatch
      # with the `cpu_throttle` input does too, so a flag set that is not a prerendered preset or single flag (a real flag arm) can be the candidate; other commits build the default only.
      - name: Build the rewrite (default prerendered config)
        env:
          SEARCH: ${{ steps.p.outputs.search }}
          WEBKIT: ${{ (contains(github.event.head_commit.message, '[webkit-cadence]') || contains(github.event.head_commit.message, '[cpu-throttle=') || inputs.cpu_throttle != '') && 'yes' || 'no' }}
        run: |
          set -euo pipefail
          if [ "$WEBKIT" = yes ] && [ -n "$SEARCH" ]; then pnpm --filter @fw/site build --config "$SEARCH"; else pnpm --filter @fw/site build; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: apps/site/dist/aot
          if-no-files-found: error
          retention-days: 3
      - uses: ./.github/actions/telemetry
        if: ${{ (always()) && steps.stale.outcome == 'skipped' }}
        with:
          mode: finish
          label: site

  # One job per width and set (three sets per width, each on its own runner): all four arms, interleaved per repeat, in Chrome Headless Shell on the runner's normal vsync.
  cadence:
    needs: [site]
    if: ${{ !contains(github.event.head_commit.message, '[webkit-cadence]') }}
    concurrency:
      group: ci-lane:smoothness:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:cadence:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    name: cadence ${{ matrix.width }} set ${{ matrix.set }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.site.outputs.legs) }}
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@fw/gate-breakpoints'
      - uses: ./.github/actions/telemetry
        with:
          mode: start
          label: cadence-${{ matrix.width }}-${{ matrix.set }}
      - name: Verify the snapshot against snapshot.lock.json
        run: node .github/scripts/verify-snapshot.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: apps/site/dist/aot
      - uses: ./.github/actions/gate-engine
        with:
          engine: chromium
      - name: Smoke test the engine (fails in under two minutes instead of burning the job budget)
        env:
          FW_SNAPSHOT_SITE: ${{ github.workspace }}/snapshot/site
          FW_SITE_DIST: ${{ github.workspace }}/apps/site/dist/aot
          FW_SEARCH: ${{ needs.site.outputs.search }}
          SMOKE: ${{ github.workspace }}/.github/scripts/gate-smoke.mjs
        working-directory: packages/gate-breakpoints
        timeout-minutes: 5
        run: node "$SMOKE" --engine chromium
      - name: Check the golden the verdict rule is replayed against
        working-directory: packages/gate-breakpoints
        run: node --test test/smooth.test.mjs
      - name: Walk the windows (all four arms, interleaved per repeat) and write the cadence file
        env:
          WIDTH: ${{ matrix.width }}
          SEARCH: ${{ needs.site.outputs.search }}
          FW_SNAPSHOT_SITE: ${{ github.workspace }}/snapshot/site
          FW_SITE_DIST: ${{ github.workspace }}/apps/site/dist/aot
          # Repeats that enter the verdict (Lean minReps is 5) and extra repeats with the frame trace on (reported apart; none under a throttle).
          REPS: 7
          CPU_THROTTLE: ${{ needs.site.outputs.throttle }}
        working-directory: packages/gate-breakpoints
        run: |
          set -euo pipefail
          trace_reps=5
          if [ "$CPU_THROTTLE" != 1 ]; then trace_reps=0; fi
          node src/smooth/cli.mjs run --widths "$WIDTH" --search "$SEARCH" --reps "$REPS" --trace-reps "$trace_reps" --cpu-throttle "$CPU_THROTTLE" --out out/smoothness
      - name: Table of this leg (the verdict is the Lean twin; the step summary is a convenience, the artifact is the record)
        if: ${{ (!cancelled()) && steps.stale.outcome == 'skipped' }}
        env:
          RUN_ID: ${{ github.run_id }}
        working-directory: packages/gate-breakpoints
        run: |
          set -euo pipefail
          mkdir -p "out/leg/$RUN_ID/leg"
          cp out/smoothness/cadence-*.json "out/leg/$RUN_ID/leg/"
          node src/smooth/cli.mjs cadence --runs out/leg --out out/smoothness
          cat out/smoothness/cadence.table.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ (!cancelled()) && steps.stale.outcome == 'skipped' }}
        with:
          name: smoothness-${{ matrix.width }}-${{ matrix.set }}
          path: packages/gate-breakpoints/out/smoothness
          if-no-files-found: error
          retention-days: 30
      - uses: ./.github/actions/telemetry
        if: ${{ (always()) && steps.stale.outcome == 'skipped' }}
        with:
          mode: finish
          label: cadence-${{ matrix.width }}-${{ matrix.set }}

  # Leg 1 of smoothness-webkit-cadence: Playwright WebKit on a macOS runner, one browser for all arms (orig, base, aa, look, v2 when its
  # flags differ), a real wheel, the WebKit Timeline per frame and zone. Three jobs in a row (matrix `job`, max-parallel 1): the class counts and the
  # agreement over jobs need three separate jobs; each job writes its raw windows (`mac.raw.json.gz`) beside the leg file.
  webkit-mac:
    needs: [site]
    if: ${{ contains(github.event.head_commit.message, '[webkit-cadence]') && !contains(github.event.head_commit.message, '[sim-only]') }}
    concurrency:
      group: ci-lane:smoothness:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:webkit-mac:${{ strategy.job-index }}
    runs-on: macos-26
    timeout-minutes: 15
    name: webkit mac (playwright-webkit, macos-26) job ${{ matrix.job }}
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        job: [1, 2, 3]
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@fw/gate-breakpoints'
      - name: Verify the snapshot against snapshot.lock.json
        run: node .github/scripts/verify-snapshot.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: apps/site/dist/aot
      - name: Playwright WebKit (macOS build; no system libraries to install)
        working-directory: packages/gate-breakpoints
        run: pnpm exec playwright-core install webkit
      - name: Walk the windows (all arms, interleaved per repeat), record the Timeline, write mac.json
        env:
          SEARCH: ${{ needs.site.outputs.search }}
          FW_SNAPSHOT_SITE: ${{ github.workspace }}/snapshot/site
          FW_SITE_DIST: ${{ github.workspace }}/apps/site/dist/aot
          # Timeline-on repeats (the profile) and Timeline-off repeats (the cadence, reported apart).
          REPS: ${{ contains(github.event.head_commit.message, '[earn-bound]') && '8' || '6' }}
          CADENCE_REPS: 5
          # `[earn-bound]` (task earn-bound-arm): base, aa and the probe-only bound arm only, end-push halves held 1400 ms (no candidate search needed);
          # two more Timeline repeats than usual so a refused window leaves the five the Lean verdict needs.
          ARMS: ${{ contains(github.event.head_commit.message, '[earn-bound]') && 'base,aa,bound' || '' }}
          HOLD_MS: ${{ contains(github.event.head_commit.message, '[earn-bound]') && '1400' || '' }}
        working-directory: packages/gate-breakpoints
        run: |
          set -euo pipefail
          mkdir -p out/smoothness-webkit
          { sw_vers; sysctl -n machdep.cpu.brand_string; sysctl -n hw.ncpu; } > out/smoothness-webkit/mac-tools.txt 2>&1 || true
          node src/smooth/cli.mjs webkit --width 390 --search "$SEARCH" --reps "$REPS" --cadence-reps "$CADENCE_REPS" ${ARMS:+--arms "$ARMS"} ${HOLD_MS:+--hold-ms "$HOLD_MS"} --out out/smoothness-webkit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ (!cancelled()) && steps.stale.outcome == 'skipped' }}
        with:
          name: smoothness-webkit-mac-${{ matrix.job }}
          path: packages/gate-breakpoints/out/smoothness-webkit
          if-no-files-found: error
          retention-days: 30

  # Leg 2: Mobile Safari in the iOS Simulator (the pinned runtime of check-simulator.sh), one session, every arm on one origin, the same
  # schedule scripted in the page. This job installs no packages: its code imports only modules without dependencies.
  webkit-sim:
    needs: [site]
    if: ${{ contains(github.event.head_commit.message, '[webkit-cadence]') }}
    concurrency:
      group: ci-lane:smoothness:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:webkit-sim:${{ strategy.job-index }}
    runs-on: xcode-27
    timeout-minutes: 45
    name: webkit sim (mobile safari, xcode-27) job ${{ matrix.job }}
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        job: [1, 2, 3]
    env:
      FW_IOS_VERSION: '27.0'
      FW_IOS_BUILD: 24A434
      FW_SIM_NAME: fw-iphone-27
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - name: Job clock
        run: echo "FW_JOB_START_MS=$(( $(date +%s) * 1000 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Pinned iOS runtime build, then create the device
        timeout-minutes: 8
        run: sh .github/scripts/check-simulator.sh --create
      - name: Verify the snapshot against snapshot.lock.json
        run: node .github/scripts/verify-snapshot.mjs
      - uses: ./.github/actions/telemetry
        with:
          mode: start
          label: webkit-sim
      - name: Tools (ios_webkit_debug_proxy, xcodegen)
        timeout-minutes: 8
        run: |
          set -euo pipefail
          brew install ios-webkit-debug-proxy xcodegen
          command -v ios_webkit_debug_proxy xcodegen
          brew list --versions ios-webkit-debug-proxy xcodegen
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: ${{ runner.temp }}/site
      - name: Tool and runner facts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/result"
          sh .github/scripts/runner-info.sh "$RUNNER_TEMP/result/runner.json"
          {
            sw_vers
            xcodebuild -version
            xcrun simctl list runtimes
            brew list --versions ios-webkit-debug-proxy xcodegen
          } | tee "$RUNNER_TEMP/result/tools.txt"
      # The end-of-page push is a real swipe (the XCUITest driver of the toolbar-throttle probe), built before the Simulator boots like
      # there. A failed build is not fatal: the sim leg then pushes with the synthetic wheel and its sim.json says so.
      - name: Build the touch driver (no Simulator booted)
        continue-on-error: true
        timeout-minutes: 10
        working-directory: packages/measure-webkit
        run: |
          set -euo pipefail
          node src/throttle/cli.mjs build-driver --dir "$RUNNER_TEMP/touch-driver"
          uptime
      - name: Boot the Simulator (kept booted for the whole job)
        timeout-minutes: 10
        run: |
          set -euo pipefail
          xcrun simctl shutdown all || true
          udid=$(cat "$RUNNER_TEMP/fw-sim-udid.txt")
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
      # Lean Fw.Measure.WalkBudget: the walk may run until job start + timeout - post steps - grace - slack, and its step timeout ends inside it.
      # `[sim-walk-cap=N]` in the commit message (job 1 only) cuts the walk N minutes after it starts, to prove the cut path.
      - name: Walk budget
        id: budget
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          JOB: ${{ matrix.job }}
        working-directory: packages/measure-webkit
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/result"
          cap=$(printf '%s' "${COMMIT_MSG:-}" | sed -n 's/.*\[sim-walk-cap=\([0-9][0-9]*\)\].*/\1/p' | head -1)
          if [ "$JOB" != 1 ]; then cap=""; fi
          node src/walk-budget.mjs --job-start-ms "$FW_JOB_START_MS" ${cap:+--cap-min "$cap"} | tee -a "$GITHUB_OUTPUT" | tee "$RUNNER_TEMP/result/walk-budget.txt"
      - name: Walk the windows (all arms, one session), record the Timeline, write sim.json
        if: ${{ steps.budget.outputs.run == 'true' }}
        timeout-minutes: ${{ fromJSON(steps.budget.outputs.step_minutes) }}
        env:
          SEARCH: ${{ needs.site.outputs.search }}
          SITE_DIR: ${{ runner.temp }}/site
          FW_SNAPSHOT_SITE: ${{ github.workspace }}/snapshot/site
          REPS: ${{ contains(github.event.head_commit.message, '[sim-only]') && '6' || contains(github.event.head_commit.message, '[earn-bound]') && '7' || '5' }}
          # The runner boots Safari several times slower than a Mac: every wait in packages/measure-webkit is scaled (counts do not depend on waits).
          FW_WK_TIMEOUT_SCALE: '8'
          FW_WK_ATTEMPTS: '3'
          # `[earn-bound]`: see the macOS leg.
          ARMS: ${{ contains(github.event.head_commit.message, '[earn-bound]') && 'base,aa,bound' || '' }}
          HOLD_MS: ${{ contains(github.event.head_commit.message, '[earn-bound]') && '1400' || '' }}
        working-directory: packages/measure-webkit
        run: |
          set -euo pipefail
          node src/profile/cli.mjs sim --site "$SITE_DIR" --search "$SEARCH" --reps "$REPS" ${ARMS:+--arms "$ARMS"} ${HOLD_MS:+--hold-ms "$HOLD_MS"} --touch-driver "$RUNNER_TEMP/touch-driver" --deadline-ms "${{ steps.budget.outputs.deadline_ms }}" --out "$RUNNER_TEMP/result" 2> >(tee "$RUNNER_TEMP/result/sim.log" >&2)
      - name: Keep host state
        if: ${{ always() && steps.stale.outcome == 'skipped' }}
        timeout-minutes: 3
        run: |
          mkdir -p "$RUNNER_TEMP/result"
          bounded() { perl -e 'alarm 20; exec @ARGV' -- "$@"; }
          { uptime; bounded xcrun simctl list devices booted; ps -axo pid,pcpu,rss,comm | sort -k2 -nr | head -15; } > "$RUNNER_TEMP/result/host.txt" 2>&1 || true
      - name: Shut down and delete the Simulator
        if: ${{ always() && steps.stale.outcome == 'skipped' }}
        timeout-minutes: 2
        run: |
          xcrun simctl shutdown all || true
          xcrun simctl delete "$FW_SIM_NAME" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && steps.stale.outcome == 'skipped' }}
        timeout-minutes: 2
        with:
          name: smoothness-webkit-sim-${{ matrix.job }}
          path: ${{ runner.temp }}/result
          if-no-files-found: warn
          retention-days: 30
      - uses: ./.github/actions/telemetry
        if: ${{ (always()) && steps.stale.outcome == 'skipped' }}
        timeout-minutes: 2
        with:
          mode: finish
          label: webkit-sim
