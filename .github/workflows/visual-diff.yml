name: visual-diff

# Pixel diff of the original snapshot against the rewrite (task visual-diff): each part's box is screenshotted in both
# arms at the gate's breakpoints, compared with pixelmatch, and judged by the Lean rule (lean/Fw/Gate/Pixel.lean:
# pass, fail, unsettled, invalid (fonts or images not loaded) or nc per part tolerance). It sees what the breakpoint gate's computed styles cannot: a fallback font
# drawing other glyphs, stacking order, paint. Diff images are CI artifacts only; nothing here writes into git.
# Engines: Chrome Headless Shell 156.0.8078.4 and Playwright WebKit on Linux (a WebKitGTK/WPE port, NOT Mobile Safari),
# installed by the gate-engine action; two separate engine keys, as in the breakpoint gate.
on:
  push:
    branches: ['ci/**']
  workflow_dispatch:
    inputs:
      engines:
        description: Engines to run
        type: choice
        options: [both, chromium, playwright-webkit]
        default: both
      shards:
        description: Shards per engine (1 to 16)
        type: string
        default: '2'
      probes:
        description: >-
          Probe ids of the gate's Lean matrix, comma separated (for example desk-1512,touch-401); empty = the default
          breakpoint set in packages/visual-diff/probes.default.json
        type: string
        default: ''
      parts:
        description: >-
          Part ids of the gate's anchors.json, comma separated; empty = every part except those whose first role is the
          document itself (engine.scroll, morph.tween).
        type: string
        default: ''
      fw:
        description: >-
          Flag set of the rewrite arm, e.g. morph.tween:waapi (becomes ?fw=...; the build prerenders every single-variant
          page). Empty = the default config.
        type: string
        default: ''
      assets:
        description: >-
          none = the port as built, its own fonts and assets (the default and the only mode that judges the port).
          inject = a named diagnostic: the original's images and fonts are served to the rewrite arm and a font-family is forced.
        type: choice
        options: [none, inject]
        default: none
      navscroll:
        description: >-
          Also run the nav scroll-hide probe (job navscroll: both engines, about 22 min WebKit and 7 min Chromium). Off by
          default; the probe is an investigation, not part of the visual diff.
        type: boolean
        default: false
      peoplelayout:
        description: >-
          Also run the people-section layout probe (job people-layout: both engines, original against port at 1920, 1440, 1280,
          861 and 401 px; records, tables and the layout-shift list are the artifact people-layout-<engine>). Off by default.
        type: boolean
        default: false


permissions:
  contents: read

env:
  # Same pinned browser as packages/measure-chromium/Dockerfile.
  HS_VERSION: 156.0.8078.4
  HS_SHA256: 81ab9d4d3c301dc5fdfb6c541b9e6632b16fc819a6a854460f40a76fe2b2c476

jobs:
  # Guard (Lean Fw.Ci.Intent + Fw.Ci.Trigger, scripts/ci-paths.mjs). On a ci/* push it, and so every job, is skipped unless
  # the head commit asks for this lane (`[ci:<lane>]`; the default lane lean always); then it runs the workflow only if
  # the commit is the branch tip, is not on main yet, and (lean: always) some file that differs from main on the whole
  # branch is an input. A main push starts no run; dispatches always run. Fails open.
  # Every other job re-checks the tip first (`stale:` fails it) and has its own group, never cancelled on ci/*.
  guard:
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/ci/') || contains(github.event.head_commit.message, '[ci:visual-diff]') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - id: g
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          GUARD_TOKEN: ${{ github.token }}
        run: node .github/scripts/changed-inputs.mjs --workflow .github/workflows/visual-diff.yml
      - name: 'decision: run'
        if: steps.g.outputs.run == 'true'
        run: 'true'
      - name: 'decision: skip: ${{ steps.g.outputs.reason }}'
        if: steps.g.outputs.run != 'true'
        run: 'true'

  plan:
    needs: [guard]
    if: ${{ needs.guard.outputs.run == 'true' }}
    concurrency:
      group: ci-lane:visual-diff:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:plan:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.p.outputs.shards }}
      engines: ${{ steps.p.outputs.engines }}
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            apps/site/src/breakpoints.gen.json
            packages/gate-breakpoints/src/anchors.json
            packages/visual-diff
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - id: p
        env:
          ENGINES: ${{ inputs.engines || 'both' }}
          SHARDS: ${{ inputs.shards || '2' }}
          PROBES: ${{ inputs.probes || '' }}
          PARTS: ${{ inputs.parts || '' }}
        run: |
          set -euo pipefail
          case "$SHARDS" in ''|*[!0-9]*) echo "shards must be a number" >&2; exit 1 ;; esac
          case "$ENGINES" in
            both) engines='["chromium","playwright-webkit"]' ;;
            chromium) engines='["chromium"]' ;;
            playwright-webkit) engines='["playwright-webkit"]' ;;
            *) echo "bad engines" >&2; exit 1 ;;
          esac
          shards=$(node packages/visual-diff/src/shards.mjs --shards "$SHARDS" --probes "$PROBES" --parts "$PARTS")
          echo "engines=$engines" >> "$GITHUB_OUTPUT"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "$engines"
          echo "$shards"

  # The rewrite, built once; every shard downloads this exact build.
  site:
    needs: [guard]
    if: ${{ needs.guard.outputs.run == 'true' }}
    concurrency:
      group: ci-lane:visual-diff:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:site:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lean
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@fw/site...'
      - name: Build the rewrite (default prerendered config)
        run: pnpm --filter @fw/site build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: apps/site/dist/aot
          if-no-files-found: error
          retention-days: 3

  # Port completeness gate (task port-completeness-gate; Lean Fw.Port.*, Fw.Site.Assets): the site's built-page tests
  # on the fresh dist/aot. Checks 3 (assets) and 4 (svg skeleton) stay advisory (continue-on-error) until the gap lanes
  # land: the step fails while the port is incomplete, the job does not. The golden replay and head tests do gate.
  port:
    needs: [site]
    if: ${{ !cancelled() && needs.site.result == 'success' }}
    concurrency:
      group: ci-lane:visual-diff:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:port:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@fw/site...'
      - name: Verify the snapshot against snapshot.lock.json
        run: node .github/scripts/verify-snapshot.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: apps/site/dist/aot
      - name: Port goldens (Lean vectors; built-page tests skip)
        run: node --test 'apps/site/test/port-*.test.mjs'
      - name: Port digest report
        run: |
          mkdir -p "$RUNNER_TEMP/port"
          node scripts/port/digest.mjs --dist apps/site/dist/aot --out "$RUNNER_TEMP/port/report.json" | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: 'Port gate on the built page (advisory)'
        id: gate
        continue-on-error: true
        env:
          FW_SITE_DIST: ${{ github.workspace }}/apps/site/dist/aot
        run: node --test 'apps/site/test/port-*.test.mjs'
      - name: Head tests on the built page
        env:
          FW_SITE_DIST: ${{ github.workspace }}/apps/site/dist/aot
        working-directory: apps/site
        run: |
          if [ -f src/head.test.ts ]; then pnpm exec vitest run src/head.test.ts; else echo "src/head.test.ts is not on this commit"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ (!cancelled()) && steps.stale.outcome == 'skipped' }}
        with:
          name: port-report
          path: ${{ runner.temp }}/port
          if-no-files-found: error
          retention-days: 14

  shoot:
    needs: [plan, site]
    concurrency:
      group: ci-lane:visual-diff:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:shoot:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJSON(needs.plan.outputs.engines) }}
        shard: ${{ fromJSON(needs.plan.outputs.shards).shard }}
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@fw/gate-breakpoints @fw/visual-diff @fw/premise-tests'
      - name: Verify the snapshot against snapshot.lock.json
        run: node .github/scripts/verify-snapshot.mjs
      # The gate-engine action installs its browser through the gate package's playwright-core (same pinned version as ours).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: apps/site/dist/aot
      - uses: ./.github/actions/gate-engine
        with:
          engine: ${{ matrix.engine }}
      - name: Unit tests (Lean golden vectors, diff counts)
        working-directory: packages/visual-diff
        run: pnpm test
      - name: Screenshot, compare, judge
        env:
          ENGINE: ${{ matrix.engine }}
          PROBES: ${{ fromJSON(needs.plan.outputs.shards).probes[matrix.shard] }}
          PARTS: ${{ inputs.parts || '' }}
          FW_SNAPSHOT_SITE: ${{ github.workspace }}/snapshot/site
          FW_SITE_DIST: ${{ github.workspace }}/apps/site/dist/aot
          FW_FLAGS: ${{ inputs.fw || '' }}
          ASSETS: ${{ inputs.assets || 'none' }}
        working-directory: packages/visual-diff
        run: |
          parts_args=()
          if [ -n "$PARTS" ]; then parts_args=(--parts "$PARTS"); fi
          node src/cli.mjs run --engine "$ENGINE" --probes "$PROBES" --concurrency 2 --assets "$ASSETS" ${parts_args[@]+"${parts_args[@]}"} --out out/shard
      - name: Earn button frames (task nav-cta-webkit-match; first shard only, compared offline)
        if: ${{ !cancelled() && steps.stale.outcome == 'skipped' && matrix.shard == 's0' }}
        env:
          ENGINE: ${{ matrix.engine }}
        working-directory: packages/premise-tests
        run: node src/earn-frames.mjs --engine "$ENGINE" --out out-earn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.stale.outcome == 'skipped' && matrix.shard == 's0' }}
        with:
          name: earn-frames-${{ matrix.engine }}
          path: packages/premise-tests/out-earn
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ (!cancelled()) && steps.stale.outcome == 'skipped' }}
        with:
          # the counts and verdicts (<engine>.visual.json) and the original/rewrite/diff PNGs of every cell that is not a pass
          name: vd-${{ matrix.engine }}-${{ matrix.shard }}
          path: packages/visual-diff/out/shard
          if-no-files-found: error
          retention-days: 14

  # Port completeness check 5 (fonts; Lean Fw.Port.Fonts, golden fonts.jsonl): per gate viewport and engine, both arms are loaded and
  # every text leaf's computed first font family, weight and style and the loaded faces of document.fonts are compared. The
  # step on the built page stays advisory (continue-on-error) like checks 3 and 4; the golden replay and the probe pages gate.
  port-fonts:
    needs: [plan, site]
    concurrency:
      group: ci-lane:visual-diff:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:port-fonts:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJSON(needs.plan.outputs.engines) }}
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@fw/gate-breakpoints @fw/visual-diff'
      - name: Verify the snapshot against snapshot.lock.json
        run: node .github/scripts/verify-snapshot.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: apps/site/dist/aot
      - uses: ./.github/actions/gate-engine
        with:
          engine: ${{ matrix.engine }}
      - name: Port check 5 tests (Lean golden vectors, probe pages in the browser)
        env:
          FW_PORT_FONTS_ENGINE: ${{ matrix.engine }}
          FW_SNAPSHOT_SITE: ${{ github.workspace }}/snapshot/site
        run: node --test apps/site/test/port-fonts.test.mjs
      - name: 'Port check 5 on the built page (advisory)'
        id: fonts
        continue-on-error: true
        env:
          ENGINE: ${{ matrix.engine }}
          PROBES: ${{ inputs.probes || '' }}
          FW_SNAPSHOT_SITE: ${{ github.workspace }}/snapshot/site
          FW_SITE_DIST: ${{ github.workspace }}/apps/site/dist/aot
        working-directory: packages/visual-diff
        run: |
          set -o pipefail
          probe_args=()
          if [ -n "$PROBES" ]; then probe_args=(--probes "$PROBES"); fi
          node src/cli.mjs fonts --engine "$ENGINE" --concurrency 2 ${probe_args[@]+"${probe_args[@]}"} --out out/fonts | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ (!cancelled()) && steps.stale.outcome == 'skipped' }}
        with:
          name: port-fonts-${{ matrix.engine }}
          path: packages/visual-diff/out/fonts
          if-no-files-found: error
          retention-days: 14

  # Nav scroll-hide probe (task nav-scroll-hide-check): the nav against the people section, original vs rewrite, desktop widths,
  # one job per engine; records and tables are the artifact nav-scroll-<engine>. Dispatch with -f navscroll=true.
  navscroll:
    # only on a dispatch that sets the navscroll input; every other run (push, schedule, plain dispatch) skips it
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.navscroll }}
    needs: [site]
    concurrency:
      group: ci-lane:visual-diff:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:navscroll:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, playwright-webkit]
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@fw/gate-breakpoints @fw/visual-diff'
      - name: Verify the snapshot against snapshot.lock.json
        run: node .github/scripts/verify-snapshot.mjs
      # The gate-engine action installs its browser through the gate package's playwright-core (same pinned version as ours).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: apps/site/dist/aot
      - uses: ./.github/actions/gate-engine
        with:
          engine: ${{ matrix.engine }}
      - name: Unit tests (Lean golden vectors, diff counts)
        working-directory: packages/visual-diff
        run: pnpm test
      - name: Nav scroll-hide probe
        env:
          ENGINE: ${{ matrix.engine }}
          FW_SNAPSHOT_SITE: ${{ github.workspace }}/snapshot/site
          FW_SITE_DIST: ${{ github.workspace }}/apps/site/dist/aot
        working-directory: packages/visual-diff
        run: |
          node src/cli.mjs nav-scroll --engine "$ENGINE" --out out/navscroll
          node src/cli.mjs nav-scroll-report --in out/navscroll --out out/navscroll/report | tee -a "$GITHUB_STEP_SUMMARY" > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ (!cancelled()) && steps.stale.outcome == 'skipped' }}
        with:
          name: nav-scroll-${{ matrix.engine }}
          path: packages/visual-diff/out/navscroll
          if-no-files-found: error
          retention-days: 14

  # People-section layout probe (task people-layout-shift): every box of #people, original vs port, per width, plus the layout
  # shifts over a scroll through the section; one job per engine, artifact people-layout-<engine>. Dispatch with -f peoplelayout=true.
  people-layout:
    # only on a dispatch that sets the peoplelayout input; every other run (push, schedule, plain dispatch) skips it
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.peoplelayout }}
    needs: [site]
    concurrency:
      group: ci-lane:visual-diff:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:people-layout:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, playwright-webkit]
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          filter: '@fw/gate-breakpoints @fw/visual-diff'
      - name: Verify the snapshot against snapshot.lock.json
        run: node .github/scripts/verify-snapshot.mjs
      # The gate-engine action installs its browser through the gate package's playwright-core (same pinned version as ours).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: apps/site/dist/aot
      - uses: ./.github/actions/gate-engine
        with:
          engine: ${{ matrix.engine }}
      - name: Unit tests (Lean golden vectors, diff counts)
        working-directory: packages/visual-diff
        run: pnpm test
      - name: People layout probe
        env:
          ENGINE: ${{ matrix.engine }}
          FW_SNAPSHOT_SITE: ${{ github.workspace }}/snapshot/site
          FW_SITE_DIST: ${{ github.workspace }}/apps/site/dist/aot
        working-directory: packages/visual-diff
        run: |
          node src/cli.mjs people-layout --engine "$ENGINE" --out out/people-layout
          node src/cli.mjs people-layout-report --in out/people-layout --out out/people-layout/report > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ (!cancelled()) && steps.stale.outcome == 'skipped' }}
        with:
          name: people-layout-${{ matrix.engine }}
          path: packages/visual-diff/out/people-layout
          if-no-files-found: error
          retention-days: 14

  report:
    needs: [plan, shoot]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    concurrency:
      group: ci-lane:visual-diff:${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.ref || github.run_id }}:report:${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: 'tip re-check'
        id: tip
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          t=$(git -c "http.extraheader=$auth" ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF" 2>/dev/null | cut -f1) || t=""
          if [ -n "$t" ] && [ "$t" != "$GITHUB_SHA" ]; then echo "tip=false" >> "$GITHUB_OUTPUT"; echo "branch tip $t is not $GITHUB_SHA"; else echo "tip=true" >> "$GITHUB_OUTPUT"; echo "branch tip: ${t:-unreadable, counts as the tip}"; fi
      - name: 'stale: a newer push is the branch tip'
        id: stale
        if: ${{ steps.tip.outputs.tip == 'false' }}
        shell: bash
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: packages/visual-diff
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vd-*
          path: ${{ runner.temp }}/parts
      - name: Merge the shards into one table
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/report"
          node packages/visual-diff/src/cli.mjs report --in "$RUNNER_TEMP/parts" --out "$RUNNER_TEMP/report/visual-diff" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diff-report
          path: ${{ runner.temp }}/report
          if-no-files-found: error
          retention-days: 30
