# xctrace-ci-probe: the smallest Xcode project that can run an XCUITest (xcodegen generates the .xcodeproj on the runner).
# The test drives Mobile Safari (bundle id com.apple.mobilesafari) in the Simulator and measures it with XCTHitchMetric
# (XCTest.framework/Headers/XCTMetric.h:376-386, XCTMetric+UIAutomation.h:60-74, Xcode 27.1 SDK: macOS/iOS 26.0 and later).
name: HitchProbe
options:
  bundleIdPrefix: probe.fw
  deploymentTarget:
    iOS: '26.0'
targets:
  HostApp:
    type: application
    platform: iOS
    sources: [HostApp]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: probe.fw.hostapp
        CODE_SIGNING_ALLOWED: NO
  HitchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [HitchUITests]
    dependencies:
      - target: HostApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: probe.fw.hitchuitests
        TEST_TARGET_NAME: HostApp
        CODE_SIGNING_ALLOWED: NO
schemes:
  HitchProbe:
    build:
      targets:
        HostApp: all
        HitchUITests: [test]
    test:
      targets: [HitchUITests]
