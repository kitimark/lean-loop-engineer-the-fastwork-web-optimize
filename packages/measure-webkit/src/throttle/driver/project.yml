name: FwThrottleDriver
options:
  bundleIdPrefix: dev.fastwork-study
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    GENERATE_INFOPLIST_FILE: "YES"
targets:
  Host:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fastwork-study.throttle-host
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
  DriverUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Host
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fastwork-study.throttle-driver
        TEST_TARGET_NAME: Host
schemes:
  FwThrottleDriver:
    build:
      targets:
        Host: all
        DriverUITests: [test]
    test:
      targets: [DriverUITests]
