<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>V-n fixture: main-thread animation (control)</title>
<style>
  body { margin: 0; }
  #a { height: 100px; background: #36c; animation: grow 2s linear infinite; }
  #b { width: 100px; height: 100px; background: #c63; animation: tint 3s linear infinite; }
  @keyframes grow { from { width: 100px; } to { width: 400px; } }
  @keyframes tint { from { background-color: #c63; } to { background-color: #3c6; } }
</style></head>
<body><div id="a"></div><div id="b"></div></body></html>
