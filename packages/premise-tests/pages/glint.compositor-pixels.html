<!doctype html>
<meta charset="utf-8">
<title>glint.compositor-pixels</title>
<style>
  /* Four dashes of 94 x 3.2 CSS px at integer positions: the original's SVG dash (a rounded line stroked with a gradient whose
     x1/x2 are animated by two repeating <animate>), then platform.glint:compositor (a clip of the same rounded shape holding one
     120 px layer with the fixed gradient, moved by a transform animation), left and right dash each. Stops and key values are the
     original's (platform/Visuals.tsx, logic.ts); the layer geometry and the keyframes are read from the Lean golden platform-glint-compositor.jsonl by the test. */
  body { margin: 0; background: #131922 }
  .row { position: relative; width: 94px; height: 3.2px; margin: 0 0 26.8px 12px; top: 8px }
  svg { position: absolute; left: 0; top: 0; display: block; overflow: visible; pointer-events: none }
  .clip { position: absolute; inset: 0; clip-path: path('M1.6 0H92.4A1.6 1.6 0 0 1 92.4 3.2H1.6A1.6 1.6 0 0 1 1.6 0Z'); pointer-events: none }
  .layer { position: absolute; left: -200px; top: -2px; width: 120px; height: 7.2px }
</style>
<div class="row" id="oL"></div>
<div class="row" id="cL"></div>
<div class="row" id="oR"></div>
<div class="row" id="cR"></div>
<script>
  const NS = 'http://www.w3.org/2000/svg';
  const X1 = { left: [-200, 200, 200, 200, -200, -200], right: [-200, -200, 200, -200, -200, -200] };
  const X2 = { left: [-80, 320, 320, 320, -80, -80], right: [-80, -80, 320, -80, -80, -80] };
  const STOPS = [[0, '#84b5ff', 0], [20, '#84b5ff', 1], [40, '#0569ff', 1], [60, '#ae8eff', 1], [80, '#ffcca5', 1], [100, '#ffcca5', 0]];
  const rgba = (hex, a) => `rgb(${[1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16)).join(' ')} / ${a})`;
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.append(e); return e; };
  window.start = (kf) => {
    const origs = [];
    for (const [id, side] of [['oL', 'left'], ['oR', 'right']]) {
      const svg = el('svg', { width: 94, height: 3.2, viewBox: '0 0 94 3.2', fill: 'none' }, document.getElementById(id));
      const g = el('linearGradient', { id: `${id}-g`, gradientUnits: 'userSpaceOnUse', x1: X1[side][0], x2: X2[side][0], y1: 0, y2: 0 }, el('defs', {}, svg));
      for (const [o, c, a] of STOPS) el('stop', { offset: `${o}%`, 'stop-color': c, 'stop-opacity': a }, g);
      for (const [attr, vals] of [['x1', X1[side]], ['x2', X2[side]]]) {
        origs.push(el('animate', { attributeName: attr, begin: 'indefinite', repeatCount: 'indefinite', keyTimes: '0;0.2;0.4;0.6;0.8;1', dur: '5s', values: vals.join(';') }, g));
      }
      el('line', { x1: 1.6, y1: 1.6, x2: 92.4, y2: 1.6, 'stroke-width': 3.2, 'stroke-linecap': 'round', stroke: `url(#${id}-g)` }, svg);
    }
    window.anims = [];
    for (const [id, side] of [['cL', 'left'], ['cR', 'right']]) {
      const clip = document.createElement('span'); clip.className = 'clip';
      const layer = document.createElement('span'); layer.className = 'layer';
      layer.style.background = `linear-gradient(90deg, ${STOPS.map(([o, c, a]) => `${rgba(c, a)} ${o}%`).join(', ')})`;
      clip.append(layer); document.getElementById(id).append(clip);
      const a = layer.animate(kf.keyframes[side].map((k) => ({ offset: k.offset, transform: `translateX(${k.tx}px)` })), { duration: kf.durMs, iterations: Infinity, easing: kf.easing });
      a.pause();
      window.anims.push(a);
    }
    const svgs = [...document.querySelectorAll('svg')];
    for (const s of svgs) { s.pauseAnimations(); s.setCurrentTime(10); }
    for (const a of origs) a.beginElement();
  };
  window.seek = (t, resume) => {
    for (const s of document.querySelectorAll('svg')) {
      if (resume) s.unpauseAnimations();
      s.setCurrentTime(10 + t);
      if (resume) s.pauseAnimations();
    }
    for (const a of window.anims) a.currentTime = t * 1000;
  };
</script>
