    version: Chrome Headless Shell 156.0.8078.4 (playwright-core 1.64.1, chromium-headless-shell v1248)
    sha: f842f52ef39fd97b449eb27cff414bf05a98ddce
    status: CONFIRMED
    why: counts lane, Chromium arm (packages/measure-chromium/Dockerfile HS_VERSION)
    paths:
