# Upstream source pins (PLAN section 7.1). Fetch: node scripts/refs-fetch.mjs [<id|owner/name>] [--paths a,b]
# Checkouts land in .cache/upstream/<name>@<sha7>/ (gitignored). How each pin was verified: refs/upstream/PINS.md.
# Format (parsed by scripts/refs-fetch.mjs, a YAML subset): list items under `sources:`; scalars; `paths:` as a
# block list. sha = the commit (tags peeled), 40 lowercase hex.
sources:
