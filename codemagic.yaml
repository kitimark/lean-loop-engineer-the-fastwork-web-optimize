workflows:
  webkit-sim:
    name: webkit-sim (one count cell, original arm)
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      xcode: 27.0
      node: 24.22.0
      vars:
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
        FW_IOS_VERSION: "27.0"
        FW_IOS_BUILD: "24A434"
        FW_SIM_NAME: fw-iphone-27
        FW_WK_TIMEOUT_SCALE: "8"
        FW_WK_ATTEMPTS: "3"
        # the cell, as dispatched (fw ci pool dispatch / fw run pass these through the API; the defaults are the one-cell pilot)
        FW_TARGET: original
        FW_PRESET: original
        FW_FW: ""
        FW_VM: v1
        FW_SESSIONS: "1"
    scripts:
      - name: Node 24.22.0 first on PATH
        script: |
          set -eu
          bin=$(dirname "$(n which 24.22.0 2>/dev/null || echo "${N_PREFIX:-/usr/local}/bin/node")")
          "$bin/node" --version | grep -qx v24.22.0
          echo "PATH=$bin:$PATH" >> "$CM_ENV"
      - name: tool and runner facts
        script: |
          set -eu
          node --version | grep -qx v24.22.0
          export RUNNER_TEMP=/tmp/fw; mkdir -p "$RUNNER_TEMP/result"
          date +%s > "$RUNNER_TEMP/t0"
          {
            sw_vers
            xcodebuild -version
            xcrun simctl list runtimes
            node --version
            sysctl -n hw.ncpu hw.memsize
            uname -m
          } 2>&1 | tee "$RUNNER_TEMP/result/tools.txt"
      - name: pinned iOS runtime build, then create the device
        script: |
          set -eu
          export RUNNER_TEMP=/tmp/fw
          sh .github/scripts/check-simulator.sh --create 2>&1 | tee "$RUNNER_TEMP/result/check-simulator.txt"
      - name: verify the snapshot against snapshot.lock.json
        script: |
          set -eu
          node .github/scripts/verify-snapshot.mjs
      - name: ios_webkit_debug_proxy (preinstalled, else the cached kegs, else brew)
        script: |
          set -eu
          prefix=$(brew --prefix)
          dir="$HOME/fw-iwdp"
          how=preinstalled
          if ! command -v ios_webkit_debug_proxy > /dev/null 2>&1; then
            how=brew
            if [ -f "$dir/kegs.txt" ] && tar -xf "$dir/kegs.tar" -C "$prefix/Cellar" \
              && while read -r k; do ln -sfn "../Cellar/$k" "$prefix/opt/${k%/*}"; done < "$dir/kegs.txt" \
              && brew link --overwrite ios-webkit-debug-proxy > /dev/null \
              && ios_webkit_debug_proxy --help > /dev/null 2>&1; then
              how=cache
            else
              rm -rf "$dir"; mkdir -p "$dir"
              find "$prefix/Cellar" -mindepth 2 -maxdepth 2 -type d | sed "s|^$prefix/Cellar/||" | LC_ALL=C sort > "$dir/before.txt"
              brew install ios-webkit-debug-proxy
              find "$prefix/Cellar" -mindepth 2 -maxdepth 2 -type d | sed "s|^$prefix/Cellar/||" | LC_ALL=C sort > "$dir/after.txt"
              LC_ALL=C comm -13 "$dir/before.txt" "$dir/after.txt" > "$dir/kegs.txt"
              tar -cf "$dir/kegs.tar" -C "$prefix/Cellar" -T "$dir/kegs.txt"
              rm "$dir/before.txt" "$dir/after.txt"
            fi
          fi
          command -v ios_webkit_debug_proxy
          echo "ios_webkit_debug_proxy: $how" | tee -a /tmp/fw/result/tools.txt
          brew list --versions ios-webkit-debug-proxy | tee -a /tmp/fw/result/tools.txt || true
      - name: boot the Simulator (kept booted for the whole job)
        script: |
          set -eu
          export RUNNER_TEMP=/tmp/fw
          xcrun simctl shutdown all || true
          udid=$(cat "$RUNNER_TEMP/fw-sim-udid.txt")
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
      - name: determinism sessions (the cell's sessions, 2 passes each)
        script: |
          set -u
          export RUNNER_TEMP=/tmp/fw
          export FW_SNAPSHOT_SITE="$PWD/snapshot/site"
          echo "cell: target=$FW_TARGET preset=$FW_PRESET fw=$FW_FW vm=$FW_VM sessions=$FW_SESSIONS"
          if [ "$FW_TARGET" != original ]; then
            echo "the rewrite arm needs the site-dist build of the GitHub site job; this machine runs the original arm only"
            echo 2 > "$RUNNER_TEMP/determinism.rc"
            exit 0
          fi
          cd packages/measure-webkit
          mkdir -p out
          rc=0
          for s in $(seq 1 "$FW_SESSIONS"); do
            node src/cli.mjs determinism --runs 2 --keep --out "out/$FW_VM-session-$s.json" > "out/$FW_VM-session-$s.md" 2> "out/$FW_VM-session-$s.log"
            r=$?
            cat "out/$FW_VM-session-$s.md"
            tail -n 40 "out/$FW_VM-session-$s.log"
            [ "$rc" -eq 0 ] && rc=$r
          done
          echo "$rc" > "$RUNNER_TEMP/determinism.rc"
          exit 0
      - name: keep logs and host state (same file names as the GitHub webkit-sim-r<n> artifact)
        script: |
          set -u
          export RUNNER_TEMP=/tmp/fw
          mkdir -p "$CM_BUILD_DIR/fw-result" "$CM_BUILD_DIR/fw-extra"
          cp packages/measure-webkit/out/"$FW_VM"-* "$CM_BUILD_DIR/fw-result/" 2>/dev/null || true
          sh .github/scripts/runner-info.sh "$CM_BUILD_DIR/fw-result/runner.json" || true
          cp "$RUNNER_TEMP/result/tools.txt" "$CM_BUILD_DIR/fw-result/" 2>/dev/null || true
          { uptime; xcrun simctl list devices booted; ps -axo pid,pcpu,rss,comm | sort -k2 -nr | head -15; } > "$CM_BUILD_DIR/fw-extra/host.txt" 2>&1 || true
          echo "tool-start $(cat "$RUNNER_TEMP/t0") end $(date +%s)" > "$CM_BUILD_DIR/fw-extra/wall.txt"
          cp "$RUNNER_TEMP/result/check-simulator.txt" "$CM_BUILD_DIR/fw-extra/" 2>/dev/null || true
          xcrun simctl shutdown all || true
          xcrun simctl delete "$FW_SIM_NAME" || true
          rc=$(cat "$RUNNER_TEMP/determinism.rc" 2>/dev/null || echo 99)
          echo "determinism exit status: $rc"
          exit "$rc"
    cache:
      cache_paths:
        - $HOME/fw-iwdp
    artifacts:
      - fw-result/*
      - fw-extra/*
