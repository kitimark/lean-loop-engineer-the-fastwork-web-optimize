version: 2.1

# CircleCI pilot (task circleci-pilot; docs/team/tools/circleci.md). A second runner for two GitHub lanes, run side by side so
# the pair verdicts, durations, queue times and credits can be compared (Lean lean/Fw/Ci/Provider.lean, golden
# packages/contracts/golden/ci/provider.jsonl; glue scripts/circleci.mjs). Counts and verdicts only: nothing measured here
# is phone time.
#
# It starts only when scripts/circleci.mjs (or `pnpm fw ci circleci trigger`) asks for it through the API with the pipeline
# parameter `lane`. A plain push to ci/* creates a pipeline whose `lane` is empty, so no workflow below matches and no credit
# is spent. Both workflows are also guarded on the branch name (ci/ prefix).
#
# Every job writes the result files of its GitHub twin (artifacts) plus timings.json: per-step spans in the
# .fw-console/timings.jsonl format ({tool, step, startMs, durMs, exit, commit, load, host}) wrapped with the job, class and
# commit. The queue span (created to started) is added by scripts/circleci.mjs from the API, not by the job.
# The premise jobs build no Lean: their cache is the pnpm store (about 10 MiB archived), keyed by pnpm-lock.yaml; the land job has a Lake cache (below). It is saved only when the key is new: CircleCI cannot condition save_cache and sets no "restored" flag,
# so cache-probe / cache-gate (.circleci/job.sh) halt the job (`circleci-agent step halt`) before save_cache when the restored
# store already belongs to this lockfile. The key is v2 because a v1 cache is immutable and carries no marker. The ledger reads the real saves from the job steps (scripts/circleci.mjs).
#
# Not ported on purpose: the GitHub guard job (changed-inputs) and the "tip re-check" steps: the API trigger names the
# branch and the pilot is started by hand, one pair at a time.

parameters:
  lane:
    description: Which lane to run, empty for none. premise-tests, webkit-sim or land.
    type: string
    default: ""
  legs:
    description: The land legs to run when lane is land, comma separated (check-sh, suites-a, suites-b, chromium, playwright-webkit; the names of lean/land-legs.txt).
    type: string
    default: ""
  resource_class:
    description: Class of the Linux Arm jobs (Free plan, OSS pool). The gen2 names are CONFIRMED (accepted by pipelines 15 and 16); arm.medium and arm.large are the fallback if they are refused.
    type: enum
    enum: [arm.medium.gen2, arm.large.gen2, arm.medium, arm.large]
    default: arm.medium.gen2
  xcode:
    description: Xcode image of the webkit-sim job (the image that carries the pinned iOS 27.0 runtime, build 24A434).
    type: string
    default: "27.0.0"

commands:
  mark:
    description: Remember the time now as the start of a step that CircleCI itself runs (checkout, cache restore).
    steps:
      - run:
          name: mark time
          command: mkdir -p /tmp/fw && { date +%s%N 2>/dev/null | grep -v N || echo "$(( $(date +%s) * 1000 ))000000"; } > /tmp/fw/mark
  since:
    description: Record a span from the last mark to now.
    parameters:
      step: {type: string}
    steps:
      - run:
          name: span << parameters.step >>
          command: sh .circleci/job.sh since "<< parameters.step >>"
  finish:
    description: Write timings.json and the artifacts directory, also after a failure.
    steps:
      - run:
          name: timings.json
          when: always
          command: sh .circleci/job.sh finish
      - store_artifacts:
          when: always
          path: /tmp/fw/artifacts

jobs:
  engine:
    parameters:
      engine:
        type: enum
        enum: [chromium, playwright-webkit]
      rc:
        type: enum
        enum: [arm.medium.gen2, arm.large.gen2, arm.medium, arm.large]
    machine:
      image: ubuntu-2404:current
    resource_class: << parameters.rc >>
    environment:
      FW_CI_JOB: engine-<< parameters.engine >>
      FW_CI_CLASS: << parameters.rc >>
      FW_CI_ENGINE: << parameters.engine >>
      # Same pinned browser as .github/workflows/premise-tests.yml.
      HS_VERSION: 156.0.8078.4
      HS_SHA256: 81ab9d4d3c301dc5fdfb6c541b9e6632b16fc819a6a854460f40a76fe2b2c476
    steps:
      - mark
      - checkout
      - since:
          step: checkout
      - run:
          name: toolchain (node 24, pnpm)
          command: sh .circleci/job.sh toolchain
      - mark
      - restore_cache:
          keys:
            - pnpm-store-v2-{{ checksum "pnpm-lock.yaml" }}
      - since:
          step: cache restore
      - run:
          name: pnpm cache current for this lockfile?
          command: sh .circleci/job.sh cache-probe
      - run:
          name: deps install
          command: sh .circleci/job.sh install "@fw/gate-breakpoints @fw/premise-tests"
      - run:
          name: browser and system libraries
          command: sh .circleci/job.sh browser
      - run:
          name: premise tests
          command: sh .circleci/job.sh test
      - persist_to_workspace:
          root: /tmp/fw/ws
          paths:
            - premise-results
      - finish
      - run:
          name: pnpm cache gate (halts the job here when the restored cache is current)
          command: sh .circleci/job.sh cache-gate
      - save_cache:
          key: pnpm-store-v2-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.local/share/pnpm/store
            - ~/.fw-cache

  verdict:
    parameters:
      rc:
        type: enum
        enum: [arm.medium.gen2, arm.large.gen2, arm.medium, arm.large]
    machine:
      image: ubuntu-2404:current
    resource_class: << parameters.rc >>
    environment:
      FW_CI_JOB: verdict
      FW_CI_CLASS: << parameters.rc >>
    steps:
      - mark
      - checkout
      - since:
          step: checkout
      - run:
          name: toolchain (node 24, pnpm)
          command: sh .circleci/job.sh toolchain
      - mark
      - restore_cache:
          keys:
            - pnpm-store-v2-{{ checksum "pnpm-lock.yaml" }}
      - since:
          step: cache restore
      - run:
          name: deps install
          command: sh .circleci/job.sh install "@fw/runner..."
      - attach_workspace:
          at: /tmp/fw/ws
      - run:
          name: premises against the Lean registry
          command: sh .circleci/job.sh verdict
      - finish

  webkit-sim:
    parameters:
      xcode:
        type: string
    macos:
      xcode: << parameters.xcode >>
    resource_class: m4pro.medium
    environment:
      FW_CI_JOB: webkit-sim
      FW_CI_CLASS: m4pro.medium
      FW_IOS_VERSION: "27.0"
      FW_IOS_BUILD: 24A434
      FW_SIM_NAME: fw-iphone-27
      # The same waits and retries as the GitHub xcode-27 job (counts do not depend on waits).
      FW_WK_TIMEOUT_SCALE: "8"
      FW_WK_ATTEMPTS: "3"
    steps:
      - mark
      - checkout
      - since:
          step: checkout
      - run:
          name: toolchain (node 24, pnpm)
          command: sh .circleci/job.sh toolchain
      - run:
          name: pinned runtime, device, snapshot check, ios_webkit_debug_proxy
          command: sh .circleci/job.sh sim-prepare
      - run:
          name: deps install
          command: sh .circleci/job.sh install "@fw/measure-webkit..."
      - run:
          name: boot the Simulator
          command: sh .circleci/job.sh sim-boot
      - run:
          name: determinism session (original arm, 1 session)
          command: sh .circleci/job.sh sim-run
          no_output_timeout: 50m
      - run:
          name: delete the Simulator
          when: always
          command: sh .circleci/job.sh sim-delete
      - finish

  # The land lane (task land-lane-circleci): one leg of .github/workflows/land.yml, same entry (`pnpm fw checks --affected --tier remote
  # --leg <leg>`), same lane digest. Linux Arm, the same class as the premise jobs.
  # The Lake cache (task circleci-lean-cache): the legs took 450-579 s on CircleCI against 63-127 s on GitHub, INFERRED from the cold
  # Lean build. The key is built like .github/actions/setup-lean: toolchain + Lake manifest + Lean sources (job.sh lake-key writes the
  # two hash strings that `checksum` reads), the restore key is the toolchain + manifest prefix. Every leg restores; a leg saves only
  # when the exact key was not restored (lake-probe / lake-gate, the pnpm-cache trick: CircleCI has no "restored" flag and no
  # condition on save_cache), so one entry is stored per key and the storage stop rule (1 GB-month) counts one upload. The first
  # writer of a key wins (CircleCI caches are immutable), whichever leg that is. Bump `lake-v1` in both keys to force a fresh entry.
  land:
    parameters:
      leg:
        type: enum
        enum: [check-sh, suites-a, suites-b, chromium, playwright-webkit]
      rc:
        type: enum
        enum: [arm.medium.gen2, arm.large.gen2, arm.medium, arm.large]
    machine:
      image: ubuntu-2404:current
    resource_class: << parameters.rc >>
    environment:
      FW_CI_JOB: land-<< parameters.leg >>
      FW_CI_CLASS: << parameters.rc >>
      # Same pinned browser as .github/workflows/land.yml.
      HS_VERSION: 156.0.8078.4
      HS_SHA256: 81ab9d4d3c301dc5fdfb6c541b9e6632b16fc819a6a854460f40a76fe2b2c476
    steps:
      - mark
      - checkout
      - since:
          step: checkout
      - run:
          name: Lake cache key (hash strings)
          command: sh .circleci/job.sh lake-key
      - mark
      - restore_cache:
          keys:
            - lake-v1-arm64-{{ checksum "/tmp/fw/lake-tm.key" }}-{{ checksum "/tmp/fw/lake-src.key" }}
            - lake-v1-arm64-{{ checksum "/tmp/fw/lake-tm.key" }}-
      - since:
          step: lake cache restore
      - run:
          name: Lake cache current for this key?
          command: sh .circleci/job.sh lake-probe
      - run:
          name: toolchain (node 24, pnpm)
          command: sh .circleci/job.sh toolchain
      - run:
          name: Lean toolchain (pinned elan)
          command: sh .circleci/job.sh land-lean
      - run:
          name: main ref and commit identity
          command: sh .circleci/job.sh land-setup
      - run:
          name: deps install (package filter from Lean)
          command: sh .circleci/job.sh install "$(cat lean/land-filter.txt)"
      - run:
          name: fwcore build
          command: sh .circleci/job.sh land-fwcore
          no_output_timeout: 30m
      - run:
          name: actionlint (pinned, sha256-checked)
          command: sh .circleci/job.sh land-actionlint
      - run:
          name: suites (the remote tier of the Lean-selected checks)
          command: sh .circleci/job.sh land-suites << parameters.leg >>
          no_output_timeout: 30m
      - run:
          name: browser suite
          command: sh .circleci/job.sh land-engine << parameters.leg >>
          no_output_timeout: 30m
      - finish
      - run:
          name: Lake cache gate (halts the job here when the exact key was restored)
          command: sh .circleci/job.sh lake-gate
      - save_cache:
          key: lake-v1-arm64-{{ checksum "/tmp/fw/lake-tm.key" }}-{{ checksum "/tmp/fw/lake-src.key" }}
          paths:
            - ~/.fw-lake

workflows:
  premise-tests:
    when: pipeline.parameters.lane == "premise-tests" and pipeline.git.branch starts-with "ci/"
    jobs:
      - engine:
          name: engine-chromium
          engine: chromium
          rc: << pipeline.parameters.resource_class >>
      - engine:
          name: engine-playwright-webkit
          engine: playwright-webkit
          rc: << pipeline.parameters.resource_class >>
      - verdict:
          rc: << pipeline.parameters.resource_class >>
          requires: [engine-chromium, engine-playwright-webkit]

  webkit-sim:
    when: pipeline.parameters.lane == "webkit-sim" and pipeline.git.branch starts-with "ci/"
    jobs:
      - webkit-sim:
          xcode: << pipeline.parameters.xcode >>

  land-check-sh:
    when:
      and:
        - equal: [land, << pipeline.parameters.lane >>]
        - matches: {pattern: "^(.*,)?check-sh(,.*)?$", value: << pipeline.parameters.legs >>}
        - matches: {pattern: "^ci/.*", value: << pipeline.git.branch >> }
    jobs:
      - land:
          name: land-check-sh
          leg: check-sh
          rc: << pipeline.parameters.resource_class >>

  land-suites-a:
    when:
      and:
        - equal: [land, << pipeline.parameters.lane >>]
        - matches: {pattern: "^(.*,)?suites-a(,.*)?$", value: << pipeline.parameters.legs >>}
        - matches: {pattern: "^ci/.*", value: << pipeline.git.branch >> }
    jobs:
      - land:
          name: land-suites-a
          leg: suites-a
          rc: << pipeline.parameters.resource_class >>

  land-suites-b:
    when:
      and:
        - equal: [land, << pipeline.parameters.lane >>]
        - matches: {pattern: "^(.*,)?suites-b(,.*)?$", value: << pipeline.parameters.legs >>}
        - matches: {pattern: "^ci/.*", value: << pipeline.git.branch >> }
    jobs:
      - land:
          name: land-suites-b
          leg: suites-b
          rc: << pipeline.parameters.resource_class >>

  land-chromium:
    when:
      and:
        - equal: [land, << pipeline.parameters.lane >>]
        - matches: {pattern: "^(.*,)?chromium(,.*)?$", value: << pipeline.parameters.legs >>}
        - matches: {pattern: "^ci/.*", value: << pipeline.git.branch >> }
    jobs:
      - land:
          name: land-chromium
          leg: chromium
          rc: << pipeline.parameters.resource_class >>

  land-playwright-webkit:
    when:
      and:
        - equal: [land, << pipeline.parameters.lane >>]
        - matches: {pattern: "^(.*,)?playwright-webkit(,.*)?$", value: << pipeline.parameters.legs >>}
        - matches: {pattern: "^ci/.*", value: << pipeline.git.branch >> }
    jobs:
      - land:
          name: land-playwright-webkit
          leg: playwright-webkit
          rc: << pipeline.parameters.resource_class >>
