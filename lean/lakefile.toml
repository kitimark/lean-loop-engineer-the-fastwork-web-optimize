name = "fwcore"
version = "0.1.0"
defaultTargets = ["Fw", "fwcore", "mathview", "breakgen", "propslint"]
# `lake test` runs `fwcore fwtest` (task lean-bin-slim: one executable in place of fwcore, fwtest, sweepsgen and
# partsgolden; Fw.Ops.FwCoreRoute).
testDriver = "fwcore"
testDriverArgs = ["fwtest"]
# Lake's local artifact cache (Lake/Config/PackageConfig.lean:289@eb6cafb): build products are also stored in the
# toolchain's offline cache and hard-linked back (Lake/Build/Common.lean:489,652), so a fresh worktree builds from it.
enableArtifactCache = true
# Hard-link every cached artifact (.olean included) back into .lake/build (Lake/Config/PackageConfig.lean:291-301,
# Lake/Build/Module.lean:816-832,1058-1069@eb6cafb). Lake's default restores only the .ilean, so a build served from
# the cache leaves no .olean in .lake/build, and `lake exe mathview` (importModules over .lake/build/lib/lean) failed
# on every CI run with a restored cache. Restoring is a hard link (Lake/Build/Common.lean:648-654), so it stays cheap.
restoreAllArtifacts = true

# Mathlib-free on purpose (PLAN §5.2): core Lean only, no `require`.

[leanOptions]
autoImplicit = false

[[lean_lib]]
name = "Fw"
# every module under Fw/ (so new subtrees such as Fw/Site/ build without editing this file)
globs = ["Fw.*"]

# Also `fwcore fwtest|sweepsgen|partsgolden <args>`: the former executables' entry points, importable through
# the library FwCoreCli (Fw.Ops.FwCoreRoute).
[[lean_exe]]
name = "fwcore"
root = "Main"

[[lean_lib]]
name = "FwCoreCli"
roots = ["FwTestMain", "SweepsgenMain"]

# The site build runs `breakgen --check`, so its root imports only Fw.Site.BreakpointGen (task site-build-cache).
[[lean_exe]]
name = "breakgen"
root = "BreakgenMain"

# The properties lint (scripts/PropsLint.lean) as a compiled executable. Run through `lean --run`, the interpreter has
# already mapped the `Lean` oleans of the script's own `import Lean`, so `importModules` of the same files reads each
# one into the heap a second time: 2.3 GB peak footprint. Compiled, nothing is mapped before the import: 0.7 GB
# (MEASURED 2026-10-21, `lake env /usr/bin/time -l`; task local-mem-budget).
[[lean_exe]]
name = "propslint"
root = "PropsLint"
srcDir = "scripts"

[[lean_lib]]
name = "MathView"

[[lean_exe]]
name = "mathview"
root = "MathViewMain"
supportInterpreter = true

[[lean_lib]]
name = "FwTest"
